name: Tideforge source cache
description: Restore the content-addressed source store for one recipe
inputs:
  recipe:
    description: Path to the package.yaml recipe
    required: true
outputs:
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        echo "key=tideforge-src-v1-$(python3 scripts/tideforge_cache.py key "${INPUTS_RECIPE}")" >> "$GITHUB_OUTPUT"
      env:
        INPUTS_RECIPE: ${{ inputs.recipe }}
    - id: restore
      # actions/cache v6.0.0
      uses: actions/cache@v6.1.0  # zizmor: ignore[unpinned-uses] exact tag locked in actions.lock through the workflows that call this action as $/
      with:
        path: ~/.cache/tideforge/sources
        key: ${{ steps.key.outputs.key }}
