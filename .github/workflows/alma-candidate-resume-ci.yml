name: Alma Candidate Resume CI

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      phase:
        description: Run produce first, then resume at the same source SHA
        required: true
        type: choice
        options: [produce, resume]

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  native-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install CI tools
        run: |
          python -m pip install pyyaml==6.0.3
          sudo apt-get update -q
          sudo apt-get install -y -q createrepo-c rpm gnupg
      - name: Exercise real native candidate lifecycle
        env:
          PHASE: ${{ inputs.phase }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-alma-candidate-resume-ci.sh
      - name: Attest exact native candidate snapshot
        id: attestation
        if: inputs.phase == 'produce'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .factory/ci-alma-resume/native-snapshot/snapshot.json
      - name: Stage attestation bundle
        if: inputs.phase == 'produce'
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" .factory/ci-alma-resume/native-snapshot/bundle.jsonl
      - name: Upload immutable native candidate
        if: inputs.phase == 'produce'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-alma-resume-alma-candidate-${{ github.run_id }}-${{ github.run_attempt }}-ci
          path: .factory/ci-alma-resume/native-snapshot/
          if-no-files-found: error
      - name: Retain admission proof and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alma-resume-ci-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .factory/ci-alma-resume/candidate/
            .factory/ci-alma-resume/candidate-meta/candidate-public.gpg
            .factory/ci-alma-resume/candidate-meta/candidate-identity.json
            .factory/ci-alma-resume/candidate-resume/
            .factory/ci-alma-resume/artifacts/buildroots/
          if-no-files-found: warn
