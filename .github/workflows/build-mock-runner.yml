name: Build Mock Runner Image
# Builds and pushes ghcr.io/tuna-os/mock-runner:centos-stream-10
# Image is just Fedora + mock toolchain. The CentOS Stream 10 environment
# is pulled at build time via mock's use_bootstrap_image.

on:
  push:
    branches: [main]
    paths:
      # Any mock config, not just the cs10 one: the configs are baked into the
      # image, so editing one in the repo has no effect until the image is
      # rebuilt. Listing them individually meant a new chroot (or an edit to a
      # gnome config) shipped silently stale.
      - 'mock/Containerfile'
      - 'mock/*.cfg'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tuna-os/mock-runner
  TAG: centos-stream-10

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          echo "${{ env.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          podman build \
            --pull=always \
            -f mock/Containerfile \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${TAG}-${{ github.sha }}" \
            mock/

      - name: Push image
        run: |
          podman push "${IMAGE}:${TAG}"
          podman push "${IMAGE}:${TAG}-${{ github.sha }}"

      - name: Inspect
        run: podman images "${IMAGE}:${TAG}" --format "{{.Repository}}:{{.Tag}}  {{.Size}}"

  # Separate tag, not a multi-arch manifest under :centos-stream-10 — mock's
  # own chroot content (pulled at build time via use_bootstrap_image) is
  # already architecture-agnostic per-run, so there is no correctness reason
  # to fuse the two into one manifest list, and keeping them as distinct tags
  # means an aarch64-only rebuild never touches the x86_64 image other
  # workflows already depend on.
  build-and-push-aarch64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          echo "${{ env.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          podman build \
            --pull=always \
            -f mock/Containerfile \
            -t "${IMAGE}:${TAG}-aarch64" \
            -t "${IMAGE}:${TAG}-aarch64-${{ github.sha }}" \
            mock/

      - name: Push image
        run: |
          podman push "${IMAGE}:${TAG}-aarch64"
          podman push "${IMAGE}:${TAG}-aarch64-${{ github.sha }}"

      - name: Inspect
        run: podman images "${IMAGE}:${TAG}-aarch64" --format "{{.Repository}}:{{.Tag}}  {{.Size}}"
