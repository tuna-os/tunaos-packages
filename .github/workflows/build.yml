name: Build and Publish RPMs

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Build only this tier (leave empty for all)'
        required: false
        default: ''
      packages:
        description: 'Build only this package path (e.g. src/deps/meson)'
        required: false
        default: ''
      jobs:
        description: 'Parallel builds within a tier (default: nproc/2)'
        required: false
        default: ''
      image:
        description: 'Mock runner image (override pre-built default)'
        required: false
        default: ''

env:
  R2_BUCKET: bluefin
  LOCAL_REPO: ${{ github.workspace }}/local-repo
  MOCK_RUNNER_IMAGE: ghcr.io/tuna-os/mock-runner:centos-stream-10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            podman createrepo-c rpm python3-yaml \
            gpg gpgconf
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Cache CentOS Stream 10 container image
        id: cache-cs10
        uses: actions/cache@v6
        with:
          path: /tmp/cs10-image.tar
          key: cs10-image-${{ hashFiles('mock/centos-stream-10-ci.cfg') }}

      - name: Load or pull CentOS Stream 10 image
        run: |
          if [[ -f /tmp/cs10-image.tar ]]; then
            echo "Restoring cached image..."
            podman load -i /tmp/cs10-image.tar
          else
            echo "Pulling quay.io/centos/centos:stream10..."
            podman pull quay.io/centos/centos:stream10
            podman save -o /tmp/cs10-image.tar quay.io/centos/centos:stream10
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_committer_name: RPM Builder
          git_committer_email: rpm-signing@tunaos.org

      - name: Configure RPM macros
        run: |
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${{ steps.import-gpg.outputs.keyid }}" >> ~/.rpmmacros
          echo "%__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --use-agent --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p ~/.config/rclone
          umask 077
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
          EOF

      - name: Pull mock runner image
        env:
          MOCK_IMAGE: ${{ github.event.inputs.image || env.MOCK_RUNNER_IMAGE }}
        run: |
          podman pull "${MOCK_IMAGE}"

      - name: Seed local repo from R2
        run: |
          mkdir -p "${LOCAL_REPO}"
          echo "Downloading existing repo from R2 (10-stream-x86_64)..."
          rclone sync "r2:${R2_BUCKET}/repo/10-stream-x86_64/" "${LOCAL_REPO}/" \
            --exclude "repodata/**" || true
          echo "Initializing local repo metadata..."
          createrepo_c "${LOCAL_REPO}"

      - name: Build packages
        env:
          BUILD_IMAGE: ${{ github.event.inputs.image || env.MOCK_RUNNER_IMAGE }}
          BUILD_TIER: ${{ github.event.inputs.tier || '' }}
          BUILD_PACKAGES: ${{ github.event.inputs.packages || '' }}
          BUILD_JOBS: ${{ github.event.inputs.jobs || '' }}
        run: |
          ARGS=(
            --backend podman
            --image   "${BUILD_IMAGE}"
            --local-repo "${LOCAL_REPO}"
          )
          if [[ -n "${BUILD_TIER}" ]]; then
            ARGS+=(--tier "${BUILD_TIER}")
          fi
          if [[ -n "${BUILD_PACKAGES}" ]]; then
            ARGS+=(--package "${BUILD_PACKAGES}")
          fi
          if [[ -n "${BUILD_JOBS}" ]]; then
            ARGS+=(--jobs "${BUILD_JOBS}")
          fi
          ./scripts/build-chain.sh "${ARGS[@]}"

      - name: Sign RPMs
        run: |
          find "${LOCAL_REPO}" -name "*.rpm" -newer "${LOCAL_REPO}/repodata/repomd.xml" \
            -exec rpmsign --addsign {} \;
          createrepo_c --update "${LOCAL_REPO}"

      - name: Upload to R2
        run: |
          echo "Uploading to 10-stream-x86_64 (CentOS Stream 10)..."
          rclone sync "${LOCAL_REPO}/" "r2:${R2_BUCKET}/repo/10-stream-x86_64/"

          echo "Uploading to 10-x86_64 (AlmaLinux 10)..."
          rclone sync "${LOCAL_REPO}/" "r2:${R2_BUCKET}/repo/10-x86_64/"

      - name: Upload GPG public key
        run: |
          rclone copyto public.gpg "r2:${R2_BUCKET}/public.gpg"
          rclone copyto contrib/install.sh "r2:${R2_BUCKET}/install.sh"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rpm-builds
          path: ${{ env.LOCAL_REPO }}/
          retention-days: 7
