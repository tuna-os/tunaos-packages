name: Bump Stable Package Sources

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  niri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1  # zizmor: ignore[artipacked] create-pull-request later in this job uses the persisted git credentials
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - run: pip install pyyaml
      - run: python3 scripts/bump-github-release-recipe.py packages/niri/package.yaml --repo niri-wm/niri
      - run: python3 scripts/tideforge.py validate packages/niri/package.yaml
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          branch: automation/bump-niri-stable
          delete-branch: true
          title: 'chore(niri): bump to latest stable release'
          commit-message: 'chore(niri): bump to latest stable release'
          body: |
            Automated stable-source bump. CI must render, build, stage-install,
            and pass the Niri desktop smoke gate before this can merge.
          labels: dependencies, package-factory
