# CAS garbage collection: report-only mark-and-sweep reachability check (#430 step 5 / #485).
# Measures reachability across R2 CAS storage (ActionResults and blobs), evaluates
# age grace periods, records tombstones, and emits a structured report without deleting
# any objects.
name: CAS Reachability & Garbage Collection (Report-Only)

on:
  schedule:
    # 04:00 UTC weekly on Sundays
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      grace_period_days:
        description: 'Age grace period in days (blobs younger than this are protected)'
        required: false
        default: '7'
      bucket:
        description: 'R2 bucket name'
        required: false
        default: 'bluefin'

permissions:
  contents: read

jobs:
  report:
    name: CAS GC Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          pip install --quiet pyyaml requests

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            mkdir -p ~/.config/rclone
            umask 077
            cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
          EOF
          else
            echo "R2 credentials not set; skipping rclone config"
          fi

      - name: Inventory R2 CAS objects
        env:
          BUCKET: ${{ inputs.bucket || 'bluefin' }}
        run: |
          set -euo pipefail
          mkdir -p .cache/inventory .cache/cas/actions
          if [ -f ~/.config/rclone/rclone.conf ]; then
            echo "Listing CAS blobs from r2:${BUCKET}/blobs/..."
            if ! rclone lsf --recursive --files-only --format "pst" "r2:${BUCKET}/blobs/" > .cache/inventory/r2-blobs.txt; then
              echo "::warning::could not list r2:${BUCKET}/blobs/; reporting an empty CAS"
              : > .cache/inventory/r2-blobs.txt
            fi
            sed 's|^|blobs/|' .cache/inventory/r2-blobs.txt > .cache/inventory/r2-lsf.txt
            # ActionResults are the mark roots. Without them every blob past
            # the grace period would be reported as a sweep candidate.
            echo "Downloading ActionResults from r2:${BUCKET}/actions/..."
            rclone copy "r2:${BUCKET}/actions/" .cache/cas/actions/
          fi

      - name: Run CAS Mark-and-Sweep Reachability Report
        env:
          GRACE_DAYS: ${{ inputs.grace_period_days || '7' }}
        run: |
          ARGS=(
            --grace-period-days "${GRACE_DAYS}"
            --json cas-gc-report.json
            --markdown cas-gc-report.md
            --tombstones-dir tombstones/
            --summary
          )
          if [ -s .cache/inventory/r2-lsf.txt ]; then
            ARGS+=(--inventory-lsf .cache/inventory/r2-lsf.txt --actions-dir .cache/cas/actions)
          fi
          python3 scripts/cas_gc.py "${ARGS[@]}"

      - name: Upload CAS GC artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: cas-gc-report
          path: |
            cas-gc-report.json
            cas-gc-report.md
            tombstones/
