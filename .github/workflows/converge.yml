name: Converge

# One dispatch, run until it is done or genuinely stuck.
#
# A build-chain wave does not finish a desktop. It builds what fits in its
# runners and its clock, publishes what it built, and leaves a residue. So
# closing a target has always meant a human in the loop: dispatch, wait
# hours, count what the index serves, decide, dispatch again. The GNOME 51
# night of 2026-08-28 was four waves driven exactly that way, and three of
# the four decisions were mechanical -- "the index moved, the gap is still
# open, go again".
#
# This workflow makes those three decisions itself and stops at the fourth.
# Each wave is the SAME fan-out a hand dispatch runs; the only thing added
# is a measurement between waves (scripts/plan-converge.py) and a rule for
# what it means:
#
#   every stage closed  packages-ready -- everything a session needs is served
#   the open stage advanced  continue   -- the wave moved the STACK, go again
#   the open stage stood still  blocked -- rebuilding cannot fix this
#   waves spent              budget     -- report the residue and stop
#
# The objective is scripts/stack_readiness.py's ordered stages, not a count
# over the build order. Measured on the live hummingbird index 2026-08-28, the
# same repo reads 580/673 over the order and 3/10 over the packages a GNOME
# session requires; a loop optimising the first spends waves on vdirsyncer and
# hplip while gdm and gnome-shell are absent.
#
# The terminal verdict is `packages-ready`, never `done`. Nothing here proves a
# desktop boots -- tunaOS's .github/green-criteria.yml defines that, and only
# its Gate (QEMU boot, TUNAOS_DESKTOP_CONTRACT_OK on ttyS0) can assert it. What
# this side asserts is the negative that was costing whole runs: while the
# contract stage is open, an image build CANNOT boot into a session.
#
# `blocked` is the interesting verdict and the reason this is a loop rather
# than a `for`. It is the loop reaching the edge of what rebuilding can fix,
# and it hands the residue over as a classified blocker list
# (scripts/classify-chain-failures.py) rather than burning more runners on a
# wall. See docs/rfc/rfc012-request-driven-convergence.md.
#
# Why the waves are jobs in ONE run rather than the workflow re-dispatching
# itself: a workflow_dispatch made with the default GITHUB_TOKEN does not
# start a new run (GitHub's recursion guard), so self-dispatch would need a
# PAT -- a stored credential that can start any workflow, added to make a
# loop that an `if:` chain expresses without one. The chain is also visible:
# the whole convergence is one run graph rather than a trail of runs to
# correlate.
#
# Scope: hummingbird, because build-chain-fanout.yml is scoped to the
# hummingbird cells. Generalising is that file's band blocks, not this one.

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'What to build, e.g. "gnome 51 on hummingbird"'
        required: false
        default: gnome 51 on hummingbird
        type: string
      max_waves:
        description: "Waves to spend before reporting the residue (1-3)"
        required: false
        default: "3"
        type: string
      shards:
        description: "Shards per band per arch, passed to each wave"
        required: false
        default: "8"
        type: string
      dry_run:
        description: "Build and index but do not sync to R2"
        required: false
        default: false
        type: boolean
  schedule:
    # After the nightly desktops build and the 09:15 gap re-measure, so a
    # scheduled convergence starts from the freshest build order rather than
    # racing the workflow that regenerates it.
    - cron: '30 10 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  # Not the publish group: this workflow does not touch the bucket itself,
  # its waves do, and they carry their own. What must not overlap is two
  # convergences of the same request measuring and dispatching against each
  # other.
  group: converge-${{ inputs.request || 'gnome 51 on hummingbird' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- wave 1
  measure-1:
    name: Measure (wave 1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      open_stage: ${{ steps.decide.outputs.open_stage }}
      open_remaining: ${{ steps.decide.outputs.open_remaining }}
      served: ${{ steps.decide.outputs.served }}
      wanted: ${{ steps.decide.outputs.wanted }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --disable-pip-version-check --quiet PyYAML zstandard
      - name: Resolve the request against the contract
        id: resolve
        env:
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
        run: bash .github/scripts/converge-resolve.sh
      - name: Measure the gap against the published index
        id: decide
        env:
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
          WAVE: '1'
          MAX_WAVES: ${{ inputs.max_waves || '3' }}
        run: bash .github/scripts/converge-measure.sh

  wave-1:
    name: Wave 1
    needs: measure-1
    if: ${{ needs.measure-1.outputs.verdict == 'continue' }}
    uses: ./.github/workflows/build-chain-fanout.yml
    secrets: inherit
    with:
      shards: ${{ inputs.shards || '8' }}
      dry_run: ${{ inputs.dry_run || false }}

  # ---------------------------------------------------------------- wave 2
  measure-2:
    name: Measure (wave 2)
    needs: [measure-1, wave-1]
    # !cancelled(): a wave with red shards still published what it built, and
    # that is exactly the movement this measurement is here to detect. Only a
    # cancelled run stops the loop.
    if: ${{ !cancelled() && needs.measure-1.outputs.verdict == 'continue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      open_stage: ${{ steps.decide.outputs.open_stage }}
      open_remaining: ${{ steps.decide.outputs.open_remaining }}
      served: ${{ steps.decide.outputs.served }}
      wanted: ${{ steps.decide.outputs.wanted }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --disable-pip-version-check --quiet PyYAML zstandard
      - name: Measure the gap against the published index
        id: decide
        env:
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
          WAVE: '2'
          MAX_WAVES: ${{ inputs.max_waves || '3' }}
          PREVIOUS_STAGE: ${{ needs.measure-1.outputs.open_stage }}
          PREVIOUS_REMAINING: ${{ needs.measure-1.outputs.open_remaining }}
        run: bash .github/scripts/converge-measure.sh

  wave-2:
    name: Wave 2
    needs: measure-2
    if: ${{ !cancelled() && needs.measure-2.outputs.verdict == 'continue' }}
    uses: ./.github/workflows/build-chain-fanout.yml
    secrets: inherit
    with:
      shards: ${{ inputs.shards || '8' }}
      dry_run: ${{ inputs.dry_run || false }}

  # ---------------------------------------------------------------- wave 3
  measure-3:
    name: Measure (wave 3)
    needs: [measure-1, measure-2, wave-2]
    if: ${{ !cancelled() && needs.measure-2.outputs.verdict == 'continue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      open_stage: ${{ steps.decide.outputs.open_stage }}
      open_remaining: ${{ steps.decide.outputs.open_remaining }}
      served: ${{ steps.decide.outputs.served }}
      wanted: ${{ steps.decide.outputs.wanted }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --disable-pip-version-check --quiet PyYAML zstandard
      - name: Measure the gap against the published index
        id: decide
        env:
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
          WAVE: '3'
          MAX_WAVES: ${{ inputs.max_waves || '3' }}
          PREVIOUS_STAGE: ${{ needs.measure-2.outputs.open_stage }}
          PREVIOUS_REMAINING: ${{ needs.measure-2.outputs.open_remaining }}
        run: bash .github/scripts/converge-measure.sh

  wave-3:
    name: Wave 3
    needs: measure-3
    if: ${{ !cancelled() && needs.measure-3.outputs.verdict == 'continue' }}
    uses: ./.github/workflows/build-chain-fanout.yml
    secrets: inherit
    with:
      shards: ${{ inputs.shards || '8' }}
      dry_run: ${{ inputs.dry_run || false }}

  # -------------------------------------------------------------- the report
  report:
    name: Report the residue
    needs: [measure-1, measure-2, measure-3, wave-3]
    # always(): the report is the deliverable of every ending. A loop that
    # only reports when it succeeds is a loop nobody can act on, and the
    # endings worth acting on are the ones where it did not.
    if: ${{ always() && needs.measure-1.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --disable-pip-version-check --quiet PyYAML zstandard
      - name: Take the final measurement
        id: final
        env:
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
          WAVE: '4'
          MAX_WAVES: ${{ inputs.max_waves || '3' }}
          PREVIOUS_STAGE: ${{ needs.measure-3.outputs.open_stage || needs.measure-2.outputs.open_stage || needs.measure-1.outputs.open_stage }}
          PREVIOUS_REMAINING: ${{ needs.measure-3.outputs.open_remaining || needs.measure-2.outputs.open_remaining || needs.measure-1.outputs.open_remaining }}
        run: bash .github/scripts/converge-measure.sh
      # Failure logs ride inside each cell's cumulative band artifact. Absent
      # ones are fine: a package with no log is classified `not-reached`,
      # which is a true statement about a wave that ran out of clock, not a
      # defect to send anyone after.
      - name: Collect this run's failure logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: fanout-repo-*
          path: waves
          merge-multiple: true
      - name: Classify the residue into blockers
        env:
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
        run: bash .github/scripts/converge-report.sh
      - uses: actions/upload-artifact@v7
        with:
          name: converge-report
          path: |
            converge-report.md
            converge-blockers.json
            converge-measurement.json
          if-no-files-found: warn
      - name: File or refresh the blocker issue
        if: ${{ steps.final.outputs.verdict != 'packages-ready' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ inputs.request || 'gnome 51 on hummingbird' }}
        run: bash .github/scripts/converge-file-issue.sh
