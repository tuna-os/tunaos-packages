# Regenerate docs/FACTORY-STATUS.md from the live published indexes.
#
# RFC 011 Phase 1: "what has the factory built, what is still needed" is a
# generated artifact with provenance, not a question answered from memory.
# Same design as tunaOS's matrix-status.yml, which hit every problem this
# workflow would otherwise rediscover: a protected main means the refresh
# lands via a bot PR, and a bot-token PR triggers no pull_request checks —
# but the merge queue runs its required checks on the merge group itself,
# so arming auto-merge is sufficient for the refresh to land unattended.
name: Factory Status

on:
  schedule:
    # 05:30 UTC — after the nightly desktop-gate publishes settle.
    - cron: "30 5 * * *"
  workflow_dispatch:
  pull_request:
    # Structure check only (no network, no push): catches the config drifting
    # from what the tool can read — a published_index for a format it cannot
    # parse, an arch the target does not declare.
    paths:
      - "scripts/factory-status.py"
      - "manifests/package-factory.yaml"
      - "manifests/catalog.yaml"

permissions:
  contents: write
  # Needed to open the refresh PR; `main` only accepts merge-queue changes.
  pull-requests: write

concurrency:
  group: factory-status
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Check structure (pull_request only)
        if: github.event_name == 'pull_request'
        run: ./scripts/factory-status.py --check-structure

      - name: Regenerate
        if: github.event_name != 'pull_request'
        # No `|| true`: an unreachable index fails loudly. Silently keeping a
        # stale status page would defeat the reason the page exists.
        run: ./scripts/factory-status.py

      - name: Open a PR with the refreshed status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/factory-status
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/FACTORY-STATUS.md docs/factory-status.json; then
            echo "Nothing moved -- no refresh needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # One long-lived branch, force-pushed: the page is fully generated,
          # so each refresh supersedes the last.
          git checkout -b "$BRANCH"
          git add docs/FACTORY-STATUS.md docs/factory-status.json
          git commit -m "docs: refresh factory status ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: refresh factory status" \
              --body "$(printf '%s\n\n%s\n' \
                'Regenerated by `scripts/factory-status.py` from the live published indexes. Built/needed counts moved since the last refresh.' \
                'Force-updated in place by the `Factory Status` workflow, so this branch always holds the newest measurement.')"
          else
            echo "PR already open for $BRANCH -- force-push refreshed it."
          fi

          # Arm auto-merge so the refresh lands without a human — the
          # bot-token/merge-queue mechanics proven on tunaOS#1871 and this
          # repo's own #419 apply here identically. Re-armed every refresh
          # because a merge clears it.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr merge --auto --merge "$pr" ||
              echo "::warning::could not arm auto-merge on #$pr -- the refresh will wait for a human"
          fi
