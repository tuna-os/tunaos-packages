name: Gap Drift

# ONE drift detector for every target whose contract declares a
# gap_measurement — the per-target copies this replaces
# (hummingbird-gap-drift.yml, fedora-gap-drift.yml) were the workflow
# census creeping back (#487), and the hummingbird copy carried a latent
# defect: a step that regenerated build-hummingbird-distributed.yml, a
# per-family workflow #430 deleted, so its next drift PR would have
# resurrected a retired builder.
#
# What runs for each target comes from its `gap_measurement.drift` block
# in manifests/package-factory.yaml, never from this file:
#
#   mode: propose  — scheduled + dispatch. Revision-gated (skip when the
#                    live target repomd revision matches the committed
#                    measurement); regenerates the build order in place
#                    and opens a review PR with the adds and drops. A
#                    distro catching up to the factory produces a PR
#                    that REMOVES work — RFC 011 success criterion 2.
#   mode: exhibit  — dispatch-only. Regenerates NEXT TO the curated
#                    order, shows the diff, uploads the measurement, and
#                    never opens a PR: the conversion row for that
#                    family (docs/rfc011-conversions.md) has not passed
#                    exact-or-explained yet, so a PR would be noise
#                    nobody can act on.
#
# Adding a drift detector for a new target is a contract block, not a
# workflow copy.

on:
  schedule:
    # Ahead of the 12:00 UTC desktops build, so a regenerated build
    # order can land before the factory's next scheduled run.
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Target id to re-measure (default: every target whose drift
          mode is `propose`). Dispatch always re-measures, revision
          gate or not.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gap-drift
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --disable-pip-version-check --quiet PyYAML
      - name: Plan targets from the contract
        id: plan
        env:
          REQUESTED: ${{ inputs.target }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - << 'EOF' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          contract = yaml.safe_load(open("manifests/package-factory.yaml"))
          requested = os.environ.get("REQUESTED", "").strip()
          rows = []
          for target_id, target in sorted(contract["targets"].items()):
              drift = (target.get("gap_measurement") or {}).get("drift")
              if not drift:
                  continue
              if requested and target_id != requested:
                  continue
              # The schedule runs only proposers; exhibit targets are
              # dispatch-only by contract.
              if (not requested and os.environ["EVENT"] == "schedule"
                      and drift["mode"] != "propose"):
                  continue
              rows.append({
                  "target": target_id,
                  "mode": drift["mode"],
                  "build_order": drift["build_order"],
                  "compare_to": drift.get("compare_to", ""),
                  "report_json": drift["report_json"],
                  "target_index": target["gap_measurement"]["target_index"]
                      .replace("$arch", "x86_64").replace("$basearch", "x86_64"),
              })
          if requested and not rows:
              raise SystemExit(f"{requested}: no gap_measurement.drift in the contract")
          print(f"matrix={json.dumps({'include': rows})}")
          print(f"any={'true' if rows else 'false'}")
          EOF

  remeasure:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the live revision with the committed measurement
        id: drift
        env:
          TARGET_INDEX: ${{ matrix.target_index }}
          REPORT_JSON: ${{ matrix.report_json }}
        run: |
          set -euo pipefail
          # Dispatch always re-measures; so does a target with no
          # committed measurement to gate on (exhibit mode's report is
          # an artifact, not a committed file).
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ ! -f "$REPORT_JSON" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live="$(curl -fsSL -A tunaos-package-factory "${TARGET_INDEX%/}/repodata/repomd.xml" | python3 -c '
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.stdin.buffer).getroot()
          print(root.findtext("{http://linux.duke.edu/metadata/repo}revision"))
          ')"
          measured="$(python3 -c "
          import json
          print(json.load(open('$REPORT_JSON'))['target_index']['revision'])
          ")"
          echo "target revision: live=${live} measured=${measured}"
          if [ "$live" = "$measured" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.drift.outputs.drifted == 'true'
        with:
          python-version: '3.15'

      - if: steps.drift.outputs.drifted == 'true'
        # zstandard: the Fedora Rawhide reference primary.xml is .zst; the
        # engine's decompress() imports it lazily. The first scheduled run
        # of the predecessor workflow (32017727489) died on exactly this.
        run: pip install --disable-pip-version-check --quiet PyYAML zstandard

      - name: Re-measure the gap against the live indexes
        if: steps.drift.outputs.drifted == 'true'
        run: |
          python3 scripts/measure-target-gap.py --target '${{ matrix.target }}' \
            --report-json '${{ matrix.report_json }}' \
            --build-order '${{ matrix.build_order }}'

      - name: Exhibit the diff against the curated order
        if: steps.drift.outputs.drifted == 'true' && matrix.mode == 'exhibit'
        run: |
          set -euo pipefail
          echo "::group::generated vs curated"
          diff -u '${{ matrix.compare_to }}' '${{ matrix.build_order }}' || true
          echo "::endgroup::"
          # The diff is the deliverable while the conversion row is open —
          # exact-or-explained is judged by a human in the conversion PR,
          # so this job never fails on a difference; it exhibits it.

      - name: Upload the exhibit measurement
        if: steps.drift.outputs.drifted == 'true' && matrix.mode == 'exhibit'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-gap-measurement
          path: |
            ${{ matrix.report_json }}
            ${{ matrix.build_order }}
          retention-days: 30

      - name: Summarize adds and drops
        if: steps.drift.outputs.drifted == 'true' && matrix.mode == 'propose'
        env:
          BUILD_ORDER: ${{ matrix.build_order }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The comparison used to be over FULL PATHS, so a package that
          # merely moved spec directories could never cancel: it appeared as
          # a drop AND an add, under headings claiming the target had adopted
          # it and stopped shipping it. #542 moved all 19 GNOME packages from
          # src/gnome-51 to src/gnome-50 -- a desktop-wide downgrade -- and
          # read as routine upstream churn. Moves are now their own category,
          # reported first.
          git diff -U0 "$BUILD_ORDER" \
            | python3 scripts/summarize-gap-drift.py --target "$TARGET" \
            > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - uses: peter-evans/create-pull-request@v8
        if: steps.drift.outputs.drifted == 'true' && matrix.mode == 'propose'
        with:
          branch: automation/${{ matrix.target }}-gap-remeasure
          delete-branch: true
          title: 'chore(${{ matrix.target }}): re-measure the gap against the live target'
          commit-message: 'chore(${{ matrix.target }}): re-measure the gap against the live target'
          body-path: /tmp/pr-body.md
          labels: package-factory
