name: Generate Factory Catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/generate-catalog.yml'
      - 'packages/**/package.yaml'
      - 'manifests/target-queues/**'

permissions:
  contents: read

# A newer push to a pull request supersedes the run for the older head. Pushes
# to main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - name: Generate from the clean source checkout
        run: |
          python -m pip install pyyaml==6.0.3
          python scripts/build-catalog.py
      - name: Retain generated catalog for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: factory-catalog-${{ github.sha }}
          path: manifests/catalog.yaml
          if-no-files-found: error
