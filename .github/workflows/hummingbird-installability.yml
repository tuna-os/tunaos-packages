name: Hummingbird installability

# Does what we publish for Hummingbird resolve on Hummingbird?
#
# The chain reports "built"; the gap engine reports "missing from the
# target"; nothing reported the thing a consumer image needs: with ONLY
# public-hummingbird and our published prefix enabled, do the desktop and
# retained served roots resolve?  utah-packages gates its publish on that
# question inside the bootc-os image; this is the static half (two primary.xml
# downloads, no container), so it can run on every relevant change and daily.
#
# Advisory: it never fails the run.  Existing desktop closures do not resolve
# yet, so a hard gate today would be permanent red; the report in the job
# summary is the product, and `--fail-on-unresolved` is there for the day a
# package set first goes green and should stay so.
# The enforcement that does NOT wait for that day lives on the publish path
# (publish-build-chain-rpms.yml, #629): the same walk over the wave's own
# freshly indexed tree, `--fail-on-regression` against
# docs/hummingbird-installability-baseline.json. Refresh that baseline with
# `--write-baseline` per arch, in its own commit, when the target's own
# repository moves under it.
# docs/HUMMINGBIRD-TARGET.md.

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/check-hummingbird-installability.py
      - scripts/gap_engine.py
      - scripts/oci_repository.py
      - scripts/check-hummingbird-installability-container.sh
      - scripts/hummingbird-desktop-roots.py
      - manifests/hummingbird-desktops.yaml
      - manifests/package-factory.yaml
      - .github/workflows/hummingbird-installability.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: resolve desktop and retained roots on hummingbird
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.15"}
      - run: pip install --disable-pip-version-check PyYAML zstandard
      - name: Resolve desktop and retained roots over target + published
        run: |
          set -euo pipefail
          python3 scripts/check-hummingbird-installability.py --arch "${{ matrix.arch }}" \
            | tee installability-${{ matrix.arch }}.md
          python3 scripts/check-hummingbird-installability.py --arch "${{ matrix.arch }}" --json \
            > installability-${{ matrix.arch }}.json
          {
            echo "### Hummingbird installability (${{ matrix.arch }})"
            echo ""
            cat installability-${{ matrix.arch }}.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: hummingbird-installability-${{ matrix.arch }}
          path: installability-${{ matrix.arch }}.*
          retention-days: 30

  # The other half: dnf's answer, inside the bootc-os image tunaOS builds
  # from, with only public-hummingbird, our prefix and the consumed
  # repositories enabled -- utah-packages' publish gate, verbatim in shape.
  # x86_64 only (the runner's arch, and the arch the consumed repositories
  # exist for). Advisory like the static walk: `--fail-on-unresolved` is
  # the switch for the day a desktop first resolves.
  container:
    name: dnf --assumeno inside bootc-os
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: pip install --disable-pip-version-check PyYAML
      - name: Ask dnf, with the consumer's repositories and nothing else
        run: |
          set -euo pipefail
          bash scripts/check-hummingbird-installability-container.sh --report consumer-transaction.md
          cat consumer-transaction.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: hummingbird-consumer-transaction
          path: consumer-transaction.md
          retention-days: 30
