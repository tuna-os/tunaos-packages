name: Lint

on:
  # Deliberately NOT path-filtered for pull_request. These jobs are main's
  # required status checks, and a path-filtered workflow can never be a
  # reliable required check: when the filter does not match, the workflow
  # never runs, the check never reports, and the PR is unmergeable forever
  # rather than merely unverified.
  #
  # main was in exactly that state — it required
  # "GNOME 50 Package Build (Incremental) / el10-release-gate", a job that
  # exists only in the still-open #112 and whose workflow is filtered to
  # src/gnome-50/**. Nothing could merge, including the PR that would have
  # fixed it. These jobs are cheap; running them on every PR is the price of
  # having them be required.
  #
  # push stays filtered: a push to main is already merged, so a missing check
  # there blocks nothing.
  #
  # merge_group is here for the same reason pull_request is unfiltered, and it
  # is not optional once a merge queue exists. The queue builds a candidate
  # branch and emits merge_group, then waits for main's required checks to
  # report against it. A workflow that does not listen for merge_group never
  # runs, the six checks never report, and every queued PR sits in
  # AWAITING_CHECKS until the queue's 60-minute timeout ejects it — the same
  # unmergeable-forever state described above, reached by a different route.
  # Measured: enabling the queue with no merge_group trigger stalled the queue
  # immediately and blocked all merges until the queue was disabled again.
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            ignore: |
              src/
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              comments-indentation: disable
              braces:
                level: warning
                max-spaces-inside: 1
              brackets:
                level: warning
                max-spaces-inside: 1

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './'
          severity: warning
          format: tty
          ignore_paths: >
            src/deps
            src/gnome-49
            src/gnome-50

  workspace-validate:
    name: Workflow Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow YAMLs
        run: |
          echo "=== Checking GitHub Actions workflow syntax ==="
          pip install pyyaml -q 2>/dev/null || true
          ERRORS=0
          for f in .github/workflows/*.yml; do
            if ! python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "  INVALID: $f"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK: $f"
            fi
          done
          exit $ERRORS

  build-order-validate:
    name: Build Order Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq and check-jsonschema
        run: |
          pip install check-jsonschema 2>/dev/null || true
          sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/bin/yq

      - name: Validate build-order.yml against schema
        run: |
          echo "=== Validating build-order.yml ==="
          pip install jsonschema pyyaml -q 2>/dev/null || true
          for f in build-order.yml .copr/build-order-gnome49.yml build-order-xfce.yml; do
            if [ -f "$f" ]; then
              echo "  Checking: $f"
              python3 scripts/parse-build-order.py "$f" --validate || exit $?
            fi
          done
          echo "All build order files valid"

  bats-tests:
    name: BATS Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned BATS
        env:
          BATS_COMMIT: 713504bc0224a19b3d7c7958c18dc07f64f54b44 # v1.12.0
        run: |
          install_root="$RUNNER_TEMP/bats-core"
          git init "$install_root"
          git -C "$install_root" remote add origin https://github.com/bats-core/bats-core.git
          timeout 120s git -C "$install_root" fetch --depth=1 origin "$BATS_COMMIT"
          git -C "$install_root" checkout --detach FETCH_HEAD
          sudo "$install_root/install.sh" /usr/local

      - name: Run BATS tests
        run: |
          echo "=== BATS Tests ==="
          FAILED=0
          for f in tests/bats/*.bats; do
            [[ -f "$f" ]] || continue
            echo "  Running: $f"
            bats --formatter tap "$f" || FAILED=1
          done
          exit $FAILED

  pytest:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          pip install pytest pyyaml jsonschema

      - name: Run pytest
        env:
          PYTHONPATH: scripts:.
        run: |
          echo "=== Python Tests ==="
          FAILED=0
          python3 -m pytest tests/ -v --tb=short || FAILED=1
          exit $FAILED

      - name: Test summary
        if: always()
        run: |
          echo "## Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| YAML Lint | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ShellCheck | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow Syntax | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BATS Tests | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python Tests | completed |" >> "$GITHUB_STEP_SUMMARY"

  # Branch protection should require one stable check rather than individual
  # implementation jobs.  Keep this list in sync whenever a mandatory fast
  # validation job is added above.
  required-checks:
    name: required-checks
    if: always()
    needs: [yamllint, shellcheck, workspace-validate, build-order-validate, bats-tests, pytest]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result | IN("success", "skipped") | not) | .key')
          test -z "$failed" || { echo "Required jobs failed: $failed"; exit 1; }
