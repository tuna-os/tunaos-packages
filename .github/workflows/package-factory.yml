name: Package Factory

on:
  # `closed` added alongside the default [opened, synchronize, reopened] so a
  # merged (or simply closed) PR gets ONE MORE event on this exact
  # concurrency group (see below: pull_request's group key is
  # refs/pull/N/merge, stable across the PR's whole lifetime). That new run
  # does no real work (the `plan` job short-circuits to zero packages for a
  # closed action) but its mere queuing is what makes `cancel-in-progress`
  # kill the PR's own still-running build -- which otherwise runs to
  # completion or its 360m timeout for a result nothing will ever read,
  # since nothing re-triggers this workflow once a PR has no more commits.
  # Measured: PRs #590-#609 this session left 18 such runs alive for hours
  # after merging, several still mid-build, holding runners a genuinely
  # queued nightly family build then waited behind for over an hour.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # NOT merge_group. A cell build takes ~2.5h; the merge queue's CI timeout is
  # about an hour, so the queue would evict src/-touching PRs before completion.
  # The PR gate already builds refs/pull/N/merge -- the merge result -- and the
  # queue's required checks (required-checks and actionlint) report separately.
  push:
    branches: [main]
  schedule:
    # Nightly: the flagship family, ~570 packages, the one whose drift against
    # upstream is tracked.
    - cron: '0 12 * * *'
    # Weekly: every build-chain family, so the desktops have a periodic proof
    # they still build.
    #
    # Without this the nightly's hard-coded family=hummingbird-desktops was
    # the ONLY unattended run, and it overrode any selector. So xfce (el10 and
    # fedora, both arches), gnome49, gnome50, gnome51 and fprintd were built
    # only when someone happened to touch their sources -- a desktop could
    # have been broken by a CentOS Stream rebase for weeks with every check on
    # main still green, because nothing asked. `engine=build-chain` is the
    # whole set, hummingbird included.
    #
    # Sunday 03:00 UTC: off the nightly by nine hours, and off the working
    # week, since this is the long one.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      cell:
        description: Optional exact matrix cell ID
        required: false
        type: string
      selector:
        description: Optional target=, family=, engine=, or architecture= filter
        required: false
        type: string

# The scheduled full-family run gets its OWN group and is never cancelled.
#
# Both the schedule and a push to main resolve github.ref to refs/heads/main,
# so they shared one cancel-in-progress group and every merge killed the
# nightly. Measured, not inferred: all three scheduled runs on record were
# cancelled, and on 2026-08-21 the push run created at 13:51:50Z cancelled
# the 13:00:22Z nightly at 13:52:27Z -- 37 seconds later.
#
#   12:55:51 push      cancelled
#   13:00:22 schedule  cancelled 13:52:27
#   13:51:50 push      cancelled
#   14:51:12 push      cancelled
#   17:01:55 push      cancelled
#
# On a busy merge day nothing on main finished at all, which is why
# hummingbird's aarch64 index serves 1358 package names against x86_64's
# 7986 (#480): the slower arch is further from done when the next merge
# lands, so it loses more work every time.
#
# Pull requests keep cancel-in-progress -- there a new commit genuinely
# supersedes the old one. Two nightlies cannot overlap either; sharing one
# group with cancel-in-progress false makes the second QUEUE rather than
# evict the first.
#
# Each schedule gets its own group, keyed on the cron that fired it. The two
# are nine hours apart, but a nightly that overran into the weekly's slot would
# otherwise make the weekly queue behind it and then be superseded -- the same
# starvation this block exists to prevent, one level up.
#
# Each DISPATCH likewise gets a group keyed on what it was asked to build.
# Dispatches keep cancel-in-progress, and every dispatch on a branch used to
# resolve to that branch's ref -- so dispatching one cell killed an unrelated
# cell dispatched minutes earlier on the same branch, up to an hour of aarch64
# build time discarded for no reason. Two dispatches of DIFFERENT cells are
# independent work and must both run; re-dispatching the SAME cell is a genuine
# supersede and still cancels, because the key is identical.
#
# github.event.inputs rather than the inputs context: it is readable from any
# expression that can read github, including this workflow-level block.
concurrency:
  group: >-
    package-factory-${{ github.event_name == 'schedule'
      && format('schedule-{0}', github.event.schedule)
      || github.event_name == 'workflow_dispatch'
      && format('dispatch-{0}-{1}-{2}', github.ref,
                github.event.inputs.cell, github.event.inputs.selector)
      || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  # A CALLED workflow cannot request more than its caller grants, so this has
  # to mirror package-factory-cell.yml. The cell reads this repository's own
  # workflow artifacts to resume a timed-out build chain (#480), and WRITES
  # them: continuation shards share one partial artifact per family cell
  # (`<base_id>-partial`, overwrite: true), and upload-artifact implements
  # overwrite by deleting the existing artifact first, which needs
  # actions: write. Without the grant here, GitHub rejects the whole file:
  #
  #   Error calling workflow '.../package-factory-cell.yml@...'. The workflow
  #   is requesting 'actions: write', but is only allowed 'actions: none'.
  #
  # An invalid workflow file is not a failed run -- nothing plans, and the
  # merge queue has no required workflow to evaluate.
  actions: write
  id-token: write
  attestations: write

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix_0: ${{ steps.plan.outputs.matrix_0 }}
      matrix_1: ${{ steps.plan.outputs.matrix_1 }}
      matrix_2: ${{ steps.plan.outputs.matrix_2 }}
      count_1: ${{ steps.plan.outputs.count_1 }}
      count_2: ${{ steps.plan.outputs.count_2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install pyyaml==6.0.3
      - name: Collect changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BASE_SHA"...HEAD > changed-files.txt
            cat changed-files.txt
          fi
      - id: plan
        name: Emit the unified package matrix
        env:
          REQUESTED_CELL: ${{ inputs.cell || '' }}
          REQUESTED_SELECTOR: ${{ inputs.selector || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          # This run's only job is to occupy the refs/pull/N/merge concurrency
          # group so cancel-in-progress kills whatever build the PR's last
          # real (opened/synchronize/reopened) event left running -- see the
          # `on.pull_request.types` comment above. Emit the same zero-package
          # shape plan-package-factory.py would for an empty selection and
          # stop, rather than spending a checkout+plan invocation to arrive
          # at the same answer.
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVENT_ACTION" = closed ]; then
            {
              echo "count=0"
              echo 'matrix_0={"include":[]}'
              echo "count_0=0"
              echo 'matrix_1={"include":[]}'
              echo "count_1=0"
              echo 'matrix_2={"include":[]}'
              echo "count_2=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--github-output "$GITHUB_OUTPUT")
          [ ! -f changed-files.txt ] || args+=(--changed-files changed-files.txt)
          [ -z "${BASE_SHA:-}" ] || args+=(--base "$BASE_SHA")
          [ -z "$REQUESTED_CELL" ] || args+=(--cell "$REQUESTED_CELL")
          # A schedule carries no inputs, so the selector comes from WHICH cron
          # fired -- github.event.schedule is the cron expression verbatim.
          if [ "$EVENT_NAME" = schedule ]; then
            case "$SCHEDULE" in
              '0 3 * * 0') REQUESTED_SELECTOR=engine=build-chain ;;
              *)           REQUESTED_SELECTOR=family=hummingbird-desktops ;;
            esac
          fi
          # push is here with pull_request and merge_group, and that is the
          # point rather than an oversight: a push to main IS the merge of a
          # PR that already ran this exact selection through the merge queue,
          # so rebuilding the full chains proves nothing the required check
          # did not already prove.
          #
          # What it does cost is measurable. Merging #512 started a push run
          # whose build-0 included the FULL hummingbird chain at 11:26:51;
          # the nightly cron then fired at 12:58:54 and planned the same
          # cell. Their concurrency groups differ by construction (schedule
          # gets `schedule-<cron>`, push gets `<ref>`), so neither cancels
          # the other -- both build the same 673-package chain for 4.5 h, and
          # both upload `hummingbird-x86_64-partial` with overwrite: true.
          # Whichever finishes last wins the artifact name the OTHER one's
          # continuation shards resume from. That is up to 13.5 h of runner
          # time spent to arrive back where one run alone would have left us.
          #
          # Canary form keeps a push to main honest -- build-chain cells
          # still build, bounded to their canary tiers -- while leaving the
          # long chains to the schedule that is designed to carry them.
          case "$EVENT_NAME" in
            pull_request|merge_group|push) args+=(--canary-common) ;;
          esac
          [ -z "$REQUESTED_SELECTOR" ] || args+=(--selector "$REQUESTED_SELECTOR")
          python3 scripts/plan-package-factory.py "${args[@]}"

  build-0:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.count) > 0 }}
    uses: ./.github/workflows/package-factory-cell.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix_0 }}

  # build-1 and build-2 are CHAINED, not parallel. They carry two kinds of
  # work: >200-cell overflow (their original purpose, which had never
  # occurred) and CONTINUATION copies of full-chain build-chain cells, which
  # resume the previous shard's partial by base_id and extend the chain
  # another CHAIN_BUDGET_SECONDS. Chaining is what makes a continuation mean
  # something -- run in parallel it would race its own predecessor for the
  # same partial. `!cancelled()` rather than success(): one unrelated red
  # cell in build-0 must not skip the continuation and silently throw away
  # the day's remaining chain hours; a continuation whose predecessor
  # deferred (exit 0) or even failed still restores whatever partial exists.
  build-1:
    needs: [plan, build-0]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.count_1 || '0') > 0 }}
    uses: ./.github/workflows/package-factory-cell.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix_1 }}

  build-2:
    needs: [plan, build-0, build-1]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.count_2 || '0') > 0 }}
    uses: ./.github/workflows/package-factory-cell.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix_2 }}

  gate:
    name: Package factory gate
    if: ${{ always() }}
    needs: [plan, build-0, build-1, build-2]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every occupied shard must pass, with one exception the shard results
      # alone cannot express: build-1 and build-2 carry CONTINUATIONS of
      # build-0's full-chain cells, and a continuation resumes its
      # predecessor's partial by base_id. So three shard results are not
      # three independent verdicts -- they are one chain observed three
      # times, and the last observation is the one that counts. Run
      # 33840428161: build-0 failed on a transient upstream fetch, build-1
      # resumed the partial and built through it, build-2 finished, and this
      # gate still called the run red (#684).
      #
      # The strictness that DOES survive, and the reason this is not simply
      # relaxed: a failed continuation still fails. Nothing runs after it to
      # supersede it, so its failure is the chain extension dying with the
      # day's remaining hours -- the class this factory keeps re-learning.
      # Forgiveness is also conservative, because a shard result covers every
      # cell in it and GitHub gives no per-cell verdict: one cell without a
      # successful later continuation and the shard stays red.
      #
      # The reasoning is in scripts/gate-shard-results.py, where it can be
      # tested (tests/test_a_superseded_shard_does_not_fail_the_gate.py)
      # rather than only observed in production.
      - name: Require every planned chain to pass
        env:
          PLAN: ${{ needs.plan.result }}
          COUNT: ${{ needs.plan.outputs.count || '0' }}
          COUNT_0: ${{ needs.plan.outputs.count || '0' }}
          COUNT_1: ${{ needs.plan.outputs.count_1 || '0' }}
          COUNT_2: ${{ needs.plan.outputs.count_2 || '0' }}
          SHARD_0: ${{ needs.build-0.result }}
          SHARD_1: ${{ needs.build-1.result }}
          SHARD_2: ${{ needs.build-2.result }}
          MATRIX_0: ${{ needs.plan.outputs.matrix_0 }}
          MATRIX_1: ${{ needs.plan.outputs.matrix_1 }}
          MATRIX_2: ${{ needs.plan.outputs.matrix_2 }}
        run: |
          set -euo pipefail
          python3 scripts/gate-shard-results.py \
            --plan "$PLAN" --count "$COUNT" \
            --count-0 "$COUNT_0" --result-0 "$SHARD_0" --matrix-0 "$MATRIX_0" \
            --count-1 "$COUNT_1" --result-1 "$SHARD_1" --matrix-1 "$MATRIX_1" \
            --count-2 "$COUNT_2" --result-2 "$SHARD_2" --matrix-2 "$MATRIX_2"
