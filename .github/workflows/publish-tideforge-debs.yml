# Publish Tideforge-built debs to the R2-backed apt repos (tunaOS#964).
#
# The deb half of what build.yml does for el10 RPMs. Design agreed on the
# issue: flat apt repositories per distro at r2:bluefin/tideforge/<distro>/,
# served as https://repo.tunaos.org/tideforge/<distro>/, with Packages.gz,
# an apt-ftparchive Release, and a GPG-clearsigned InRelease. grouper
# consumes the ubuntu repo, flounder-sid the debian-sid one — with ZERO
# third-party repos, which the verify job asserts on every publish.
#
# Dispatch-only. Publishing is a deliberate act, not a side effect of a
# merge; the gate cells prove PRs, this workflow ships what main has.
name: Publish Tideforge debs

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated recipe names under packages/ to build and publish
        # The curated wave. Deliberately a LIST rather than "every recipe
        # targeting deb": "nothing gets published that a gate cell has not
        # exercised" is a judgement a person makes, and deriving it would
        # silently widen what ships. The planner validates the list; it does
        # not invent it.
        default: cpptrace-devel,pop-icon-theme,cosmic-randr,cosmic-panel,cosmic-icon-theme
        required: true
      distros:
        description: Comma-separated distro labels (ubuntu, debian-sid)
        default: ubuntu,debian-sid
        required: true
      arches:
        description: Comma-separated arches; empty means every arch the target declares
        default: ''
        required: false

env:
  R2_BUCKET: bluefin

permissions:
  contents: read

jobs:
  # Derive the matrix instead of hand-listing it (#479). A literal `include:`
  # cannot report a MISSING row -- a row nobody wrote looks exactly like a row
  # nobody wanted, which is how every deb ever published turned out to be
  # amd64: the matrix had no `arch` key at all. Architectures now come from
  # the target's own `architectures` in manifests/package-factory.yaml, the
  # same list the gate builds, so the two cannot drift apart again.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      verify_matrix: ${{ steps.plan.outputs.verify_matrix }}
      distros: ${{ steps.plan.outputs.distros }}
      arches: ${{ steps.plan.outputs.arches }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml==6.0.3
      - id: plan
        run: |
          set -euo pipefail
          python3 scripts/plan-deb-publish.py \
            --packages '${{ inputs.packages }}' \
            --distros '${{ inputs.distros }}' \
            --arches '${{ inputs.arches }}' \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.package }} (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The action key derives SOURCE_DATE_EPOCH from the recipe
          # directory's last author date, which a shallow clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/${{ matrix.package }}/package.yaml
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh "${{ matrix.image }}"
      - name: Restore the gated build, or build it if there is none
        # Replaces an inline render/assemble/dpkg-buildpackage/lint sequence
        # that diverged from the gate in three ways at once (#481):
        #
        #   different bytes   it rebuilt rather than restoring the ActionResult
        #                     the gate produced, and used %ct for
        #                     SOURCE_DATE_EPOCH where the gate uses %at, so the
        #                     two could not agree even in principle.
        #   no clean-install  it ran lint-generated-deb.sh and stopped. The rpm
        #                     and arch publishers both run
        #                     verify-package-factory-cell.sh; the deb one never
        #                     did, so debs shipped without the #179 check on
        #                     the publish path.
        #   no factory index  its `mk-build-deps` container had only the
        #                     distro's own archive. run-package-factory-cell.sh
        #                     adds each published_index as a pinned apt source
        #                     (#476), so a deb whose Build-Depends name another
        #                     factory package builds in the gate and could not
        #                     build here.
        uses: ./.github/actions/tideforge-cached-cell
        with:
          cell-id: ${{ matrix.cell_id }}
          package: ${{ matrix.package }}
          recipe: packages/${{ matrix.package }}/package.yaml
          target: ${{ matrix.target }}
          format: deb
          architecture: ${{ matrix.arch }}
          image: ${{ matrix.image }}
      - uses: actions/upload-artifact@v7
        with:
          # The arch is part of the NAME, not just the contents: without it the
          # two arches collide on one artifact. The publish job globs
          # `publish-deb-<distro>-*` with merge-multiple, so both land in the
          # same pool and apt-ftparchive indexes them into one flat Packages
          # -- which is what a flat repo wants, since apt selects on the
          # Architecture field.
          name: publish-deb-${{ matrix.distro }}-${{ matrix.package }}-${{ matrix.arch }}
          path: .factory/${{ matrix.cell_id }}/artifacts/*.deb
          # A build that produced nothing must fail here rather than upload an
          # empty artifact: the publish job downloads the pool and `rclone
          # sync`s it, and sync makes the destination match the source (#124).
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      # Serial, not parallel: the iterations sync against the same bucket
      # prefix family and rclone config; one at a time keeps the failure
      # story readable.
      max-parallel: 1
      # Only the distros this wave actually built. Hard-coding both meant a
      # narrowed wave would rclone sync an EMPTY tree over the other one's
      # live repository -- the #124 repo-wipe shape.
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apt-utils gpg gpgconf
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          EOF
      - name: Sync down the existing repo
        run: |
          set -euo pipefail
          mkdir -p repo
          rclone sync "r2:${R2_BUCKET}/tideforge/${{ matrix.distro }}/" repo/ || true
      - uses: actions/download-artifact@v8
        with:
          pattern: publish-deb-${{ matrix.distro }}-*
          path: repo/pool
          merge-multiple: true
      - name: Index and sign the repository
        run: |
          set -euo pipefail
          cd repo
          count=$(find pool -name '*.deb' | wc -l)
          # The #124 lesson: never sync an empty tree over a published repo.
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no debs staged; refusing to publish an empty repo" >&2
            exit 1
          fi
          apt-ftparchive packages pool > Packages
          gzip -9kf Packages
          apt-ftparchive release . > Release
          gpg --batch --yes -u "${{ steps.import-gpg.outputs.keyid }}" --clearsign -o InRelease Release
          gpg --batch --yes -u "${{ steps.import-gpg.outputs.keyid }}" -abs -o Release.gpg Release
          gpg --batch --yes --export "${{ steps.import-gpg.outputs.keyid }}" > tideforge.gpg
      - name: Sync up
        run: |
          set -euo pipefail
          rclone sync repo/ "r2:${R2_BUCKET}/tideforge/${{ matrix.distro }}/"

  # The anti-#179 job: exists from the FIRST publish, so a repo that was
  # never actually published can never sit behind a green workflow. Installs
  # with ZERO third-party repos — the tunaOS#964 definition of done at
  # package level. Today it asserts the two published packages; it graduates
  # to cosmic-session (the closure root) when the widening reaches it.
  verify:
    needs: [plan, publish]
    # Both arches, for the reason this job exists at all: publishing an
    # architecture nothing ever installs is exactly the #179 shape -- a repo
    # sitting behind a green workflow that no one has actually resolved
    # against. The build matrix now produces arm64, so the verification has to
    # cover it, natively, on an arm64 runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.verify_matrix) }}
    steps:
      - name: Install from the published repo with no third-party sources
        run: |
          set -euo pipefail
          docker run --rm "${{ matrix.image }}" bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl gpg
            curl -fsSL https://repo.tunaos.org/tideforge/${{ matrix.distro }}/tideforge.gpg -o /usr/share/keyrings/tideforge.gpg
            echo "deb [signed-by=/usr/share/keyrings/tideforge.gpg] https://repo.tunaos.org/tideforge/${{ matrix.distro }} ./" > /etc/apt/sources.list.d/tideforge.list
            apt-get update
            apt-get install -y pop-icon-theme cosmic-randr cosmic-panel cosmic-icon-theme
            dpkg-query -W pop-icon-theme cosmic-randr cosmic-panel cosmic-icon-theme
            test -d /usr/share/icons/Pop
            cosmic-randr --help
            test -x /usr/bin/cosmic-panel
            test -d /usr/share/icons/Cosmic
          '
