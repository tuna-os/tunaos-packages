name: tiny-dfr Native Source Inputs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CI capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq
      - name: Capture locked upstream and native ARM inputs
        run: bash scripts/capture-tiny-dfr-inputs-ci.sh
      - name: Attest input receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .factory/tiny-dfr-inputs/input-contract.json
      - name: Preserve source inputs and bootstrap evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiny-dfr-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .factory/tiny-dfr-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
