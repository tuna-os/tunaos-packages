name: tiny-dfr Native Source Inputs

on:
  pull_request:
    paths:
      - .github/workflows/tiny-dfr-source-inputs.yml
      - scripts/capture-tiny-dfr-inputs-ci.sh
      - tests/test_tiny_dfr_source_inputs.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundaries:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: python -m pip install pytest pyyaml==6.0.3
      - run: python -m pytest -q tests/test_tiny_dfr_source_inputs.py
  capture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install CI capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq
      - name: Capture locked upstream and native ARM inputs
        run: bash scripts/capture-tiny-dfr-inputs-ci.sh
      - name: Attest input receipt
        uses: actions/attest@v4.2.2
        with:
          subject-path: .factory/tiny-dfr-inputs/input-contract.json
      - name: Preserve source inputs and bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tiny-dfr-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .factory/tiny-dfr-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
