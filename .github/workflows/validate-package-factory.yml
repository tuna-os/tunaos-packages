name: Validate Package Factory

on:
  pull_request:
    paths:
      - manifests/package-factory.yaml
      - manifests/dependency-trees/**
      - manifests/target-queues/**
      - scripts/validate-package-factory.py
      - scripts/validate-target-queues.py
      - scripts/tideforge.py
      - scripts/verify-tideforge-source.py
      - scripts/fetch-tideforge-sources.py
      - scripts/compare-official-package.py
      - packages/**
      - docs/PATCH_POLICY.md
      - docs/PACKAGE_FACTORY.md
      - packaging/**
      - .github/workflows/validate-package-factory.yml
      # The validator now asserts that every declared target has at least one
      # cell in the Tideforge gate (#139), so it must re-run when the gate
      # workflows change. Without these paths, deleting the openSUSE job would
      # not trip the check that exists to notice exactly that.
      - .github/workflows/build-tideforge-supported.yml
      - .github/workflows/build-tideforge-arch.yml
  push:
    branches: [main]
    paths:
      - manifests/package-factory.yaml
      - manifests/dependency-trees/**
      - manifests/target-queues/**
      - scripts/validate-package-factory.py
      - scripts/validate-target-queues.py
      - scripts/tideforge.py
      - scripts/verify-tideforge-source.py
      - scripts/compare-official-package.py
      - packages/**
      - docs/PATCH_POLICY.md
      - docs/PACKAGE_FACTORY.md
      - packaging/**
      - .github/workflows/build-tideforge-supported.yml
      - .github/workflows/build-tideforge-arch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: python -m pip install pyyaml==6.0.3
      - run: python3 scripts/validate-package-factory.py manifests/package-factory.yaml
      - run: python3 scripts/validate-target-queues.py
      # A recipe declaring a target that no cell builds is untested while looking
      # supported -- the defect #139 was about, one level down from the target
      # coverage the previous step asserts. 57 of 122 pairs are uncovered today,
      # so this ratchets rather than gates: it fails only on pairs this change
      # introduces, and prints the total so it stays visible.
      - name: Gate coverage must not regress
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
            python3 scripts/check-gate-coverage.py --baseline FETCH_HEAD
          else
            python3 scripts/check-gate-coverage.py
          fi
      - name: Select affected Tideforge recipes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(mktemp)
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$changed"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > "$changed"
          else
            find packages -mindepth 2 -maxdepth 2 -name package.yaml -print > "$changed"
          fi

          declare -A selected=()
          common=false
          while IFS= read -r path; do
            case "$path" in
              packages/*/*)
                IFS=/ read -r _ package _ <<<"$path"
                recipe="packages/$package/package.yaml"
                [[ -f "$recipe" && "$package" != _template ]] && selected["$recipe"]=1
                ;;
              manifests/package-factory.yaml|scripts/tideforge.py|scripts/verify-tideforge-source.py|scripts/fetch-tideforge-sources.py|scripts/validate-package-factory.py|packaging/*|.github/workflows/validate-package-factory.yml)
                common=true
                ;;
              scripts/compare-official-package.py)
                selected["packages/niri/package.yaml"]=1
                ;;
            esac
          done < "$changed"

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            while IFS= read -r recipe; do selected["$recipe"]=1; done \
              < <(find packages -mindepth 2 -maxdepth 2 -name package.yaml ! -path 'packages/_template/*')
          elif [[ "$common" == true ]]; then
            selected["packages/wayland-protocols/package.yaml"]=1
          fi

          : > .factory-validation-recipes
          if ((${#selected[@]})); then
            printf '%s\n' "${!selected[@]}" | sort > .factory-validation-recipes
          fi
          echo "Selected recipe validation set:"
          sed 's/^/  /' .factory-validation-recipes

      - name: Validate and render affected Tideforge recipes
        run: |
          set -euo pipefail
          while IFS= read -r recipe; do
            [[ -n "$recipe" ]] || continue
            python3 scripts/tideforge.py validate "$recipe"
            python3 scripts/verify-tideforge-source.py "$recipe"
            while IFS= read -r target; do
              output="$(mktemp -d)"
              python3 scripts/tideforge.py render "$recipe" --target "$target" --output "$output"
              test -n "$(find "$output" -type f -print -quit)"
              find "$output" -depth -delete
            done < <(python3 -c 'import sys,yaml; print("\n".join(yaml.safe_load(open(sys.argv[1]))["targets"]))' "$recipe")
          done < .factory-validation-recipes
      - name: Compare changed Niri recipe with Arch metadata
        run: |
          if grep -qx 'packages/niri/package.yaml' .factory-validation-recipes; then
            python3 scripts/compare-official-package.py packages/niri/package.yaml --strict
          fi
