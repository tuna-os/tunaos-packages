# Build Order Manifest for GNOME 51 on CentOS Stream 10
#
# Packages within a tier build in parallel; tiers are sequential.
# Each package entry is a path relative to the repo root.

target: centos-stream-10-x86_64
r2_path: gnome51/10-stream-x86_64

tiers:
  # Tier 0: Pure build tools with zero internal dependencies.
  - name: base-tools
    packages:
      - path: src/deps/meson
        build_tool: true
      - path: src/deps/autoconf
        build_tool: true
      - path: src/deps/libldac
      - path: src/deps/python-smartypants
        build_tool: true
      - path: src/deps/python-typogrify
        build_tool: true
      - path: src/deps/gnome50-el10-compat
      - path: src/deps/selinux-policy
      - copr_name: graphviz
      - path: src/deps/sqlcipher
        copr_name: sqlcipher

  # Tier 1: Needs tools from Tier 0.
  - name: build-tools
    packages:
      - path: src/deps/wayland-protocols
        build_tool: true
      - path: src/deps/harfbuzz
        build_tool: true
      - path: src/deps/libxcvt
        build_tool: true
      - path: src/deps/shaderc
        build_tool: true
      - path: src/deps/gi-docgen
        build_tool: true
      - copr_name: vala

  # Tier 3: Bootstrap GLib.
  - name: glib2-bootstrap
    packages:
      - path: src/gnome-51/glib2
        spec_override: glib2-bootstrap.spec

  # Tier 4: Base libraries needing GLib bootstrap.
  - name: bootstrap-libs
    packages:
      - path: src/deps/libei
      - path: src/deps/mozjs140
        copr_name: mozjs140
      - path: src/deps/libzip
      - path: src/deps/fontconfig

  # Tier 5: Cairo (Needs GLib bootstrap).
  - name: cairo-layer
    packages:
      - path: src/deps/cairo

  # Tier 6: GI Bootstrap (Needs Cairo).
  - name: gi-bootstrap
    packages:
      - path: src/gnome-51/gobject-introspection
        spec_override: gobject-introspection-bootstrap.spec

  # Tier 7: Full GLib (Needs GI Bootstrap).
  - name: glib2-full
    packages:
      - path: src/gnome-51/glib2

  # Tier 8: Full GI (Needs Full GLib).
  - name: gi-full
    packages:
      - path: src/gnome-51/gobject-introspection

  # Tier 9: High-level libraries/tools needing GI/GLib full.
  - name: core-libraries
    packages:
      - path: src/deps/pango
      - path: src/deps/tinysparql
      - path: src/deps/pipewire
      - path: src/deps/libglib-testing
      - path: src/deps/simdutf
        copr_name: simdutf
      - path: src/deps/libgexiv2
      - copr_name: libgee
      - path: src/deps/libsoup

  # Tier 10: System Tools & GJS.
  - name: system-tools
    packages:
      - path: src/deps/umockdev
        build_tool: true
      - path: src/deps/python-dbusmock
        copr_name: python-dbusmock
        build_tool: true
      - path: src/deps/avahi
      - path: src/gnome-51/gjs
      - path: src/deps/gdk-pixbuf2

  # Tier 11: GTK Core.
  - name: gtk-core
    packages:
      - path: src/deps/libnotify
      - path: src/gnome-51/gsettings-desktop-schemas
      - path: src/gnome-51/gnome-desktop3
      # The track's OWN gtk4, not src/deps/. src/deps/gtk4 is 4.21.6 and is
      # shared with build-order.yml; the GNOME 51 modules need 4.24.0, and
      # libadwaita/nautilus/xdg-desktop-portal-gnome all died on
      # "Run-time dependency gtk4 found: NO" while a bumped GTK sat
      # unreferenced in src/gnome-51/gtk4. Per-track copies are the
      # convention the hummingbird order already follows (src/gnome-50/gtk4).
      - path: src/gnome-51/gtk4
      - copr_name: highway
      - path: src/deps/glycin
      - path: src/deps/libgda

  # Tier 12: Desktop Foundations.
  - name: desktop-foundations
    packages:
      - path: src/gnome-51/libadwaita
      - path: src/gnome-51/xdg-desktop-portal
      - path: src/deps/localsearch
      # Same reason as gtk4 above: src/deps/vte291 is 0.84.0, the track
      # carries 0.84.1.
      - path: src/gnome-51/vte291
        spec_override: vte291.spec

  # Tier 12b: Parental controls stack (needs gtk4, libadwaita, flatpak).
  - name: parental-controls
    packages:
      - path: src/deps/malcontent

  # Tier 13: Compositor & Shell.
  - name: shell-foundations
    packages:
      - path: src/deps/tecla
      - path: src/gnome-51/gnome-settings-daemon
      - path: src/gnome-51/mutter

  # Tier 14: The Shell and Portal integration.
  - name: gnome-shell
    packages:
      - path: src/gnome-51/gnome-shell
      - path: src/gnome-51/xdg-desktop-portal-gnome
      - path: src/gnome-51/nautilus

  # Tier 15: Session & Control Center.
  - name: session-layer
    packages:
      - path: src/gnome-51/gnome-session
      - path: src/gnome-51/gnome-control-center
      - path: src/gnome-51/gdm
      - copr_name: ptyxis

  # Tier 16: Post-session packages that depend on GDM/gnome-shell.
  - name: post-session
    packages:
      - path: src/gnome-51/gnome-initial-setup
