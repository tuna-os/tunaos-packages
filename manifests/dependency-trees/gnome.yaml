schema: 1
tree: gnome-latest
targets: [el10, alma10, alma10-kitten, ubuntu, debian]
roots: [gnome-shell, mutter, gdm, gnome-session, uupd, bazaar]
# Release tracks are data, not workflows. Common graph edits affect both;
# track-only edits invalidate only the selected series.
tracks:
  stable: {series: "50", source_path: src/gnome-50/}
  next: {series: "51", source_path: src/gnome-51/, prerelease: true}
nodes:
  glib2: {source: GNOME/glib, needs: [gobject-introspection-bootstrap]}
  gobject-introspection-bootstrap: {source: GNOME/gobject-introspection, needs: [glib2-bootstrap]}
  glib2-bootstrap: {source: GNOME/glib, needs: []}
  gobject-introspection: {source: GNOME/gobject-introspection, needs: [glib2]}
  gtk4: {source: GNOME/gtk, needs: [glib2, gobject-introspection]}
  libadwaita: {source: GNOME/libadwaita, needs: [gtk4]}
  mutter: {source: GNOME/mutter, needs: [gtk4, gobject-introspection]}
  gnome-shell: {source: GNOME/gnome-shell, needs: [mutter, gobject-introspection]}
  gnome-session: {source: GNOME/gnome-session, needs: [gtk4]}
  gdm: {source: GNOME/gdm, needs: [gnome-shell, gnome-session]}
  uupd: {source: ublue-os/uupd, needs: [go-toolchain]}
  bazaar: {source: bazaar-org/bazaar, needs: [gtk4, libadwaita, flatpak-stack]}
  flatpak-stack: {kind: distro-build-dependency}
  cargo-toolchain: {kind: distro-build-dependency}
  go-toolchain: {kind: distro-build-dependency}
