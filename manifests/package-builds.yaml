  - id: hummingbird-x86_64
    family: hummingbird-desktops
    target: hummingbird
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    # The mock contract emits .bfin1 packages against Python 3.14. Verify the
    # same ABI rather than rolling Rawhide, which has already moved to 3.15.
    verify_image: registry.fedoraproject.org/fedora:43
    manifest: build-order-hummingbird-desktops.yml
    mock_config: hummingbird-ci
    # src/gnome-51/ is here because build-order-hummingbird-desktops.yml pulls
    # 19 packages from it (gtk4, mutter, gnome-shell and the rest of the GNOME
    # stack). Without the path listed, an edit to any of those specs does not
    # move this cell's action key, so the cache restores an ActionResult built
    # from the OLD spec and the change is silently ignored -- a cache that
    # cannot tell two recipes apart. The same was true of src/gnome-50/ before
    # hummingbird was repointed to the 51 track; it was never listed either.
    source_paths: [src/hummingbird/, src/xfce-wayland/, src/gnome-51/, src/deps/]
    r2_path: hummingbird/20251124-x86_64
    canary_tiers: bootstrap-00
  - id: hummingbird-aarch64
