  - id: xfce-fedora-x86_64
    family: xfce
    target: fedora
    architecture: x86_64
    # build-chain needs its mock/spectool tool image; the mock config selects
    # Fedora 44. Clean-install verification uses the target image separately.
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: registry.fedoraproject.org/fedora:44
    manifest: build-order-xfce-fedora.yml
    mock_config: fedora-44-ci
    source_paths: [src/xfce-wayland/]
    r2_path: xfce/44-x86_64
  # The aarch64 counterpart. Cheap here in a way the el10 xfce family is not:
  # this chain builds three packages against stock Fedora, because Fedora 44
  # already ships XFCE 4.20 and greetd/gtkgreet/cage are in Fedora proper. So
  # it carries neither of the two Requires that cannot resolve on EL10 (#482),
  # and needed only a mock config that did not exist (#480).
    # Bounds the PR gate to this chain's FIRST tier. The nightly, the
    # publish legs and the fan-out are unbounded and still build the whole
