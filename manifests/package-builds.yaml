schema: 1
# Legacy native-spec trees remain data-driven build cells until their sources
# migrate to packages/<name>/package.yaml. No family owns a workflow.
native_builds:
  - id: gnome49-el10-x86_64
    family: gnome49
    enabled: false
    track: legacy
    series: "49"
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: .copr/build-order-gnome49.yml
    mock_config: centos-stream-10-ci-gnome49
    source_paths: [src/gnome-49/, src/deps/]
    r2_path: gnome49/10-stream-x86_64
    # Bounds the PR gate to this chain's FIRST tier. The nightly, the
    # publish legs and the fan-out are unbounded and still build the whole
    # family; only the --canary-common plan (pull_request/merge_group/push)
    # reads this. Without it a PR gate rebuilt the ENTIRE chain: measured
    # on #576's gate, xfce-el10-x86_64 took 51m and xfce-el10-aarch64 38m
    # for a change that could not affect either, while gnome50/51 ran past
    # 50m unfinished. hummingbird carried this from the start; the other
    # families were simply never given one.
    canary_tiers: base-tools
  - id: gnome50-el10-x86_64
    family: gnome50
    track: stable
    series: "50"
    dependency_tree: manifests/dependency-trees/gnome.yaml
    target_queue: manifests/target-queues/gnome.yaml
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order.yml
    # centos-stream-10-ci, the generic config, was what this cell used, and it
    # declares the XFCE family's published index and not this one's. Since
    # build-chain.sh skips any package the published index already serves, a
    # skipped GNOME package landed in no repo the buildroot could see; run
    # 33835533548 burned 64 minutes and failed gtk4 and pango on the glib2 and
    # pango it had skipped. centos-stream-10-ci-gnome50 declares
    # [tunaos-gnome50], so the skip and the buildroot finally agree.
    mock_config: centos-stream-10-ci-gnome50
    # input-remapper and python3-evdev are built out of their own top-level
    # directories; without them listed, editing those specs does not re-key
    # this cell and the cache serves a build made from the old spec.
    source_paths: [src/gnome-50/, src/deps/, src/input-remapper/, src/python3-evdev/]
    # The family's OWN prefix, like gnome51/ and xfce/. It used to say
    # repo/10-x86_64, the tideforge mirror prefix, which the publish planner
    # refuses by name (two `rclone sync` writers delete each other's
    # packages; run 33751204743 failed at plan on exactly that) -- so this
    # family had never been published by the factory at all. What was
    # served at gnome50/10-stream-x86_64 until the first factory publish was
    # a COPR mirror written by the deleted refresh-gnome50-r2.yml
    # (2026-08-04); publish-rpm-wave.sh --evict-foreign clears it, because a
    # family prefix carries only what this factory built and signed
    # (maintainer directive 2026-09-03: no more COPR, build in GitHub).
    r2_path: gnome50/10-stream-x86_64
    # Bounds the PR gate to this chain's FIRST tier. The nightly, the
    # publish legs and the fan-out are unbounded and still build the whole
    # family; only the --canary-common plan (pull_request/merge_group/push)
    # reads this. Without it a PR gate rebuilt the ENTIRE chain: measured
    # on #576's gate, xfce-el10-x86_64 took 51m and xfce-el10-aarch64 38m
    # for a change that could not affect either, while gnome50/51 ran past
    # 50m unfinished. hummingbird carried this from the start; the other
    # families were simply never given one.
    canary_tiers: base-tools
  - id: gnome51-el10-x86_64
    family: gnome51
    track: next
    series: "51"
    dependency_tree: manifests/dependency-trees/gnome.yaml
    target_queue: manifests/target-queues/gnome.yaml
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order-gnome51.yml
    mock_config: centos-stream-10-ci-gnome51
    source_paths: [src/gnome-51/, src/deps/]
    r2_path: gnome51/10-stream-x86_64
  # gnome50 on aarch64. Reuses build-order.yml unchanged: the manifest's
  # `target:` feeds only the %{dist} derivation, which is .el10 for
  # centos-stream-10-* on either arch, and its `r2_path:` is overridden by the
  # cell's. That is the pattern xfce-el10-aarch64 and hummingbird-aarch64
  # already use -- neither has an arch-specific manifest.
  #
  # Its own r2 prefix, the straight arch swap of the x86_64 leg's
  # gnome50/10-stream-x86_64: one prefix per family and arch, never shared,
  # because two `rclone sync` writers into one prefix delete each other's
  # packages (#124).
  #
  # Not yet in el10's published_index.aarch64: manifests/package-factory.yaml
  # says a prefix goes in only once it actually resolves, and this one 404s
  # until the first wave publishes.
    # Bounds the PR gate to this chain's FIRST tier. The nightly, the
    # publish legs and the fan-out are unbounded and still build the whole
    # family; only the --canary-common plan (pull_request/merge_group/push)
    # reads this. Without it a PR gate rebuilt the ENTIRE chain: measured
