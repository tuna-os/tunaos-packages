# TunaOS package-factory target contract.
#
# A source is imported from its upstream, rebuilt here, tested against one of
# these targets, signed by TunaOS, and then promoted to the matching R2 path.
# Upstreams are source/provenance inputs only; their binaries and repositories
# are never enabled on a TunaOS image.
schema: 1

upstreams:
  - id: ublue-bluefin
    url: https://github.com/ublue-os/bluefin
    license_review: required
  - id: ublue-aurora
    url: https://github.com/ublue-os/aurora
    license_review: required
  - id: zirconium
    url: https://github.com/zirconium-dev/zirconium
    license_review: required

targets:
  el10:
    status: supported
    format: rpm
    buildroot: epel-10
    architectures: [x86_64, aarch64]
    r2_path: rpm/el10/{arch}
    # The SERVED read URL of what this target has published — distinct from
    # r2_path, which is the bucket WRITE path (the two genuinely differ:
    # rpm/el10/x86_64 404s on repo.tunaos.org while repo/10/x86_64 serves,
    # measured 2026-08-18). scripts/factory-status.py reads these to report
    # built-vs-needed per target; only declare an index that actually
    # resolves. aarch64 has no served el10 index yet, so it is deliberately
    # absent — the status page reports what it cannot measure.
    #
    # An arch may declare MORE THAN ONE index (#467), because el10 has two
    # publishers writing to two disjoint prefixes: publish-tideforge-rpms.yml
    # syncs into repo/10-x86_64 (served /repo/10/x86_64/) and
    # publish-build-chain-rpms.yml into each family's own prefix. Declaring
    # only the first is what made every build-chain product invisible:
    # libxfce4ui-devel has been built and SERVED the whole time, at
    # xfce/10-stream-x86_64, where no buildroot looked. A bare string is
    # still accepted and means one index (see scripts/published_index.py).
    published_index:
      x86_64:
        - https://repo.tunaos.org/repo/10/x86_64/
        # The xfce build-chain family's r2_path. Added because
        # tideforge-xfwl4-el10 BuildRequires libxfce4ui-devel/xfconf-devel,
        # which only this index carries. The sibling gnome49/gnome51
        # prefixes are deliberately NOT here: they hold GNOME 50/51
        # bootstrap glib2 builds whose `Obsoletes: glib2 < 2.87.3` hijacks
        # the AppStream package at any repo priority (publish run
        # 32405815822). An index is additive to the buildroot's package
        # universe, so each one is declared on its own evidence.
        - https://repo.tunaos.org/xfce/10-stream-x86_64/
      # Created by publish-tideforge-rpms.yml's first green aarch64 publish
      # (the target contract's r2_path, served by the generic worker) —
      # declared only once the index actually resolves, per the rule above.
      aarch64: https://repo.tunaos.org/rpm/el10/aarch64/
    repository: rpm-md
    probe_image: quay.io/centos/centos:stream10
    # CRB is a signed, target-native CentOS repository.  It supplies selected
    # development headers (for example Qt private API metadata) during builds.
    build_repositories: [crb, epel]
    # Repos the produced el10 image ENABLES at runtime (tunaOS
    # build_scripts/10-base-packages.sh runs `crb enable` / `dnf
    # config-manager --set-enabled crb` and `--set-enabled epel` on every EL
    # base), so the clean-install verify resolves against the same repo
    # closure a real install has. Without these the verify is dishonestly
    # NARROWER than the image: run 32382594650 failed 19 el10 cells on deps
    # EPEL serves (gnome-icon-theme for pop-icon-theme, libdav1d.so.7 for
    # cosmic-bg) that every shipped image resolves fine. Distinct from
    # build_repositories — that is the buildroot's set — even though el10's
    # two sets happen to match.
    system_repositories: [crb, epel]
  ubuntu:
    status: supported
    format: deb
    suites: [resolute]
    architectures: [amd64, arm64]
    r2_path: apt/ubuntu/{suite}/{arch}
    # The SERVED flat apt repo publish-tideforge-debs.yml maintains (Packages.gz
    # at the root, HTTP 200 measured 2026-08-20). The publisher builds amd64
    # debs only today, so only amd64 is declared — same honesty rule as el10's
    # missing aarch64 entry.
    published_index:
      # BOTH arches read the SAME flat repo. A flat apt repository serves
      # every architecture from one URL -- one pool, one Packages, and apt
      # selects on the Architecture field -- which is exactly how
      # publish-tideforge-debs.yml writes it.
      #
      # arm64 was missing, and that is not cosmetic: published_index.py
      # resolves per-arch, so the arm64 cell got an EMPTY PUBLISHED_INDEX, wrote
      # no apt source, and reported `libcpptrace-dev NOT AVAILABLE` against a
      # package that is built, published and served for arm64. The producer
      # side of the same gap was the publisher having no arch dimension at all.
      amd64: https://repo.tunaos.org/tideforge/ubuntu/
      arm64: https://repo.tunaos.org/tideforge/ubuntu/
    repository: apt
    probe_image: docker.io/library/ubuntu:26.04
  debian:
    status: supported
    format: deb
    suites: [sid]
    architectures: [amd64, arm64]
    r2_path: apt/debian/{suite}/{arch}
    # Same shape as ubuntu's: the served tideforge debian-sid repo, amd64 only.
    published_index:
      amd64: https://repo.tunaos.org/tideforge/debian-sid/
      arm64: https://repo.tunaos.org/tideforge/debian-sid/
    repository: apt
    probe_image: docker.io/library/debian:sid
  fedora:
    status: supported
    format: rpm
    buildroot: fedora-44
    # aarch64 was declared when xfce-fedora-aarch64 was defined.
    # scripts/tideforge-action-cache.py validates a cell's arch against this
    # list before it can compute an action key, so the cell failed instantly
    # with "aarch64 is not declared for target fedora". The contract is the
    # authority: adding a cell without amending it defines work the factory
    # refuses to key.
    architectures: [x86_64, aarch64]
    r2_path: xfce/44-x86_64
    # The served rpm-md index for the Fedora XFCE family (repomd.xml HTTP 200
    # measured 2026-08-20) — declaring it makes the target measured with the
    # existing rpm reader.
    published_index:
      x86_64: https://repo.tunaos.org/xfce/44-x86_64/
    # aarch64 has no index yet: xfce/44-aarch64 does not exist until a wave
    # writes it, and declaring a URL that 404s is worse than declaring none.
    #
    # Stated rather than simply omitted, because an omission is exactly the
    # defect the published_index tests exist to catch: ubuntu and debian each
    # declared two arches with an amd64-only index, so arm64 got an EMPTY
    # PUBLISHED_INDEX and every factory-built dependency read as NOT
    # AVAILABLE against packages that were built and served. That looked like
    # a recipe problem for several rounds.
    #
    # An arch listed here is asserting "no index BY DESIGN, not yet". An arch
    # that is neither indexed nor listed here still fails, which keeps the
    # original guard intact.
    published_index_pending: [aarch64]
    repository: rpm-md
    probe_image: registry.fedoraproject.org/fedora:44
    build_repositories: [fedora-44]
    gap_measurement:
      roots_manifest: manifests/xfce-fedora.yaml
      target_index: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
      reference_index: https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/x86_64/os/
      source_reference_index: https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/source/tree/
      # How gap-drift.yml treats this target. `exhibit`: dispatch-only —
      # regenerate NEXT TO the curated order and show the diff, because the
      # conversion row (docs/rfc011-conversions.md) is not passed yet: the
      # engine satisfies requirements by name and this family exists because
      # of `>= 4.21` version pins. Becomes `propose` in the PR that passes
      # exact-or-explained and deletes the curated file.
      drift:
        mode: exhibit
        build_order: build-order-xfce-fedora.generated.yml
        compare_to: build-order-xfce-fedora.yml
        report_json: fedora-gap.json

  eln:
    status: supported
    format: rpm
    buildroot: fedora-eln
    architectures: [x86_64, aarch64]
    r2_path: rpm/eln/{arch}
    published_index_pending: [x86_64, aarch64]
    repository: rpm-md
    probe_image: registry.fedoraproject.org/eln-bootc:latest
    build_repositories: [eln]

  hummingbird:
    # Hummingbird is a target of a different shape from the rest, and the
    # differences are load-bearing rather than cosmetic.
    #
    # It is not a distribution we can pull: there is no hummingbird container
    # image. It is an external RPM repository (Red Hat's public-hummingbird),
    # and mock/hummingbird-ci.cfg reaches it by including Fedora Rawhide's
    # chroot config and layering that repository over it at priority 10.
    #
    # `scaffold`, deliberately, and not because the builds do not work -- they
    # do; the desktop gate has published over a thousand packages. It is
    # scaffold because probe_image cannot yet tell the truth for this target.
    # The probe answers "is this dependency available", and the only image
    # that boots a Hummingbird-shaped root is the Fedora Rawhide base beneath
    # it, which answers yes for packages Hummingbird does not ship. A probe
    # that lies is worse than a probe that is absent, so no recipe should opt
    # into targets: [hummingbird] until this points at something Hummingbird-
    # shaped -- an image built from the target's own repository.
    status: scaffold
    format: rpm
    # A Hummingbird-shaped image at last: the upstream bootc-os image, pinned
    # to the same digest tunaOS builds from. It ships Hummingbird's OWN repos
    # and nothing else, so the probe answers from what the target actually
    # serves rather than from the Rawhide base beneath it — the lie the note
    # above describes. Measured, not assumed: inside exactly this image,
    # tunaOS run 32813311729 resolved dbus-daemon and got
    # "No match for argument: flatpak", the truthful answer for a
    # distribution that does not package flatpak.
    #
    # The scaffold status can now be lifted on its own merits: the reason
    # recorded above (probe cannot tell the truth) no longer holds. Left as
    # scaffold here because flipping it is a policy decision about letting
    # recipes opt in, not part of making the probe honest.
    probe_image: quay.io/hummingbird-community/bootc-os:latest@sha256:c5539f9ed4d93aab6bd41e4f5aef8ab83055f3f9e855a47b69fadb7420d0d1df
    # aarch64 added for tunaOS#1755 §3: hummingbird's desktop flavors declare
    # linux/arm64, but until this leg publishes something, every aarch64
    # rebuild path 404s -- the only live repo was 20251124-x86_64. mock/
    # hummingbird-ci-aarch64.cfg is the aarch64 counterpart of
    # mock/hummingbird-ci.cfg (same shape as centos-stream-10-ci-aarch64.cfg
    # is to centos-stream-10-ci.cfg); build-hummingbird-desktops.yml's
    # build-aarch64 job runs it on ubuntu-24.04-arm against
    # ghcr.io/tuna-os/mock-runner:centos-stream-10-aarch64.
    architectures: [x86_64, aarch64]
    # Not under rpm/: this path is already published and holds the packages
    # the desktop builds have produced. Moving it would orphan them.
    r2_path: hummingbird/20251124-x86_64
    # A second literal field, not a `{arch}` template substituted at read
    # time: r2_path above is read verbatim by build-hummingbird-desktops.yml's
    # `build` job (steps.target), unformatted, and that job publishes the
    # already-live x86_64 leg -- templating r2_path itself and leaving that
    # step un-updated would have made it publish to the literal path
    # "hummingbird/20251124-{arch}" instead. r2_path_aarch64 is read only by
    # the new `build-aarch64` job, so the established leg's step never has to
    # change to accommodate it.
    r2_path_aarch64: hummingbird/20251124-aarch64
    # Served read URLs of the published snapshots (see el10's note: r2_path
    # is the write path; these are what images and scripts/factory-status.py
    # actually resolve). Both legs verified live 2026-08-18.
    published_index:
      x86_64: https://repo.tunaos.org/hummingbird/20251124-x86_64/
      aarch64: https://repo.tunaos.org/hummingbird/20251124-aarch64/
    repository: rpm-md
    # RFC 011 Phase 1: the generic gap-engine contract. The roots remain
    # target-specific (the desktop manifest); live repository inputs belong
    # here alongside the rest of the target contract, not in a workflow.
    gap_measurement:
      roots_manifest: manifests/hummingbird-desktops.yaml
      target_index: https://packages.redhat.com/api/pulp-content/public-hummingbird/$arch/
      reference_index: https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/x86_64/os/
      source_reference_index: https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Everything/source/tree/
      # `propose`: scheduled, revision-gated, opens a review PR with the
      # regenerated build order when the live target index moves.
      drift:
        mode: propose
        build_order: build-order-hummingbird-desktops.yml
        report_json: docs/hummingbird-desktop-gap.json
      # Repositories a consumer image enables NEXT TO the target and our
      # prefix. Whatever they ship is counted as already had by the gap
      # engine (never rebuilt here) and enabled by the installability walk.
      # They are not references: nothing is ordered through their
      # BuildRequires.
      #
      # utah-packages is Bluefin's GNOME 51 for Hummingbird, built in
      # Hummingbird's own root, shipped as an OCI image whose one layer is a
      # createrepo_c tree (/repository) -- read straight out of the registry
      # by scripts/oci_repository.py. tunaOS's hummingbird:gnome consumes
      # this exact digest (its image-versions.yaml `utah-packages`); keep the
      # two pins moving together. Decided in #629; docs/HUMMINGBIRD-TARGET.md.
      consumed_indexes:
        - id: utah-packages
          index: oci://ghcr.io/projectbluefin/utah-packages@sha256:9cb667291a1a0b112c39d3c6a69116bb52cb1a10c7df12290b9c298b5682426c
          serves: [gnome]
    # Buildroot inputs only, never repositories on a produced image. Fedora
    # Rawhide supplies -devel headers and build backends Hummingbird has no
    # build of yet; Fedora 44 supplies the Python namespace at the target's
    # own ABI (3.14, where Rawhide is 3.15).
    # Fedora 44 plus public-hummingbird is Hummingbird's own build-root
    # composition (redhat/hummingbird/containers images/variables.yml); the
    # Rawhide root this used to name leaked GLIBC_2.44 into three served
    # packages.  Mirrors mock/hummingbird-ci*.cfg; docs/HUMMINGBIRD-TARGET.md.
    build_repositories: [fedora-44, fedora-44-updates]
  opensuse-tumbleweed:
    status: supported
    format: rpm
    architectures: [x86_64, aarch64]
    r2_path: rpm/opensuse-tumbleweed/{arch}
    # The SERVED index, live since the first publish wave (2026-08-25,
    # publish-tideforge-rpms.yml: libseat, quickshell, dms, dms-greeter,
    # greetd, dgop, danksearch, cpptrace-devel — 17 names on each arch,
    # verified resolving before this declaration per the repo's rule).
    # Tumbleweed ships current desktops itself, so this overlay carries
    # only what its repositories lack: the niri/DMS stack.
    published_index:
      x86_64: https://repo.tunaos.org/rpm/opensuse-tumbleweed/x86_64/
      aarch64: https://repo.tunaos.org/rpm/opensuse-tumbleweed/aarch64/
    repository: rpm-md
    probe_image: registry.opensuse.org/opensuse/tumbleweed:latest
  arch:
    status: scaffold
    format: pkg.tar.zst
    # aarch64 is declared with no build leg, no published index and no
    # consumer (marlin, the Arch variant, is x86_64-only in tunaOS's
    # build-config). Narrowing this to [x86_64] is measured and decided
    # (docs/PACKAGE_FACTORY.md, "one contract"), but it ships in its own PR:
    # touching `architectures` schedules every Arch cell, and the Arch
    # engine cannot yet build a cell whose runtime deps are sibling recipes
    # (dms-cli needs dms and quickshell; makepkg has no repo to find them
    # in). That staging gap is the prerequisite; see tunaos-packages#631.
    architectures: [x86_64, aarch64]
    r2_path: pacman/arch/{arch}
    repository: pacman
    probe_image: docker.io/library/archlinux:latest

# Cross-distro dependency capabilities.  Recipes express the dependency they
# need; Tideforge resolves it to native package names for the selected target.
# A value may be a list when a distribution splits one capability into several
# packages.  Native names remain available under dependencies.*.common/targets
# for exceptional or genuinely target-specific requirements.
dependency_catalog:
  rust: {el10: [rust, cargo], eln: [rust, cargo], ubuntu: [rustc, cargo], debian: [rustc, cargo], opensuse-tumbleweed: [rust, cargo], arch: [rust]}
  go: {el10: [golang], eln: [golang], ubuntu: [golang-go], debian: [golang-go], opensuse-tumbleweed: [go], arch: [go]}
  c-compiler: {el10: [gcc], eln: [gcc], ubuntu: [build-essential], debian: [build-essential], opensuse-tumbleweed: [gcc], arch: [base-devel]}
  cpp-compiler: {el10: [gcc-c++], eln: [gcc-c++], ubuntu: [g++], debian: [g++], opensuse-tumbleweed: [gcc-c++], arch: [base-devel]}
  pkg-config: {el10: [pkgconf-pkg-config], eln: [pkgconf-pkg-config], ubuntu: [pkg-config], debian: [pkg-config], opensuse-tumbleweed: [pkgconf-pkg-config], arch: [pkgconf]}
  cmake: {el10: [cmake], eln: [cmake], ubuntu: [cmake], debian: [cmake], opensuse-tumbleweed: [cmake], arch: [cmake]}
  ninja: {el10: [ninja-build], eln: [ninja-build], ubuntu: [ninja-build], debian: [ninja-build], opensuse-tumbleweed: [ninja], arch: [ninja]}
  # Wayland-desktop build capabilities (#169). Nothing COSMIC links against
  # had a catalog entry, which made every deb widening a hand-curated name
  # hunt; these eight unblock all 14 cosmic recipes at once. Arch dev headers
  # ship in the main package, so the arch column names the library package.
  wayland-dev: {el10: [wayland-devel], eln: [wayland-devel], ubuntu: [libwayland-dev], debian: [libwayland-dev], opensuse-tumbleweed: [wayland-devel], arch: [wayland]}
  libxkbcommon-dev: {el10: [libxkbcommon-devel], eln: [libxkbcommon-devel], ubuntu: [libxkbcommon-dev], debian: [libxkbcommon-dev], opensuse-tumbleweed: [libxkbcommon-devel], arch: [libxkbcommon]}
  libinput-dev: {el10: [libinput-devel], eln: [libinput-devel], ubuntu: [libinput-dev], debian: [libinput-dev], opensuse-tumbleweed: [libinput-devel], arch: [libinput]}
  pipewire-dev: {el10: [pipewire-devel], eln: [pipewire-devel], ubuntu: [libpipewire-0.3-dev], debian: [libpipewire-0.3-dev], opensuse-tumbleweed: [pipewire-devel], arch: [libpipewire]}
  gbm-dev: {el10: [mesa-libgbm-devel], eln: [mesa-libgbm-devel], ubuntu: [libgbm-dev], debian: [libgbm-dev], opensuse-tumbleweed: [libgbm-devel], arch: [mesa]}
  pixman-dev: {el10: [pixman-devel], eln: [pixman-devel], ubuntu: [libpixman-1-dev], debian: [libpixman-1-dev], opensuse-tumbleweed: [libpixman-1-0-devel], arch: [pixman]}
  dav1d-dev: {el10: [libdav1d-devel], eln: [libdav1d-devel], ubuntu: [libdav1d-dev], debian: [libdav1d-dev], opensuse-tumbleweed: [libdav1d-devel], arch: [dav1d]}
  libdisplay-info-dev: {el10: [libdisplay-info-devel], eln: [libdisplay-info-devel], ubuntu: [libdisplay-info-dev], debian: [libdisplay-info-dev], opensuse-tumbleweed: [libdisplay-info-devel], arch: [libdisplay-info]}
  gettext: {el10: [gettext], eln: [gettext], ubuntu: [gettext], debian: [gettext], opensuse-tumbleweed: [gettext-tools], arch: [gettext]}
  dbus: {el10: [dbus], eln: [dbus], ubuntu: [dbus], debian: [dbus], opensuse-tumbleweed: [dbus-1], arch: [dbus]}
  dbus-dev: {el10: [dbus-devel], eln: [dbus-devel], ubuntu: [libdbus-1-dev], debian: [libdbus-1-dev], opensuse-tumbleweed: [dbus-1-devel], arch: [dbus]}
  bluez: {el10: [bluez-libs], eln: [bluez-libs], ubuntu: [bluez], debian: [bluez], opensuse-tumbleweed: [bluez], arch: [bluez]}
  bluez-dev: {el10: [bluez-libs-devel], eln: [bluez-libs-devel], ubuntu: [libbluetooth-dev], debian: [libbluetooth-dev], opensuse-tumbleweed: [bluez-devel], arch: [bluez-libs]}
  lmdb-dev: {el10: [lmdb-devel], eln: [lmdb-devel], ubuntu: [liblmdb-dev], debian: [liblmdb-dev], opensuse-tumbleweed: [lmdb-devel], arch: [lmdb]}
  lmdb: {el10: [lmdb-libs], eln: [lmdb-libs], ubuntu: [liblmdb0], debian: [liblmdb0], opensuse-tumbleweed: [lmdb], arch: [lmdb]}
  pam-dev: {el10: [pam-devel], eln: [pam-devel], ubuntu: [libpam0g-dev], debian: [libpam0g-dev], opensuse-tumbleweed: [pam-devel], arch: [pam]}
  flatpak: {el10: [flatpak], eln: [flatpak], ubuntu: [flatpak], debian: [flatpak], opensuse-tumbleweed: [flatpak], arch: [flatpak]}
  extra-cmake-modules: {el10: [extra-cmake-modules], eln: [extra-cmake-modules], ubuntu: [extra-cmake-modules], debian: [extra-cmake-modules], opensuse-tumbleweed: [extra-cmake-modules], arch: [extra-cmake-modules]}
  kf6-config-dev: {el10: [kf6-kconfig-devel], eln: [kf6-kconfig-devel], ubuntu: [libkf6config-dev], debian: [libkf6config-dev], opensuse-tumbleweed: [kf6-kconfig-devel], arch: [kconfig]}
  kf6-runner-dev: {el10: [kf6-krunner-devel], eln: [kf6-krunner-devel], ubuntu: [libkf6runner-dev], debian: [libkf6runner-dev], opensuse-tumbleweed: [kf6-krunner-devel], arch: [krunner]}
  kf6-i18n-dev: {el10: [kf6-ki18n-devel], eln: [kf6-ki18n-devel], ubuntu: [libkf6i18n-dev], debian: [libkf6i18n-dev], opensuse-tumbleweed: [kf6-ki18n-devel], arch: [ki18n]}
  kf6-coreaddons-dev: {el10: [kf6-kcoreaddons-devel], eln: [kf6-kcoreaddons-devel], ubuntu: [libkf6coreaddons-dev], debian: [libkf6coreaddons-dev], opensuse-tumbleweed: [kf6-kcoreaddons-devel], arch: [kcoreaddons]}
  qt6-base-dev: {el10: [qt6-qtbase-devel], eln: [qt6-qtbase-devel], ubuntu: [qt6-base-dev], debian: [qt6-base-dev], opensuse-tumbleweed: [qt6-base-devel], arch: [qt6-base]}
  # PEP 517 Python build system.  EL10 needs python3-devel for the
  # pyproject macros (which also supply python3), plus setuptools for
  # setup.py projects.  DEB targets separate the interpreter (python3),
  # the build plugin (pybuild-plugin-pyproject) and dh-python itself.
  # Arch splits python-build (PEP 517 frontend) from python-installer
  # (wheel installer) and python-setuptools (setup.py build backend).
  python-build: {el10: [python3-devel, python3-setuptools], eln: [python3-devel, python3-setuptools], ubuntu: [python3, python3-setuptools, dh-python, pybuild-plugin-pyproject], debian: [python3, python3-setuptools, dh-python, pybuild-plugin-pyproject], opensuse-tumbleweed: [python3-devel, python3-setuptools], arch: [python, python-build, python-installer, python-setuptools]}
  python: {el10: [python3], eln: [python3], ubuntu: [python3], debian: [python3], opensuse-tumbleweed: [python3], arch: [python]}
