# Packages withdrawn from a target's SERVED index: upstream now ships a
# newer build and the consuming desktop manifests add our rebuild repository
# at `priority: 5` -- absolute in dnf, not a tie-break -- so our older copy
# would otherwise shadow upstream's fix on every image (tunaos-packages#525).
#
# Withdrawal here means EXCLUDED FROM REPODATA, not deleted from the bucket.
# scripts/publish-rpm-wave.sh's --exclude-file turns each entry below into a
# createrepo_c -x glob (scripts/plan-withdrawn-excludes.py does the turning),
# so the next publish's regenerated index omits exactly the NEVR named here
# while the RPM stays on disk untouched. That keeps the change reversible --
# delete the entry, the next publish indexes the file back in -- and inert
# against publish-rpm-wave.sh's NEVER SHRINK guard, which counts files on
# disk and never observes a withdrawal: the file it already counted is still
# there, just unlisted in repodata.
#
# Anchored on name + evr, not bare name, on purpose. The gap measurement
# already stops asking the factory to REBUILD a name upstream ships (the
# closure-minus-upstream rule in manifests/<target>-desktops.yaml), so an
# entry here only ever matches the exact stale build that earned it. A
# future rebuild at a different evr -- upstream dropping the package, or us
# legitimately catching back up -- is a different glob and serves normally;
# nothing here can accidentally suppress it.
#
# scripts/check-upstream-shadowing.py cross-references this file: a served
# package older than upstream's but ALREADY listed here is reported as
# pending (withdrawal recorded, waiting on the next publish to take effect)
# rather than failing the run as an unactioned case. Remove an entry once
# that script's `served_evr` for the package no longer matches it -- the next
# publish has indexed it back in at a build no longer older than upstream's,
# or the name dropped out of the overlap entirely.
