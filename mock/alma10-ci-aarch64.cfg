# Alma native ARM buildroot. No inherited CentOS or upstream EPEL repositories.
# Compiler configuration is an input; verify-cpu-baseline supplies artifact proof.
# ARM uses native Fedora EPEL as documented by Alma; never use this for v2.
# ICU 77 remains a private/static source dependency, never a system repository RPM.
config_opts['root'] = 'alma10-ci-aarch64'
config_opts['target_arch'] = 'aarch64'
config_opts['legal_host_arches'] = ('aarch64',)
config_opts['dist'] = 'el10.alma'
config_opts['releasever'] = '10'
config_opts['package_manager'] = 'dnf'
# Install target packages using native Alma RPM/DNF, not the outer runner.
config_opts['use_bootstrap'] = True
config_opts['use_bootstrap_image'] = True
config_opts['bootstrap_image'] = 'quay.io/almalinuxorg/almalinux@sha256:f65410c601aa3b514801aecf8d10eeefaa5b6a56248279b96e4085f1861b7d64'
config_opts['bootstrap_image_fallback'] = False
config_opts['bootstrap_image_ready'] = False
config_opts['oci_platform_map'] = {'aarch64': 'linux/arm64'}
config_opts['chroot_setup_cmd'] = 'install bash bzip2 coreutils cpio diffutils almalinux-release findutils gawk glibc-minimal-langpack grep gzip info patch python3 redhat-rpm-config rpm-build sed tar unzip util-linux which xz'
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False
# Preserve vendor hardening; the signed candidate policy guards actual chroot macros.
config_opts.setdefault('macros', {})
config_opts['macros']['%_target_cpu'] = 'aarch64'
config_opts['rpmbuild_command'] = '/usr/bin/python3 /keys/alma-rpmbuild-guard.py aarch64'
config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf'].setdefault('tmpfs_opts', {})['keep_mounted'] = True
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf'].setdefault('bind_mount_opts', {}).setdefault('dirs', []).extend([
    ('/local-repo', '/local-repo'),
    ('/keys', '/keys'),
])
# The runner stages distinct candidate and approved publisher keys; candidates are signed.
# Missing keys, signatures or repository metadata fail; no unsigned bootstrap.
config_opts['dnf.conf'] = """
[main]
reposdir=/dev/null
gpgcheck=1
localpkg_gpgcheck=1
assumeyes=1
best=1
install_weak_deps=0
module_platform_id=platform:el10
excludepkgs=icu77*

[baseos]
name=Alma native ARM BaseOS
baseurl=https://repo.almalinux.org/almalinux/10/BaseOS/aarch64/os/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[appstream]
name=Alma native ARM AppStream
baseurl=https://repo.almalinux.org/almalinux/10/AppStream/aarch64/os/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[crb]
name=Alma native ARM CRB
baseurl=https://repo.almalinux.org/almalinux/10/CRB/aarch64/os/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[epel-arm]
name=Native Fedora EPEL ARM
baseurl=https://dl.fedoraproject.org/pub/epel/10z/Everything/aarch64/
enabled=1
gpgcheck=1
gpgkey=https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[local-build]
name=Signed candidate build repository
baseurl=file:///local-repo/
enabled=1
gpgcheck=1
gpgkey=file:///keys/candidate-public.gpg
priority=1
cost=1
skip_if_unavailable=0
module_hotfixes=1
excludepkgs=icu77*

# The runner activates only a verified immutable family snapshot.
[tunaos-rpm]
name=Signed Alma native factory packages
baseurl=https://repo.tunaos.org/rpm/alma10/aarch64/
enabled=0
gpgcheck=1
gpgkey=file:///keys/tunaos-public.gpg
priority=11
cost=10
skip_if_unavailable=0
module_hotfixes=1
excludepkgs=icu77*
"""
