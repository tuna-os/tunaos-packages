# Relative include resolves against Mock --configdir, never a baked /etc/mock copy.
# Only this desktop family's signed published index may satisfy its builds.
include('alma10-kitten-ci.cfg')
config_opts['root'] = 'alma10-kitten-ci-gnome50'
# Replace the generic factory index, retaining native repositories and local priority.
config_opts['dnf.conf'] = config_opts['dnf.conf'].replace(
    '[tunaos-rpm]', '[tunaos-gnome50]'
).replace(
    'https://repo.tunaos.org/rpm/alma10-kitten/x86_64/',
    'https://repo.tunaos.org/gnome50/alma10-kitten-x86_64/'
)
