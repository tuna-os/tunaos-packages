# Alma native v2 buildroot. No inherited CentOS or upstream EPEL repositories.
# Compiler configuration is an input; verify-cpu-baseline supplies artifact proof.
# ICU 77 remains a private/static source dependency, never a system repository RPM.
config_opts['root'] = 'alma10-kitten-ci'
config_opts['target_arch'] = 'x86_64'
config_opts['legal_host_arches'] = ('x86_64',)
config_opts['dist'] = 'el10.alma'
config_opts['releasever'] = '10'
config_opts['package_manager'] = 'dnf'
# Install target packages using native Alma RPM/DNF, not the outer runner.
config_opts['use_bootstrap'] = True
config_opts['use_bootstrap_image'] = True
config_opts['bootstrap_image'] = 'quay.io/almalinuxorg/almalinux@sha256:a85da6343aca56df44ae45493a78bda56d4055d6e2d4c950ba81c7e25b25491a'
config_opts['bootstrap_image_fallback'] = False
config_opts['bootstrap_image_ready'] = False
config_opts['oci_platform_map'] = {'x86_64': 'linux/amd64/v2'}
config_opts['chroot_setup_cmd'] = 'install bash bzip2 coreutils cpio diffutils almalinux-kitten-release findutils gawk glibc-minimal-langpack grep gzip info patch python3 redhat-rpm-config rpm-build sed tar unzip util-linux which xz'
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False
# Preserve vendor hardening; the signed candidate policy guards actual chroot macros.
config_opts.setdefault('macros', {})
config_opts['macros']['%_target_cpu'] = 'x86_64'
config_opts['rpmbuild_command'] = '/usr/bin/python3 /keys/alma-rpmbuild-guard.py x86_64'
config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf'].setdefault('tmpfs_opts', {})['keep_mounted'] = True
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf'].setdefault('bind_mount_opts', {}).setdefault('dirs', []).extend([
    ('/local-repo', '/local-repo'),
    ('/keys', '/keys'),
])
# The runner stages distinct candidate and approved publisher keys; candidates are signed.
# Missing keys, signatures or repository metadata fail; no unsigned bootstrap.
config_opts['dnf.conf'] = """
[main]
reposdir=/dev/null
gpgcheck=1
localpkg_gpgcheck=1
assumeyes=1
best=1
install_weak_deps=0
module_platform_id=platform:el10
excludepkgs=icu77*

[baseos]
name=Alma native v2 BaseOS
baseurl=https://kitten.repo.almalinux.org/10-kitten/BaseOS/x86_64_v2/os/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[appstream]
name=Alma native v2 AppStream
baseurl=https://kitten.repo.almalinux.org/10-kitten/AppStream/x86_64_v2/os/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[crb]
name=Alma native v2 CRB
baseurl=https://kitten.repo.almalinux.org/10-kitten/CRB/x86_64_v2/os/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[alma-epel-v2]
name=Alma EPEL native v2
baseurl=https://epel.repo.almalinux.org/10/x86_64_v2/
enabled=1
gpgcheck=1
gpgkey=https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10-EPEL-AltArch
priority=50
skip_if_unavailable=0
excludepkgs=icu77*

[local-build]
name=Signed candidate build repository
baseurl=file:///local-repo/
enabled=1
gpgcheck=1
gpgkey=file:///keys/candidate-public.gpg
priority=1
cost=1
skip_if_unavailable=0
module_hotfixes=1
excludepkgs=icu77*

# The runner activates only a verified immutable family snapshot.
[tunaos-rpm]
name=Signed Alma native factory packages
baseurl=https://repo.tunaos.org/rpm/alma10-kitten/x86_64/
enabled=0
gpgcheck=1
gpgkey=file:///keys/tunaos-public.gpg
priority=11
cost=10
skip_if_unavailable=0
module_hotfixes=1
excludepkgs=icu77*
"""
