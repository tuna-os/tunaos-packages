# aarch64 counterpart to centos-stream-10-ci-gnome51.cfg.
#
# Same relationship that centos-stream-10-ci-aarch64.cfg has to
# centos-stream-10-ci.cfg: every x86_64-specific reference (base chroot
# template, koji buildroot URL, SIG proposed-updates URL) swapped for its
# aarch64 equivalent, and a distinct root so the GNOME 51 chroot is never
# confused with the generic one.
#
# No COPR fallback, for the same reason the x86_64 config gives: the R2-backed
# local-build repo is the sole source of our own packages (#113, #179). A
# fallback that silently satisfies a missing BuildRequires makes the build look
# self-sufficient when it is not.
#
# Runs on a native aarch64 GitHub-hosted runner (ubuntu-24.04-arm) — mock
# targets the architecture it is running on unless told otherwise, so only the
# base chroot template needs naming.

include('/etc/mock/epel-10-aarch64.cfg')

config_opts['root'] = 'centos-stream-10-ci-gnome51-aarch64'

config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False

config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf'].setdefault('tmpfs_opts', {})
config_opts['plugin_conf']['tmpfs_opts']['keep_mounted'] = True

config_opts['yum.conf'] += """
[local-build]
name=Local Build Repository
baseurl=file:///local-repo/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1
module_hotfixes=1

[c10s-build]
name=CentOS Stream 10 Koji buildroot
baseurl=https://kojihub.stream.centos.org/kojifiles/repos/c10s-build/latest/aarch64/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1

[c10s-proposed-updates]
name=CentOS Stream 10 SIG Proposed Updates
baseurl=https://mirror.stream.centos.org/SIGs/10-stream/proposed_updates/aarch64/packages-main/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1
"""

config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(
    ('/local-repo', '/local-repo')
)
