# aarch64 counterpart to fedora-44-ci.cfg — same shape, with the base chroot
# template swapped for its aarch64 equivalent.
#
# Written for the same reason centos-stream-10-ci-aarch64.cfg was: the xfce
# family had no aarch64 cell on any target, so el10/aarch64 served 20 catalog
# entries against x86_64's 91 and every xfce4-* name was missing (#480).
#
# Deliberately thin, exactly as the x86_64 config is. Fedora 44 already ships
# XFCE 4.20 — the release that added upstream Wayland support — and greetd,
# gtkgreet and cage are in Fedora proper. The single missing piece is xfwl4,
# the Rust/Smithay compositor, packaged nowhere for Fedora. So this chroot
# builds against stock Fedora with no hand-built dependency stack to layer in,
# which is also why an aarch64 twin is cheap here: three packages, and none of
# them is one of the two whose EL10 Requires cannot resolve (#482).
#
# Runs on a native aarch64 GitHub-hosted runner (ubuntu-24.04-arm) — mock
# targets the architecture it is running on unless told otherwise, so only the
# base chroot template needs changing, not an explicit target_arch.

include('/etc/mock/fedora-44-aarch64.cfg')

config_opts['root'] = 'fedora-44-ci-aarch64'

# Match COPR's network isolation: sources are staged before the build, so a
# spec that reaches out mid-build is a bug we want to fail on, not paper over.
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False

# Packages built by earlier tiers are served from the local repo, same as the
# x86_64 config.
config_opts['dnf.conf'] += """
[local-build]
name=Local build results
baseurl=file:///local-repo
enabled=1
gpgcheck=0
priority=1
cost=1
"""

# mock <= 6.7 queries the chroot rpmdb with the md5-based pkgid tag that
# Fedora 44's rpm 6 removed, so every build dies at "error: incorrect format:
# unknown tag: pkgid" before compiling anything. Upstream fixed it in mock
# commit edec6023 (2026-04-21) but no release since 6.7 carries it. The plugin
# only writes installed_pkgs.log/available_pkgs.log. Same workaround as the
# x86_64 config, and it must stay in step with it.
config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf']['package_state_enable'] = False
