# aarch64 counterpart to fedora-eln-ci.cfg — same shape, with the base chroot
# template swapped for its aarch64 equivalent.
#
# Runs on a native aarch64 GitHub-hosted runner (ubuntu-24.04-arm) — mock
# targets the architecture it is running on unless told otherwise, so only the
# base chroot template needs changing, not an explicit target_arch.

include('/etc/mock/fedora-eln-aarch64.cfg')

config_opts['root'] = 'fedora-eln-ci-aarch64'

config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False

config_opts['dnf.conf'] += """
[local-build]
name=Local build results
baseurl=file:///local-repo
enabled=1
gpgcheck=0
priority=1
cost=1
"""

config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf']['package_state_enable'] = False
