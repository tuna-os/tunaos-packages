# Mock config for building packages on Fedora ELN (EL11).
#
# Deliberately thin, following the fedora-44 and centos-stream-10 configurations.
# mock-core-configs ships /etc/mock/fedora-eln-x86_64.cfg and its template.

include('/etc/mock/fedora-eln-x86_64.cfg')

config_opts['root'] = 'fedora-eln-ci'

# Match COPR's network isolation: sources are staged before the build, so a
# spec that reaches out mid-build is a bug we want to fail on, not paper over.
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False

# Packages built by earlier tiers are served from the local repo, same as the
# EL10 and Fedora configs.
config_opts['dnf.conf'] += """
[local-build]
name=Local build results
baseurl=file:///local-repo
enabled=1
gpgcheck=0
priority=1
cost=1
# Packages published by earlier ELN XFCE tiers are also available when a
# package is rebuilt in isolation.
[tunaos-xfce]
name=TunaOS XFCE Wayland (published)
baseurl=https://repo.tunaos.org/xfce/eln-x86_64/
enabled=1
gpgcheck=0
cost=10
skip_if_unavailable=1

"""

# mock <= 6.7 queries the chroot rpmdb as
#   rpm -qa --qf '%{nevra} %{buildtime} %{size} %{pkgid} installed\n'
# in the package_state plugin, and rpm 6 removed the md5-based pkgid tag,
# so disable package_state until a fixed mock ships in the runner image.
config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf']['package_state_enable'] = False
