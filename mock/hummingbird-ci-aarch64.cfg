# Hummingbird buildroot: Fedora 44 plus Hummingbird's own repository, in that
# order of precedence.  This is the composition Hummingbird itself builds in
# (redhat/hummingbird/containers: mock/mock.cfg layers its Pulp repos over the
# [fedora]/[fedora-updates] repositories of a pinned release, and
# images/variables.yml pins that release to Fedora 44), and it is the
# composition projectbluefin/utah-packages used to build GNOME 51 for it.
#
# Until 2026-09-02 this file was based on Fedora RAWHIDE, on the measurement
# (docs/hummingbird-desktop-gap.md, 2026-08-06) that 30 of 38 core packages
# matched Rawhide's version-release.  That was true of the packages
# Hummingbird REBUILDS (glib2, harfbuzz, gcc, rust, meson -- Rawhide-era
# versions) and false of the packages that define its ABI, which are Fedora
# 44's.  Measured 2026-09-02 from the three indexes' primary.xml
# (docs/HUMMINGBIRD-TARGET.md has the full table and the checksums):
#
#     package       hummingbird          fedora 44         rawhide
#     glibc         2.43-8.4.hum1        2.43-2.fc44       2.44.9000-1.fc46
#     openssl-libs  3.5.8-0.1.hum1       3.5.5-1.fc44      4.0.2-1.fc46   (libcrypto.so.4)
#     python3       3.14.7-1.hum1        3.14.3-2.fc44     3.15.0~rc1-1.fc45
#     perl-libs     5.42.2-525.hum1      5.42.1-523.fc44   5.44.0-527.fc45
#     libxml2       2.15.3-0.1.4.hum1    2.12.10-6.fc44    2.13.9-4.fc45
#
# glibc, openssl, python and perl -- every interpreter and every ABI a built
# RPM inherits -- are Fedora 44's.  The three "pins" this file used to carry
# ([fedora-44-python], [fedora-44-perl], [fedora-44-mpich], each with an
# includepkgs list) were patching Fedora 44 back in one namespace at a time,
# and each one said "remove when Hummingbird catches up with Rawhide".
# Hummingbird was never going to: it is not tracking Rawhide's ABI.
#
# The cost of the Rawhide root was not hypothetical.  Our own published
# prefix (repo.tunaos.org/hummingbird/20251124-x86_64, index sha256
# dacef1b3b4c9…, 2026-09-02) serves gstreamer1-plugins-good, libavutil-free
# and zvbi requiring libm.so.6(GLIBC_2.44) -- Rawhide's glibc, baked in at
# link time -- which Hummingbird's 2.43 cannot provide.  Those three cannot
# install on the target they were built for; the GNOME closure needs all
# three.  utah-packages hit the same class one soname over (gnome-shell built
# on Rawhide needing libcrypto.so.4) and moved to this root; so does this file.
#
# Repository priority (lower wins in dnf; a name present in a higher-priority
# repo is dropped from every lower-priority one entirely):
#   1   local-build          RPMs produced by earlier tiers of this same run
#   10  hummingbird          the target's own signed RPMs -- the ABI we must match
#   11  utah                 projectbluefin/utah-packages, pinned by digest --
#                            GNOME 51 for Hummingbird, built in this same root.
#                            Whatever utah ships is not rebuilt here; utah wins
#                            ties so a stale factory RPM can never shadow it.
#   12  tunaos-hummingbird   the factory's published output -- fills what the
#                            base AND utah lack
#   50  fedora / updates     Fedora 44, the other half of Hummingbird's own build root
#
# Fedora 44 is a BUILDROOT input, never a repository on a produced image.  It
# supplies -devel headers, build backends and the Python/Perl module sets
# behind Hummingbird's interpreters; the runtime RPM that ships is always the
# one built here or the one Hummingbird ships.
#
# tests/test_hummingbird_buildroot_is_fedora44_plus_hummingbird.py guards the
# invariants below.
include('/etc/mock/fedora-44-aarch64.cfg')
config_opts['root'] = 'hummingbird-ci-aarch64'
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False

# The included template declares [fedora] and [updates] at the default
# priority (99) with metadata_expire=0.  Rewrite both in place rather than
# appending duplicate sections (a duplicate section is a parse error in
# libdnf5):
#
#   priority=50        Hummingbird (10) and our own output (11) must outrank
#                      Fedora for every name they carry -- that is the whole
#                      point of the overlay -- and Fedora must still outrank
#                      nothing else.
#   metadata_expire    F44 is a frozen release; re-fetching its 67k-package
#                      index per package build is the request storm that put
#                      the R2 worker at 76% of its daily limit on 2026-08-28.
#   excludepkgs        Fedora and Hummingbird ship a few capabilities under
#                      DIFFERENT names, so the by-name priority filter cannot
#                      arbitrate and dnf may pull both into one transaction.
#                      ruby-default-gems (fc44) vs ruby{3.3,3.4,4.0}-default-
#                      gems (hum1) is the measured case -- utah-packages saw it
#                      break webkitgtk, colord, libnotify and zsh.  Prefer the
#                      Hummingbird copy by removing Fedora's name.
#
# Fail closed: if the template's section headers ever change shape, stop
# rather than silently build against an un-prioritised Fedora.
for _section in ("[fedora]", "[updates]"):
    if _section not in config_opts['dnf.conf']:
        raise RuntimeError(f"hummingbird-ci.cfg: {_section} not found in the "
                           "included fedora-44 template; the priority "
                           "rewrite below would silently not apply")
    config_opts['dnf.conf'] = config_opts['dnf.conf'].replace(
        _section + "\n",
        _section + "\npriority=50\nmetadata_expire=6h\n"
        "excludepkgs=ruby-default-gems\n", 1)

# metadata_expire: these repos do not change while a chain runs, so dnf must
# not re-fetch their metadata for every package.  `0` is correct for exactly
# ONE repo -- [local-build], which grows as the chain builds and whose
# freshness the root-cache unpack depends on (see build-chain.sh's
# MOCK_CACHE_ARGS comment).  It stays 0 below.
config_opts['dnf.conf'] += """
[local-build]
name=Local Hummingbird build results
baseurl=file:///local-repo/
enabled=1
gpgcheck=0
priority=1

[hummingbird]
name=Hummingbird RPMs
baseurl=https://packages.redhat.com/api/pulp-content/public-hummingbird/$basearch/
gpgcheck=0
enabled=1
priority=10
# static: the base OS prefix is a fixed dated path
metadata_expire=6h
excludepkgs=golang1.26* jsoncpp*
# golang1.26*: a NAME split, not a version split.  Hummingbird publishes
# golang1.26/-bin/-src and never a plain `golang`; Fedora 44 publishes
# `golang` 1.26.1.  Both install candidates satisfy a `BuildRequires: golang`
# until rpm commits the file layout and reports
#
#     file /usr/lib/golang/src/... conflicts between attempted installs of
#     golang-src (fedora) and golang1.26-src-1.26.8-0.1.hum1.noarch
#
# -- run 31697678706 hung every desktop job inside swig's builddep on exactly
# this.  Excluding the Hummingbird family is safe where excluding a C library
# would not be: Go produces static binaries with no runtime library to
# version-match, so a binary built with Fedora's toolchain carries no soname
# coupling to Hummingbird's golang1.26, unlike libperl.so / python(abi).
# tests/test_hummingbird_golang_name_split.py guards this.
#
# jsoncpp* TEMPORARY.  The base compose bumped jsoncpp to libjsoncpp.so.27
# while every cmake it ships (4.3.0-5.1.hum1, re-measured 2026-09-02) still
# requires libjsoncpp.so.26 -- a rebuild-in-flight skew that makes cmake
# uninstallable, which takes down 211 of the 673 build-order packages
# (measured by scripts/simulate-buildroot-resolution.py).  Fedora 44's
# jsoncpp 1.9.6 provides .so.26 and its cmake 4.3.0 wants .so.26, a coherent
# pair; excluding the base's jsoncpp* lets that pair through.  Remove when
# the base compose ships a cmake linked against .so.27.

[utah]
name=projectbluefin utah-packages for hummingbird - GNOME 51, pinned by digest
# The OCI image has no HTTP baseurl, so the chain materialises it first
# (scripts/materialize-consumed-repo.py --ref <consumed_indexes pin> --out
# <dir>) and bind-mounts <dir> at /run/utah-repo inside the build container;
# see the matching bind_mount_opts append at the bottom of this file and the
# UTAH_REPO_DIR wiring in scripts/build-chain.sh. On arches utah does not
# publish (aarch64) the step writes a valid EMPTY repo, so dnf falls through
# to the repos below exactly as it does today.
#
# priority 11 is deliberate, between [hummingbird] and [tunaos-hummingbird]:
# whatever utah ships is not rebuilt here (the gap engine already excludes
# it from the build order), and utah wins ties so a stale factory RPM can
# never shadow the build utah actually did.
baseurl=file:///run/utah-repo/repository
gpgcheck=0
enabled=1
priority=11

[tunaos-hummingbird]
name=TunaOS factory output for hummingbird - our own build-chain packages
# The factory's own published prefix, and the reason dconf could not build.
#
# dconf BuildRequires vala, vala BuildRequires gobject-introspection-devel,
# and the factory has ALREADY built and published both against the right
# interpreter.  The buildroot simply had no repo pointing at them, so every
# resolution fell through to whatever Fedora offered.
#
# priority 12 is deliberate, below [hummingbird] AND [utah]:
#   1  local-build  this run's own output always wins
#   10 hummingbird  the base OS still wins for anything it ships
#   11 utah         whatever utah ships is not rebuilt here
#   12 HERE         fills what the base AND utah lack
#   50 fedora       Fedora 44, the other half of the build root
#
# Safe against the Obsoletes hijack that published_index.py records for the
# gnome50/51 prefixes (a bootstrap glib2 with `Obsoletes: glib2 < 2.87.3`
# replaces the base package regardless of repo priority; publish run
# 32405815822 died on it).  Measured, not assumed: of the packages in this
# prefix, ZERO obsolete any package the Hummingbird base ships.
# tests/test_hummingbird_buildroot_reads_its_own_output.py pins both halves.
baseurl=https://repo.tunaos.org/hummingbird/20251124-$basearch/
gpgcheck=0
enabled=1
priority=12
# static: our published index changes only when a publish runs, never mid-chain
metadata_expire=6h
# TEMPORARY.  Remove once a publish has re-synced this prefix.
#
# 79 RPMs in this prefix are stored under a filename containing a literal
# '+'.  librepo percent-encodes it and the R2 worker looks up raw paths, so
# every one of them 404s -- the incident scripts/publish-rpm-wave.sh:31
# already records, and the reason that script renames '+' to '.' on publish.
# These predate the rename and no publish has re-synced them since.
#
# Adding this repo (#548) is what made the buildroot depend on them, so the
# next publisher run failed on three packages it had never failed on before:
#
#   abseil-cpp     Cannot download mingw64-gcc-c%2b%2b-16.1.1-3.1.fc43.x86_64.rpm
#   inih           Cannot download mingw64-gcc-c%2b%2b-16.1.1-3.1.fc43.x86_64.rpm
#   dejavu-fonts   Cannot download libsigc%2b%2b20-2.12.2-1.fc43.x86_64.rpm
#
# Excluding them sends those resolutions to Fedora 44 (priority 50) --
# strictly better than a hard download failure, and scoped to the 78 names
# that cannot be fetched rather than weakening the repo as a whole.
#
# The two patterns are not redundant: 74 of the 78 carry '+' in the NAME
# (libsigc++20, mingw64-gcc-c++, python3-dns+doh), but libcdio-paranoia's
# '+' is in its VERSION (10.2+2.0.2), so a '*+*' name glob alone misses its
# four subpackages.
#
# publish-rpm-wave.sh:101 renames across the WHOLE synced-down repo, not
# just the staged wave, so the first publish that completes fixes all 79 and
# this exclude can go.
exclude=*+* libcdio-paranoia* jsoncpp* mingw* ucrt64-* wayland-protocols* python3-docutils* accounts-qml-module* aribb24* libmpcdec* libultrahdr* musepack-tools* poly2tri* quickshell* rapidjson* signon* stb* transfig* usbmuxd* vpnc*
# jsoncpp*: see [hummingbird] -- with the base's excluded, OUR jsoncpp
# (also .so.27, priority 11) would mask Fedora's .so.26 provider and
# reinstate the very block being dodged.  Only our own jsoncpp-devel
# requires .so.27 in this repo, and it leaves alongside its provider.
#
# mingw* / ucrt64-*: the '+'-glob above excluded mingw{32,64}-gcc-c++ but
# left the REST of our mingw toolchain visible, and dnf priorities split
# the toolchain across repos: our mingw32-gcc (11) masks Fedora's, while
# Fedora's mingw32-gcc-c++ -- the only c++ left -- requires an exact
# mingw32-gcc NEVR and gets our fc43 build instead.  Excluding the whole
# family keeps Fedora's toolchain internally coherent.
#
# wayland-protocols*: TEMPORARY.  Our served wayland-protocols-devel is
# 1.47-2.fc43 (stale, not in any build order) and at priority 11 it masks
# Fedora 44's 1.49.  gtk4 and mutter BuildRequire
# pkgconfig(wayland-protocols) >= 1.48, so the stale copy blocks the two
# packages the GNOME 51 goal hangs on.  Nothing rebuilds it in the chain;
# once a wave publishes a current build (or the stale one is pruned) this
# exclude can go.
#
# python3-docutils*: TEMPORARY.  Our served python3-docutils is 0.23-1.fc43;
# at priority 11 it masks F44's 0.22.4 while python3-sphinx (fc44) requires
# python3.14dist(docutils) >= 0.20 with < 0.23~~ -- 0.23 fails the upper
# bound, so every sphinx consumer (~17 sources incl. at-spi2-core and
# xdg-desktop-portal) is blocked by our own stale copy.  Excluding it lets
# F44's in-range 0.22.4 serve the buildroot.  Not in any build order; remove
# when the served copy is current or pruned.
#
# accounts-qml-module* .. vpnc*: TEMPORARY, the '^' twin of the '*+*' glob
# above.  50 served RPMs carry '^' in their VERSION (libultrahdr, signon,
# stb, quickshell ...), librepo percent-encodes it (%5E), the R2 worker
# looks up raw paths, 404.  Being version-side, a name glob cannot catch
# them, so the 14 affected NAME families are listed -- exactly how
# libcdio-paranoia* is handled above.  Leg 33022688689 failed dejavu-fonts
# on precisely libultrahdr-1.4.0^...rpm.  publish-rpm-wave.sh renames '^'
# like '+' (#555), so the first completed publish repairs all 50 and this
# list can go.
"""
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(('/local-repo', '/local-repo'))
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(('/run/utah-repo', '/run/utah-repo'))
