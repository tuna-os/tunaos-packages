schema: 1
name: cosmic-bg
version: "1.9.0"
release: 1
summary: Background manager for the COSMIC desktop environment
description: >-
  COSMIC background manager. TunaOS image branding owns the selected default
  background rather than embedding another distribution's artwork here.
license: Apache-2.0 AND MIT
source:
  url: https://github.com/pop-os/cosmic-bg/archive/epoch-1.9.0.tar.gz
  sha256: 848594cabc13d78fef20a907bc79aa2b132986e40bb042b9423779bfc081dcca
  directory: cosmic-bg-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-bg/vendor-1.9.0.tar.gz/sha512/1bae4a8c34ccb47b8045d983f6a0a8a5d88f55c0665e728e5343223ae3ae8a5e4cfefe2ab3374c425327312153dd3a1fc3cf68e6a5bf3257d270f2ab01572002/vendor-1.9.0.tar.gz
    sha256: ea07bf5ceb10acdb2a06dd3cf9819a65dbcdb148dad97bfc6df619571305b8dc
    filename: cosmic-bg-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-bg/raw/19b0f6a23fb45a064a6acc6b2f8309cc32747d71/f/vendor-config-1.9.0.toml
    sha256: f61ed575aa4cd7594f9b989af333971f40d2f7e6d6b6b75cc2ca92bfbc2b1601
    filename: cosmic-bg-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: 9d82a34dab4e73d90ba66c9f72d18d0f9b8be208
    VERGEN_GIT_COMMIT_DATE: "2026-09-11 14:38:13 -0600"
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    capabilities: [rust]
    targets:
      # desktop-backgrounds-compat is a TunaOS RPM-only shim (also required by
      # the hummingbird plasma-desktop/sddm specs); the deb targets ship the
      # background schema dirs themselves (files.common) and drop it rather
      # than pull an RPM-only name into a deb Build-Depends.
      el10: [cargo, lld, just, wayland-devel, libxkbcommon-devel, desktop-backgrounds-compat, libdav1d-devel]
      ubuntu: [cargo, lld, just, libwayland-dev, libxkbcommon-dev, libdav1d-dev]
      debian: [cargo, lld, just, libwayland-dev, libxkbcommon-dev, libdav1d-dev]
  runtime:
    targets:
      # cosmic-icon-theme and desktop-backgrounds-compat are TunaOS-built and
      # ship in neither deb archive; the gate's clean-install repo only holds
      # the cell's own artifact (same call as cosmic-settings, #225).
      el10: [cosmic-icon-theme >= 1.9.0, desktop-backgrounds-compat]
      ubuntu: []
      debian: []
files:
  common:
    - usr/bin/cosmic-bg
    - usr/share/cosmic/com.system76.CosmicBackground/v1/all
    - usr/share/cosmic/com.system76.CosmicBackground/v1/backgrounds
install:
  commands: ["just rootdir={destdir} prefix=/usr install"]
verify:
  smoke: "test -x /usr/bin/cosmic-bg && test -f /usr/share/cosmic/com.system76.CosmicBackground/v1/all"
targets: [el10, ubuntu, debian]
