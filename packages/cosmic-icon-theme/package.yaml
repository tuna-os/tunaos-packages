schema: 1
name: cosmic-icon-theme
version: "1.10.0"
release: 1
summary: Icon theme for the COSMIC desktop environment
description: COSMIC icon theme and freedesktop icon metadata for TunaOS.
license: CC-BY-SA-4.0
provides: [cosmic-icons]
# cosmic-session (and upstream specs) refer to the icon theme by its
# upstream name, cosmic-icons; the recipe builds it as cosmic-icon-theme,
# so the built artifact aliases the name it is required under (#169).
source:
  url: https://github.com/pop-os/cosmic-icons/archive/epoch-1.10.0.tar.gz
  sha256: 52625bef1b83ba2b08afe58197573738d72fb4d316de9d99eac34806a4cae80c
  directory: cosmic-icons-epoch-1.10.0
build_system: custom
build:
  commands: [":"]
dependencies:
  build:
    targets:
      el10: [just]
      ubuntu: [just]
      debian: [just]
  runtime:
    targets:
      el10: [pop-icon-theme]
      ubuntu: [pop-icon-theme]
      debian: [pop-icon-theme]
files:
  common: [usr/share/icons/Cosmic]
install:
  commands: ["just rootdir={destdir} prefix=/usr install"]
verify:
  smoke: test -d /usr/share/icons/Cosmic
targets: [el10, ubuntu, debian]
