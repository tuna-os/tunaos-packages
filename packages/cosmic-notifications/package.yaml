schema: 1
name: cosmic-notifications
version: "1.9.0"
release: 1
summary: Notifications daemon for COSMIC
description: COSMIC desktop notification daemon for TunaOS.
license: Apache-2.0 AND MIT
source:
  url: https://github.com/pop-os/cosmic-notifications/archive/epoch-1.9.0.tar.gz
  sha256: 36fb0a639461432f77df30e8d065ecc536a64a8504e2eebe4b0dcd054cffad08
  directory: cosmic-notifications-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-notifications/vendor-1.9.0.tar.gz/sha512/ce45324ef91dbd51ac98c7d8436e57a313cbe3ae77cc2be3d17efd8f43c24758406cf5938a16135968b30c45e5e616229b88b88ecc884e78aa83607063281bfc/vendor-1.9.0.tar.gz
    sha256: e955448916250c8d583c6c0dd1db6820812f2975c98af3054732372e4cb5e172
    filename: cosmic-notifications-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-notifications/raw/bd5bc1e2ff957f49f467c38ed5a4b87a6f095131/f/vendor-config-1.9.0.toml
    sha256: 873490cf9b9445cfa565f654d737765345e4ae7d9f4a7cb9fb147ac6d12400fc
    filename: cosmic-notifications-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: aa4dac2702506395ab76da1f6755e03b2ccb0db8
    VERGEN_GIT_COMMIT_DATE: "2026-09-16 16:30:13 -0400"
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    capabilities: [rust]
    targets:
      el10: [cargo, lld, just, libxkbcommon-devel, wayland-devel]
      alma10: [cargo, lld, just, libxkbcommon-devel, wayland-devel]
      alma10-kitten: [cargo, lld, just, libxkbcommon-devel, wayland-devel]
      ubuntu: [cargo, lld, just, libxkbcommon-dev, libwayland-dev]
      debian: [cargo, lld, just, libxkbcommon-dev, libwayland-dev]
  runtime:
    targets:
      # cosmic-icon-theme is TunaOS-built and ships in neither deb archive;
      # the gate's clean-install repo only holds the cell's own artifact
      # (same call as cosmic-settings, #225).
      el10: [cosmic-icon-theme >= 1.9.0]
      alma10: [cosmic-icon-theme >= 1.9.0]
      alma10-kitten: [cosmic-icon-theme >= 1.9.0]
      ubuntu: []
      debian: []
files:
  common: [usr/bin/cosmic-notifications]
install:
  commands: ["just rootdir={destdir} prefix=/usr install"]
verify:
  smoke: test -x /usr/bin/cosmic-notifications
targets: [el10, ubuntu, debian, alma10, alma10-kitten]
