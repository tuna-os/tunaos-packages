schema: 1
name: cosmic-panel
version: "1.9.0"
release: 1
summary: Panel for COSMIC
description: COSMIC desktop panel and dock for TunaOS.
license: Apache-2.0 AND MIT
source:
  url: https://github.com/pop-os/cosmic-panel/archive/epoch-1.9.0.tar.gz
  sha256: 6b036076e162568b6d0230ab82916b30d06b4942cb5be6a39960e42b499cab9b
  directory: cosmic-panel-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-panel/vendor-1.9.0.tar.gz/sha512/d2755baeb58afa8246d5d9d262411093333250f15243d82f0fdcb607e69e21abaa28d24a9ca8e6abbcfd8ff19f50e7eb20c206c5df4c15052af4a6479fda7da8/vendor-1.9.0.tar.gz
    sha256: 00275f7721c8ce4566d60e525488e8cd5f2f7ccd22484127a147de41a9ccfee9
    filename: cosmic-panel-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-panel/raw/b70e02edec348c4ab2a80e328ca92cbe28e2aa15/f/vendor-config-1.9.0.toml
    sha256: 864ff5121729eb9270c13c2aaa826407bf53c8c6410dd7e1ee9539b4d84eead0
    filename: cosmic-panel-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: b5cc19e351b82eed999097ced1ff267d27bf8e7a
    VERGEN_GIT_COMMIT_DATE: "2026-09-23 15:07:40 -0400"
  environment_by_target:
    alma10:
      PATH: /opt/tunaos/rust-1.93/bin:/usr/bin:/bin
    alma10-kitten:
      PATH: /opt/tunaos/rust-1.93/bin:/usr/bin:/bin
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    # wayland-dev / libxkbcommon-dev resolve the right -dev names per target
    # (#197); the rust capability already carries cargo. util-linux is for
    # the justfile's rev pipeline, same story as xdg-desktop-portal-cosmic.
    # pkg-config: smithay-client-toolkit's build script probes libxkbcommon
    # through it, and unlike dnf builddep on el10, deb -dev packages do not
    # pull pkg-config in (both deb cells died in the probe, run 30701973171).
    capabilities: [rust, pkg-config, wayland-dev, libxkbcommon-dev]
    targets:
      el10: [lld, just, util-linux]
      alma10: [tunaos-rust193 >= 1.93.0, lld, just, util-linux]
      alma10-kitten: [tunaos-rust193 >= 1.93.0, lld, just, util-linux]
      ubuntu: [lld, just, util-linux]
      debian: [lld, just, util-linux]
files:
  common:
    - usr/bin/cosmic-panel
    - usr/share/cosmic/com.system76.CosmicPanel*
install:
  commands: ["just rootdir={destdir} prefix=/usr install"]
verify:
  smoke: test -x /usr/bin/cosmic-panel
targets: [el10, ubuntu, debian, alma10, alma10-kitten]
