schema: 1
name: cosmic-randr
version: "1.9.0"
release: 1
summary: Display configuration command line tool for COSMIC
description: COSMIC display configuration command line tool for TunaOS.
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/cosmic-randr/archive/epoch-1.9.0.tar.gz
  sha256: 6c082cba6b80c5d89b02aec7ed315c9de8452cd413f5181ece43d7fdb3011481
  directory: cosmic-randr-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-randr/vendor-1.9.0.tar.gz/sha512/5cd219e6b898fda465b0af6367be575d289d6b574e8ed12172f506176baea36192fcf054e03cbf9693be5df525ff61a3115b62360bdc7a9e94c36d26d034c6f0/vendor-1.9.0.tar.gz
    sha256: 0633054065bcc0c841a3949bea552bbe5e719537c9c931b311c75e36eaba325e
    filename: cosmic-randr-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-randr/raw/f61c017f4ee1ee465d3c8b6292f9e2c609126e68/f/vendor-config-1.9.0.toml
    sha256: b99c1e67392c1239d6fc64c46cd6adfbda2ea49bf9376fb1b8dfc2dbfbb09383
    filename: cosmic-randr-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: 6e8e795970fa06d434af22775e415b517f7552d3
    VERGEN_GIT_COMMIT_DATE: "2026-02-13 12:35:27 -0700"
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    # wayland-dev resolves the right -dev name per target (#197); the rust
    # capability already carries cargo.
    capabilities: [rust, wayland-dev]
    targets:
      el10: [lld, just]
      ubuntu: [lld, just]
      debian: [lld, just]
files:
  common: [usr/bin/cosmic-randr]
install:
  commands: ["just rootdir={destdir} prefix=/usr install"]
verify:
  smoke: cosmic-randr --help
targets: [el10, ubuntu, debian]
