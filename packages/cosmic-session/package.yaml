schema: 1
name: cosmic-session
version: "1.9.0"
release: 1
summary: Session manager for the COSMIC desktop environment
description: >-
  COSMIC session manager and session target for the TunaOS Hummingbird desktop.
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/cosmic-session/archive/epoch-1.9.0.tar.gz
  sha256: e6d093938ab59baafdccac576cb0bc1a1966c825a5fedf9cb498061d8099ed57
  directory: cosmic-session-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-session/vendor-1.9.0.tar.gz/sha512/a00784bb78f18976d80b9da51cb0510629892bb77039c6989eef836981aad254af66ff5455c035f578e73023a6ca21ea5516de9581e9619cc19fae9502a4dc41/vendor-1.9.0.tar.gz
    sha256: 5a786a97ddf0c32183c431ddb78cb8310da72ee0b58baa1ef6508e31d0d99b57
    filename: cosmic-session-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-session/raw/011904fd07cc5fc4e58d000ce6867f6a2648274e/f/vendor-config-1.9.0.toml
    sha256: 559de0e88875d8b7d383467edb7bb381247f52701c801ee680995499e258a808
    filename: cosmic-session-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: 1e4f10b5821982688e4a8a39f819be0bc2ad3e74
    VERGEN_GIT_COMMIT_DATE: "2026-09-23 13:41:35 -0400"
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    capabilities: [rust]
    targets:
      el10: [cargo, lld, just, desktop-file-utils]
      ubuntu: [cargo, lld, just, desktop-file-utils]
      debian: [cargo, lld, just, desktop-file-utils]
  runtime:
    # The deb targets stay empty on purpose: the COSMIC siblings this session
    # pulls in on el10 ship in neither the Debian nor the Ubuntu archive, and
    # the gate's clean-install repo only holds the deb built by that cell, so
    # naming cosmic-comp there renders an unsatisfiable Depends.
    targets:
      # No system-cosmic-config on EL10: it is Fedora's distro-default
      # branding ("a fedora-like experience"); TunaOS desktop defaults
      # come from the image/desktops layer instead.
      el10: [cosmic-app-library >= 1.9.0, cosmic-applets >= 1.9.0, cosmic-bg >= 1.9.0, cosmic-comp >= 1.9.0, cosmic-files >= 1.9.0, cosmic-greeter >= 1.9.0, cosmic-icon-theme >= 1.9.0, cosmic-idle >= 1.9.0, cosmic-initial-setup >= 1.9.0, cosmic-launcher >= 1.9.0, cosmic-notifications >= 1.9.0, cosmic-osd >= 1.9.0, cosmic-osk >= 1.9.0, cosmic-panel >= 1.9.0, cosmic-randr >= 1.9.0, cosmic-screenshot >= 1.9.0, cosmic-settings >= 1.9.0, cosmic-settings-daemon >= 1.9.0, cosmic-term >= 1.9.0, cosmic-workspaces >= 1.9.0, xdg-desktop-portal-cosmic >= 1.9.0, open-sans-fonts, 'font(notosansmono)', xdg-user-dirs]
      ubuntu: []
      debian: []
files:
  common:
    - usr/bin/cosmic-session
    - usr/bin/start-cosmic
    - usr/lib/systemd/user/cosmic-session.target
    - usr/share/wayland-sessions/cosmic.desktop
    - usr/share/applications/cosmic-mimeapps.list
    - usr/share/dconf/profile/cosmic
install:
  commands:
    - just rootdir={destdir} install
  generated_files:
    - destination: usr/share/dconf/profile/cosmic
      content: "user-db:user\nsystem-db:local\n"
verify:
  smoke: "test -x /usr/bin/cosmic-session && test -x /usr/bin/start-cosmic && test -f /usr/share/wayland-sessions/cosmic.desktop"
targets: [el10, ubuntu, debian]
