schema: 1
name: cosmic-settings-daemon
version: "1.9.0"
release: 1
summary: Settings daemon for the COSMIC desktop environment
description: >-
  COSMIC settings daemon, system actions, and policy integration for the
  TunaOS Hummingbird desktop.
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/cosmic-settings-daemon/archive/epoch-1.9.0.tar.gz
  sha256: 69e34f67c1ae727a75b9a75e7901738adf2779ca1024f53d280d474d1af9ff6c
  directory: cosmic-settings-daemon-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-settings-daemon/vendor-1.9.0.tar.gz/sha512/46d69a18c4abf64ed78f1c6d840f120e0a9fb2a28deda7238133bfcf1106c61209ee5ec9c21098fe2a23cf39ff1428d71296f1ff74b22f9405c1c43aeb61c4ba/vendor-1.9.0.tar.gz
    sha256: 78f9d0b36807e55f42ada8cf1a118b32390255abd2821ecb52e1f3b027b37000
    filename: cosmic-settings-daemon-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-settings-daemon/raw/9b8eca1c919a0d14f51203ff7d8e2f795e4b1376/f/vendor-config-1.9.0.toml
    sha256: 8e2c27d504d55e03a6942b0b5a01421d2d141a249295b7c3465f5c943e334a1d
    filename: cosmic-settings-daemon-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
  - url: https://src.fedoraproject.org/rpms/cosmic-settings-daemon/raw/9af1c226ffc782f990f2effa1bed918ee5aad841/f/sound-theme-freedesktop.patch
    sha256: b54c4c40815770b329f6128ed556b3279d1e2346ad64b53d2e020851ef65c0ee
    filename: cosmic-settings-daemon-sound-theme.patch
    destination: patches/sound-theme-freedesktop.patch
    extract: false
build_system: custom
build:
  prepare: [patch -p1 < patches/sound-theme-freedesktop.patch]
  environment:
    VERGEN_GIT_SHA: f97bee648c579b5fe2f2000bf3d129f1a7b08f17
    VERGEN_GIT_COMMIT_DATE: "2026-09-23 21:33:28 +0200"
  commands: [cargo build --release --offline --frozen --bin cosmic-settings-daemon]
dependencies:
  build:
    capabilities: [rust, pam-dev]
    targets:
      # The deb Build-Depends list `make` explicitly: unlike the el10 mock
      # buildroot (which carries it), a minimal deb buildroot only installs
      # what the control file names (same lesson as cosmic-comp, run
      # 30701973171).
      el10: [cargo, lld, just, patch, systemd-devel, libudev-devel, libinput-devel, wayland-devel, clang-devel, libxkbcommon-devel, pulseaudio-utils, pipewire-devel, openssl-devel]
      alma10: [cargo, lld, just, patch, systemd-devel, libudev-devel, libinput-devel, wayland-devel, clang-devel, libxkbcommon-devel, pulseaudio-utils, pipewire-devel, openssl-devel]
      alma10-kitten: [cargo, lld, just, patch, systemd-devel, libudev-devel, libinput-devel, wayland-devel, clang-devel, libxkbcommon-devel, pulseaudio-utils, pipewire-devel, openssl-devel]
      ubuntu: [cargo, lld, just, make, patch, libsystemd-dev, libudev-dev, libinput-dev, libwayland-dev, clang, libxkbcommon-dev, pulseaudio-utils, libpipewire-0.3-dev, libssl-dev]
      debian: [cargo, lld, just, make, patch, libsystemd-dev, libudev-dev, libinput-dev, libwayland-dev, clang, libxkbcommon-dev, pulseaudio-utils, libpipewire-0.3-dev, libssl-dev]
  runtime:
    targets:
      # adw-gtk3-theme has no provider on any target (#169): EPEL 10 does
      # not ship it and the phase-0 wave proved it unresolvable in the
      # clean-install verify, so el10 drops it like the deb targets do.
      # Re-add if the theme is ever packaged (it is cosmetic only).
      el10: [acpid, sound-theme-freedesktop]
      alma10: [acpid, sound-theme-freedesktop]
      alma10-kitten: [acpid, sound-theme-freedesktop]
      ubuntu: [acpid, sound-theme-freedesktop]
      debian: [acpid, sound-theme-freedesktop]
files:
  common:
    - usr/bin/cosmic-settings-daemon
    - usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/system_actions
    - usr/share/polkit-1/rules.d/cosmic-settings-daemon.rules
install:
  commands: ["make install DESTDIR={destdir} prefix=/usr"]
verify:
  smoke: "test -x /usr/bin/cosmic-settings-daemon && test -f /usr/share/polkit-1/rules.d/cosmic-settings-daemon.rules"
targets: [el10, ubuntu, debian, alma10, alma10-kitten]
