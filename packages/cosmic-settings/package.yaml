schema: 1
name: cosmic-settings
version: "1.9.0"
release: 1
summary: Settings app for the COSMIC desktop environment
description: COSMIC settings application and desktop preferences integration.
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/cosmic-settings/archive/epoch-1.9.0.tar.gz
  sha256: 1e33fec9dc70408a85eca4055dca16afa82baadc2edb957e1400294b09f2ff27
  directory: cosmic-settings-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-settings/vendor-1.9.0.tar.gz/sha512/e076aa443d2e172552325f4a99c9164d14975b1dfd72ceaecb8abf5479b6f6c2b2bbf0cee0fd34683ae8169ab1ee05adeac3007a9ff07f61622e4f2d346e888e/vendor-1.9.0.tar.gz
    sha256: 63612a7f15470c9d5eb1e457af8818b6db6f510ab971115081ce494ab0c660bc
    filename: cosmic-settings-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-settings/raw/4d83340a6dc9f486dff31b020630ffce132c4cf7/f/vendor-config-1.9.0.toml
    sha256: 83b6a7f9f0b5e6ab29f8bc630da2f09b8c8c02398cf53be4c847dfb3cda93f90
    filename: cosmic-settings-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment_by_target:
    alma10:
      PATH: /opt/tunaos/rust-1.93/bin:/usr/bin:/bin
    alma10-kitten:
      PATH: /opt/tunaos/rust-1.93/bin:/usr/bin:/bin
  environment:
    VERGEN_GIT_SHA: 7421ff0ab482c942eef23fbe9280edacfbeb35cc
    VERGEN_GIT_COMMIT_DATE: "2026-09-22 14:38:57 -0600"
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    capabilities: [rust]
    targets:
      el10: [cargo, lld, just, libinput-devel, wayland-devel, libxkbcommon-devel, systemd-devel, desktop-file-utils, pipewire-devel, clang, libdav1d-devel]
      alma10: [tunaos-rust193 >= 1.93.0, cargo, lld, just, libinput-devel, wayland-devel, libxkbcommon-devel, systemd-devel, desktop-file-utils, pipewire-devel, clang, libdav1d-devel]
      alma10-kitten: [tunaos-rust193 >= 1.93.0, cargo, lld, just, libinput-devel, wayland-devel, libxkbcommon-devel, systemd-devel, desktop-file-utils, pipewire-devel, clang, libdav1d-devel]
      ubuntu: [cargo, lld, just, libinput-dev, libwayland-dev, libxkbcommon-dev, libsystemd-dev, desktop-file-utils, libpipewire-0.3-dev, clang, libdav1d-dev]
      debian: [cargo, lld, just, libinput-dev, libwayland-dev, libxkbcommon-dev, libsystemd-dev, desktop-file-utils, libpipewire-0.3-dev, clang, libdav1d-dev]
  runtime:
    targets:
      el10: [cosmic-icon-theme >= 1.9.0, nm-connection-editor, accountsservice, cosmic-settings-daemon >= 1.9.0, cosmic-randr >= 1.9.0, gettext, iso-codes, NetworkManager, ppd-service]
      alma10: [cosmic-icon-theme >= 1.9.0, nm-connection-editor, accountsservice, cosmic-settings-daemon >= 1.9.0, cosmic-randr >= 1.9.0, gettext, iso-codes, NetworkManager, ppd-service]
      alma10-kitten: [cosmic-icon-theme >= 1.9.0, nm-connection-editor, accountsservice, cosmic-settings-daemon >= 1.9.0, cosmic-randr >= 1.9.0, gettext, iso-codes, NetworkManager, ppd-service]
      # cosmic-icon-theme is dropped on the deb targets on purpose: it ships in
      # neither the Debian nor the Ubuntu archive, and the gate's clean-install
      # repo only holds the deb built by that cell, so naming it renders an
      # unsatisfiable Depends. The rest are stock archive packages.
      ubuntu: [accountsservice, gettext, iso-codes]
      debian: [accountsservice, gettext, iso-codes]
files:
  common:
    - usr/bin/cosmic-settings
    - usr/share/applications/com.system76.CosmicSettings*.desktop
    - usr/share/metainfo/com.system76.CosmicSettings.metainfo.xml
    - usr/share/cosmic/com.system76.*
    - usr/share/icons/hicolor/*/apps/com.system76.CosmicSettings.svg
    - usr/share/icons/hicolor/scalable/status/illustration-*.svg
    - usr/share/polkit-1/rules.d/cosmic-settings.rules
    - usr/share/polkit-1/actions/com.system76.CosmicSettings.Users.policy
install:
  commands: ["just rootdir={destdir} install"]
verify:
  smoke: "test -x /usr/bin/cosmic-settings && test -f /usr/share/polkit-1/rules.d/cosmic-settings.rules"
targets: [el10, ubuntu, debian, alma10, alma10-kitten]
