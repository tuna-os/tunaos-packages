  directory: cosmic-workspaces-epoch-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-workspaces/vendor-1.9.0.tar.gz/sha512/0a0ff3803019ad40cfda332f3060275b5798fa0f0c04c70703ae209c233978f9dbdc9b5bca6c1040b9e8be29b2acdfaef828d6700f9d273044388e9fc32ef813/vendor-1.9.0.tar.gz
    sha256: d3424c351a36ed84b68df0c2cf5fce4ff4c7ab3bb5aa85473dba877dca10c9d8
    filename: cosmic-workspaces-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-workspaces/raw/31e3338f0e0d83267a8898941881425502f4a9d6/f/vendor-config-1.9.0.toml
