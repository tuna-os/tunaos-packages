      - libxkbcommon-dev
      - libinput-dev
      - gbm-dev
    targets:
      el10:
        - cargo
        - lld
        - just
        - systemd-devel
        - libglvnd-devel
        - libseat-devel
        - make
      alma10:
        - cargo
        - lld
        - just
        - systemd-devel
        - libglvnd-devel
        - libseat-devel
        - make
      alma10-kitten:
        - cargo
        - lld
        - just
        - systemd-devel
        - libglvnd-devel
        - libseat-devel
        - make
      ubuntu:
        - cargo
        - lld
        - just
        - libsystemd-dev
        - libegl1-mesa-dev
        - libseat-dev
        - make
      debian:
        - cargo
        - lld
        - just
        - libsystemd-dev
        - libegl1-mesa-dev
        - libseat-dev
        - make
  runtime:
    targets:
      el10:
        - cosmic-comp >= 1.9.0
        - cosmic-icon-theme >= 1.9.0
      alma10:
        - cosmic-comp >= 1.9.0
        - cosmic-icon-theme >= 1.9.0
      alma10-kitten:
        - cosmic-comp >= 1.9.0
        - cosmic-icon-theme >= 1.9.0
      ubuntu: []
      debian: []
files:
  common:
    - usr/bin/cosmic-workspaces
    - usr/share/applications/com.system76.CosmicWorkspaces.desktop
    - usr/share/icons/hicolor/scalable/apps/com.system76.CosmicWorkspaces.svg
install:
  commands:
    - make install DESTDIR={destdir} prefix=/usr
verify:
  smoke: test -x /usr/bin/cosmic-workspaces
targets:
  - el10
  - alma10
  - alma10-kitten
  - ubuntu
  - debian
