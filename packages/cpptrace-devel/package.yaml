schema: 1
name: cpptrace-devel
version: "1.0.4"
release: 1
summary: C++ stacktrace library development files
description: C++ stacktrace library built with Tideforge libunwind for Quickshell crash handling.
license: MIT
source:
  url: https://github.com/jeremy-rifkin/cpptrace/archive/refs/tags/v1.0.4.tar.gz
  sha256: 5c9f5b301e903714a4d01f1057b9543fa540f7bfcc5e3f8bd1748e652e24f9ea
  directory: cpptrace-1.0.4
build_system: cmake
build:
  cmake_options: [-DCPPTRACE_BUILD_SHARED=ON, -DCPPTRACE_GET_SYMBOLS_WITH_ADDR2LINE=ON, -DCPPTRACE_UNWIND_WITH_LIBUNWIND=ON]
dependencies:
  build:
    # Toolchain deps are per-target: a common list with gcc-c++ would leak
    # into Arch where the C++ compiler is part of gcc, not a separate package.
    targets:
      el10: [cmake, gcc-c++, libunwind-devel]
      ubuntu: [cmake, g++, libunwind-dev]
      debian: [cmake, g++, libunwind-dev]
      opensuse-tumbleweed: [cmake, gcc-c++, libunwind-devel]
      arch: [cmake, gcc, libunwind]
  # Arch only. cpptrace links libunwind.so.8 (-DCPPTRACE_UNWIND_WITH_LIBUNWIND=ON
  # puts `-lunwind` on the link line), and every other format derives that
  # automatically: rpmbuild generates Requires from ELF sonames and
  # dpkg-shlibdeps fills ${shlibs:Depends}. makepkg does NEITHER -- it only
  # warns -- so the Arch package installed cleanly and shipped a library
  # nothing could load. assert-arch-runtime-closure caught it:
  #
  #   unresolved libraries in /usr/lib/libcpptrace.so.1
  #       libunwind.so.8 => not found
  #    -> cpptrace-devel's recipe under-declares its runtime depends.
  #
  # (run 32566033598, tideforge-cpptrace-devel-arch-x86_64.) Same shape as
  # quickshell's arch runtime block, and the same reason it is arch-only.
  runtime:
    targets:
      arch: [libunwind]
files:
  common: [usr/include/cpptrace, usr/include/ctrace]
outputs:
  rpm:
    files: [usr/include/cpptrace, usr/include/ctrace, usr/lib64/libcpptrace.so*, usr/lib64/cmake/cpptrace]
  deb:
    packages:
      - name: libcpptrace-dev
        summary: C++ stacktrace library development files
        description: C++ stacktrace library built with libunwind.
        files: [usr/include/cpptrace, usr/include/ctrace, usr/lib/*/libcpptrace.so*, usr/lib/*/cmake/cpptrace]
verify:
  # The deb outputs are named libcpptrace-dev, not cpptrace-devel — Debian
  # spells a headers package that way, and outputs.deb.packages above says so.
  # Without this the verify installs the RECIPE name and the cell dies after a
  # clean build:
  #
  #   dpkg-scanpackages: warning:   libcpptrace-dev     <- what was built
  #   E: Unable to locate package cpptrace-devel        <- what verify asked for
  #
  # (run 32550564218, all four deb cells.) Same shape as the xfconf precedent
  # in tideforge.verify_metadata: xfconf on el10, libxfconf-0-4 on deb.
  targets:
    ubuntu:
      install_name: libcpptrace-dev
    debian:
      install_name: libcpptrace-dev
  # The ldconfig assertion is the el10 gate job's long-standing third check:
  # headers existing proves nothing about the shared library actually being
  # installed and registered. Recorded here so the recipe carries the gate's
  # full contract instead of a weaker one a switchover would silently adopt.
  smoke: "test -f /usr/include/cpptrace/cpptrace.hpp && test -f /usr/include/ctrace/ctrace.h && ldconfig -p | grep -F libcpptrace.so.1"
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch]
