schema: 1
name: dms
version: "1.5.2"
release: 1
summary: DankMaterialShell QML desktop shell
description: QML desktop shell payload for TunaOS Niri sessions, installed for use by Quickshell.
license: GPL-3.0-or-later
source:
  url: https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.2/dms-qml.tar.gz
  sha256: a504d4684aed1fde07bc3cad3ea1ba417331bfd43cb97420133082ae70da1478
  directory: .
build_system: data
dependencies:
  runtime:
    common: [quickshell]
files:
  common: [usr/share/dankmaterialshell, usr/lib/sysusers.d/dms-greeter.conf, usr/lib/tmpfiles.d/dms-greeter.conf]
install:
  directories:
    - {source: ., destination: usr/share/dankmaterialshell}
  files:
    - {source: systemd/sysusers-dms-greeter.conf, destination: usr/lib/sysusers.d/dms-greeter.conf}
    - {source: systemd/tmpfiles-dms-greeter.conf, destination: usr/lib/tmpfiles.d/dms-greeter.conf}
verify:
  smoke: "test -d /usr/share/dankmaterialshell"
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch, alma10, alma10-kitten]
