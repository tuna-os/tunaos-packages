schema: 1
name: greetd
version: "0.10.3"
release: 1
summary: Minimal and flexible login manager daemon
description: >-
  Minimal login manager daemon used by TunaOS Niri and other greetd-backed
  desktop sessions. Configuration and PAM policy remain image-owned.
license: GPL-3.0-only
source:
  url: https://git.sr.ht/~kennylevinsen/greetd/archive/0.10.3.tar.gz
  sha256: ee5cb70e0add4ca9c9fe57e47581ab0002d44c07743fb5492469f3b570db640b
  directory: greetd-0.10.3
build_system: cargo
build:
  cargo_package: greetd
  binary: greetd
dependencies:
  build:
    capabilities: [rust, pam-dev]
  runtime:
    # greetd links libpam and libsystemd.  RPM and DEB tooling derive these
    # from the ELF headers; makepkg does not, so every linked library must
    # be hand-declared here (#118).
    targets:
      arch: [pam, systemd-libs, libgcc, audit, libcap-ng]
files:
  common:
    - usr/bin/greetd
    - usr/lib/systemd/system/greetd.service
install:
  files:
    - {source: greetd.service, destination: usr/lib/systemd/system/greetd.service}
verify:
  smoke: greetd --help
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch, alma10, alma10-kitten]
