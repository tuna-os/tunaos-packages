schema: 1
name: gtk4-layer-shell
version: "1.3.0"
release: 1
summary: GTK4 Wayland layer shell and session lock library
description: >-
  Native GTK4 implementation of the Wayland layer-shell and ext-session-lock
  protocols for Tuna Desktop. This is distinct from the GTK3 gtk-layer-shell
  library. The runtime includes both public APIs and introspection typelibs;
  the development package supplies headers, pkg-config, GIR and Vala bindings.
license: MIT
# Official v1.3.0 tag commit: 1c963c51514581c41b9bdae08cdf69171265cdda.
# Released 2025-10-29; includes the upstream session-lock failure UAF fix.
# Release tags can move: the archive SHA256 binds the admitted source bytes.
source:
  url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
  sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192
  directory: gtk4-layer-shell-1.3.0
# The generic Meson renderer does not run upstream tests in RPM builds.
# Custom commands retain native RPM flags and require the upstream mock
# Wayland layer/lock tests; none use the user's compositor or real DRM.
build_system: custom
build:
  commands:
    - "%{set_build_flags}"
    - >-
      test -r "$(pkg-config --variable=pkgdatadir wayland-protocols)/staging/ext-session-lock/ext-session-lock-v1.xml"
    - >-
      meson setup build --prefix=/usr --libdir=lib64 --buildtype=plain
      -Dtests=true -Dsmoke-tests=false -Dexamples=false -Ddocs=false
      -Dintrospection=true -Dvapi=true
    - meson compile -C build
    - >-
      meson introspect --tests build | python3 -c
      'import json,sys; names={t["name"] for t in json.load(sys.stdin)};
      assert any(n.startswith("layer-") for n in names), "layer tests missing";
      assert any(n.startswith("lock-") for n in names), "lock tests missing";
      assert "unit-test-get-version" in names, "version test missing";
      print("GTK4 provider admitted tests:", len(names))'
    - GDK_BACKEND=wayland GSK_RENDERER=cairo meson test -C build --no-rebuild --print-errorlogs
dependencies:
  build:
    common:
      - gcc
      - meson >= 0.54
      - ninja-build
      - pkgconf-pkg-config
      - redhat-rpm-config
      - python3
      - pkgconfig(gtk4) >= 4.12
      - pkgconfig(wayland-client) >= 1.10
      - pkgconfig(wayland-server) >= 1.10
      - wayland-devel
      - wayland-protocols-devel
      - gobject-introspection-devel
      - vala
    # Alma native cells remain unactivated until the real factory definitions
    # are reviewed/qualified (PR819). Do not alias either to CentOS Stream.
    targets:
      el10: []
      alma10: []
      alma10-kitten: []
install:
  commands:
    - DESTDIR={destdir} meson install -C build --no-rebuild
  files:
    - {source: LICENSE, destination: usr/share/licenses/gtk4-layer-shell/LICENSE}
files:
  common:
    - usr/lib64/libgtk4-layer-shell.so.*
    - usr/lib64/liblayer-shell-preload.so
    - usr/lib64/girepository-1.0/Gtk4LayerShell-1.0.typelib
    - usr/lib64/girepository-1.0/Gtk4SessionLock-1.0.typelib
    - usr/share/licenses/gtk4-layer-shell/LICENSE
outputs:
  rpm:
    files:
      - usr/lib64/libgtk4-layer-shell.so.*
      - usr/lib64/liblayer-shell-preload.so
      - usr/lib64/girepository-1.0/Gtk4LayerShell-1.0.typelib
      - usr/lib64/girepository-1.0/Gtk4SessionLock-1.0.typelib
      - usr/share/licenses/gtk4-layer-shell/LICENSE
    subpackages:
      - name: devel
        summary: Development files for GTK4 layer shell and session lock
        description: Both public headers, pkg-config metadata, GIR and Vala bindings.
        requires: ["%{name}%{?_isa} = %{version}-%{release}"]
        files:
          - usr/include/gtk4-layer-shell/gtk4-layer-shell.h
          - usr/include/gtk4-layer-shell/gtk4-session-lock.h
          - usr/lib64/libgtk4-layer-shell.so
          - usr/lib64/pkgconfig/gtk4-layer-shell-0.pc
          - usr/share/gir-1.0/Gtk4LayerShell-1.0.gir
          - usr/share/gir-1.0/Gtk4SessionLock-1.0.gir
          - usr/share/vala/vapi/gtk4-layer-shell-0.deps
          - usr/share/vala/vapi/gtk4-layer-shell-0.vapi
verify:
  install_name: gtk4-layer-shell-devel
  smoke: >-
    pkg-config --atleast-version=1.1 gtk4-layer-shell-0
    && test "$(pkg-config --modversion gtk4-layer-shell-0)" = 1.3.0
    && test -r /usr/include/gtk4-layer-shell/gtk4-layer-shell.h
    && test -r /usr/include/gtk4-layer-shell/gtk4-session-lock.h
    && test -r /usr/lib64/girepository-1.0/Gtk4LayerShell-1.0.typelib
    && test -r /usr/lib64/girepository-1.0/Gtk4SessionLock-1.0.typelib
    && test -r /usr/share/licenses/gtk4-layer-shell/LICENSE
    && python3 -c
    'import ctypes; lib=ctypes.CDLL("libgtk4-layer-shell.so.0");
    version=tuple(getattr(lib,"gtk_layer_get_"+part+"_version")() for part in ("major","minor","micro"));
    assert version==(1,3,0),version;
    symbols=("gtk_layer_init_for_window","gtk_layer_set_keyboard_mode","gtk_layer_set_namespace",
    "gtk_session_lock_instance_new","gtk_session_lock_instance_lock","gtk_session_lock_instance_unlock",
    "gtk_session_lock_instance_assign_window_to_monitor","gtk_session_lock_instance_is_locked");
    [getattr(lib,symbol) for symbol in symbols]'
# No target declaration for absent Alma factory roots on current main.
targets: [el10]
