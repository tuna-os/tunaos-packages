schema: 1
name: ninja-build
version: "1.13.2"
release: 1
summary: Small build system with a focus on speed
description: Ninja build tool used to build Qt/CMake projects whose generated-source dependencies are not supported by Makefiles on EL10.
license: Apache-2.0
source:
  url: https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz
  sha256: 974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17
  directory: ninja-1.13.2
build_system: cmake
build:
  debug_package: false
  cmake_options: [-DBUILD_TESTING=OFF]
dependencies:
  build:
    # No common list: it held RPM names (gcc-c++) that leaked into the deb
    # Build-Depends, where no such package exists. Each target already names
    # its own complete toolchain.
    targets:
      el10: [cmake, gcc-c++]
      alma10: [cmake, gcc-c++]
      alma10-kitten: [cmake, gcc-c++]
      ubuntu: [cmake, g++]
      debian: [cmake, g++]
      opensuse-tumbleweed: [cmake, gcc-c++]
      arch: [cmake, gcc]
  runtime:
    targets:
      arch: [libgcc, libstdc++]
files:
  common: [usr/bin/ninja]
verify:
  smoke: ninja --version
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch, alma10, alma10-kitten]
