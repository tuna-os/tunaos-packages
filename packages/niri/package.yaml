schema: 1
name: niri
version: "26.04"
release: 1
summary: Scrollable-tiling Wayland compositor
description: Niri is a scrollable-tiling Wayland compositor maintained by the Niri community.
license: GPL-3.0-or-later
source:
  url: https://github.com/niri-wm/niri/archive/refs/tags/v26.04.tar.gz
  sha256: 134c602d8e0d53413a52d6cd58f9ce7e79a07d03288ee0a51ba1abd5db1b1ad9
  directory: niri-26.04
build_system: cargo
dependencies:
  build:
    # The rust capability renders the right toolchain name per target --
    # Debian and Ubuntu call the compiler rustc, and a literal `rust` in
    # Build-Depends is unsatisfiable there.
    capabilities: [rust]
    targets:
      el10: [gcc, clang-devel, pkgconfig, glib2-devel, cairo-devel, cairo-gobject-devel, pango-devel, pipewire-devel, libdrm-devel, mesa-libgbm-devel, libdisplay-info-devel, libxkbcommon-devel, libinput-devel, libseat-devel, wayland-protocols-devel]
      # Upstream's documented Ubuntu build dependencies (Getting-Started wiki),
      # plus debhelper-compat and pkg-config for the generated packaging. The
      # previous list had never been exercised and was missing the pango,
      # pipewire, gbm, dbus, systemd, and display-info stacks entirely.
      ubuntu: [debhelper-compat, pkg-config, clang, libudev-dev, libgbm-dev, libxkbcommon-dev, libegl1-mesa-dev, libwayland-dev, libinput-dev, libdbus-1-dev, libsystemd-dev, libseat-dev, libpipewire-0.3-dev, libpango1.0-dev, libdisplay-info-dev]
      debian: [debhelper-compat, pkg-config, clang, libudev-dev, libgbm-dev, libxkbcommon-dev, libegl1-mesa-dev, libwayland-dev, libinput-dev, libdbus-1-dev, libsystemd-dev, libseat-dev, libpipewire-0.3-dev, libpango1.0-dev, libdisplay-info-dev]
      opensuse-tumbleweed: [gcc, pkg-config, libxkbcommon-devel, libinput-devel, libseat-devel, wayland-protocols-devel]
      # Arch ships headers alongside every library package, so the -devel split
      # does not exist.  Every package whose headers are consumed at build time
      # must appear in makedepends, not only in depends — relying on depends is
      # a silent mask: makepkg --syncdeps installs both, so a build passes even
      # when the recipe under-declares, but the rendered package metadata is
      # wrong (#118).
      arch: [clang, git, pkgconf, libdrm, pipewire, wayland-protocols, seatd, glib2, cairo, pango, libxkbcommon, libinput, mesa, libdisplay-info]
  runtime:
    targets:
      el10: [libseat]
      ubuntu: [libseat1]
      debian: [libseat1]
      opensuse-tumbleweed: [libseat1]
      arch: [brotli, bzip2, cairo, expat, fontconfig, freetype2, fribidi, glib2, glibc, graphite, harfbuzz, libdatrie, libdisplay-info, libdrm, libevdev, libffi, libgcc, libgudev, libinput, libpipewire, libpng, libthai, libwacom, libx11, libxau, libxcb, libxdmcp, libxext, libxkbcommon, libxrender, lua54, mesa, mtdev, pango, pcre2, pixman, seatd, systemd-libs, util-linux-libs, xdg-desktop-portal-impl, zlib]
install:
  # These are the upstream session integration assets.  Installing only the
  # compositor binary leaves display managers and xdg-desktop-portal unable to
  # discover a Niri session.
  files:
    - {source: resources/niri-session, destination: usr/bin/niri-session, mode: "0755"}
    - {source: resources/niri.desktop, destination: usr/share/wayland-sessions/niri.desktop}
    - {source: resources/niri-portals.conf, destination: usr/share/xdg-desktop-portal/niri-portals.conf}
    - {source: resources/niri.service, destination: usr/lib/systemd/user/niri.service}
    - {source: resources/niri-shutdown.target, destination: usr/lib/systemd/user/niri-shutdown.target}
files:
  common:
    - usr/bin/niri
    - usr/bin/niri-session
    - usr/share/wayland-sessions/niri.desktop
    - usr/share/xdg-desktop-portal/niri-portals.conf
    - usr/lib/systemd/user/niri.service
    - usr/lib/systemd/user/niri-shutdown.target
verify:
  # The full session contract, which is what the el10 niri-rpm job and the
  # ubuntu and debian cells (#166) assert by hand: compositor runs, session
  # launcher, wayland-session entry, portal config, and both user units.
  # Installing only the binary leaves display managers unable to discover a
  # Niri session, which `niri --help` alone cannot catch.
  smoke: "niri --help && test -x /usr/bin/niri-session && test -f /usr/share/wayland-sessions/niri.desktop && test -f /usr/share/xdg-desktop-portal/niri-portals.conf && test -f /usr/lib/systemd/user/niri.service && test -f /usr/lib/systemd/user/niri-shutdown.target"
  targets:
    # The Arch cell asserts only that the binary runs, so it would pass with
    # every session-integration file missing -- the same way flounder:niri
    # shipped a compositor no display manager could discover. This records
    # what that cell checks today rather than pretending it checks more; raise
    # it to the full contract above when the arch gate is free
    # (it is held by #156 right now).
    arch:
      smoke: niri --help
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch]
