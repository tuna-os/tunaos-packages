schema: 1
name: oversteer-udev
version: "0.8.3+git74c7484"
release: 1
summary: Oversteer steering-wheel udev permissions
description: Udev rules granting users access to supported Logitech, Fanatec, and Thrustmaster wheels.
license: GPL-3.0-or-later
source:
  url: https://github.com/berarma/oversteer/archive/74c748436a1dff2e42a340b581db0d0e4e0cafb2.tar.gz
  sha256: 996f0a34c65ce4805360e674c04678a7612c647c54a9aad7f2c7d7d5c830c2c2
  directory: oversteer-74c748436a1dff2e42a340b581db0d0e4e0cafb2
build_system: data
files:
  common: [usr/lib/udev/rules.d]
install:
  directories:
    - {source: data/udev, destination: usr/lib/udev/rules.d}
verify:
  # Upstream names its rules by wheel vendor -- 99-fanatec-wheel-perms.rules,
  # 99-logitech-wheel-perms.rules, 99-thrustmaster-wheel-perms.rules. Nothing
  # upstream contains the string 'oversteer', so an earlier
  # `-name \*oversteer\*` could never match: the package built and installed
  # correctly and the assertion failed anyway. Assert the real filenames.
  smoke: "test -f /usr/lib/udev/rules.d/99-logitech-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-fanatec-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-thrustmaster-wheel-perms.rules"
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch, alma10, alma10-kitten]
