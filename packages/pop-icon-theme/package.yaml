schema: 1
name: pop-icon-theme
version: "3.5.0"
release: 1
summary: Pop icon theme
description: Base Pop icon theme required by the COSMIC icon theme.
license: CC-BY-SA-4.0
source:
  url: https://github.com/pop-os/icon-theme/archive/v3.5.0.tar.gz
  sha256: 917f5e300e927fe2557355717793f3284aee869a6ae0b81cd31507f20090d796
  directory: icon-theme-3.5.0
build_system: meson
build:
  # An icon theme installs only SVGs — no ELF payload — so RPM's automatic
  # debuginfo extraction generates an empty debugsourcefiles.list and rpmbuild
  # aborts with "error: Empty %files file .../debugsourcefiles.list". The
  # build_system is meson, so the renderer's go/data heuristic does not catch
  # this one; the opt-out has to be explicit.
  debug_package: false
dependencies:
  build:
    common: [meson]
  runtime:
    targets:
      el10: [gnome-icon-theme]
      alma10: [gnome-icon-theme]
      alma10-kitten: [gnome-icon-theme]
      ubuntu: [gnome-icon-theme]
      debian: [gnome-icon-theme]
files:
  common: [usr/share/icons/Pop]
verify:
  smoke: test -d /usr/share/icons/Pop
targets: [el10, ubuntu, debian, alma10, alma10-kitten]
