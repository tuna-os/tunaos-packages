schema: 1
name: pop-launcher
version: "1.10.0"
release: 1
summary: Launcher backend for the COSMIC Desktop Environment
description: Launcher backend for the COSMIC Desktop Environment for TunaOS. Required by cosmic-launcher on every arch (the COPR only ships x86_64).
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/launcher/archive/epoch-1.10.0.tar.gz
  sha256: fbad44078bbebec9e2bc5f03d31a04a08191a877d7d524cf9e34f364e75c2429
  directory: launcher-epoch-1.10.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/pop-launcher/vendor-1.10.0.tar.gz/sha512/b6544a4b144089a22f9d822a3b857528e8eef22c5daf8166f653b2c48ad30a3c6270a9c34579a2c7b8d37d0b11797e0b25c497cffd5b19c66325cdd9f024a871/vendor-1.10.0.tar.gz
    sha256: 0b5cd9f95cca92a521391c3ce3b1bfbd3f20a18f1370e40e4bedde6a77394e9b
    filename: pop-launcher-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/pop-launcher/raw/e16b28f3fd8b34dabd106e730c3093d626b8888d/f/vendor-config-1.10.0.toml
    sha256: 8f2f940c572d7aa6240cd66da39c7a5127b88c3f49256142455e84e85f0fafeb
    filename: pop-launcher-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: 8a09fa50a9fbbe66a97afe3865b5e61dd1d0432c
    VERGEN_GIT_COMMIT_DATE: "2026-09-30 09:56:55 -0600"
  commands:
    - cargo build --release --offline --frozen
dependencies:
  build:
    capabilities:
      - rust
      - libxkbcommon-dev
    targets:
      el10:
        - cargo
        - lld
        - just
        - libglvnd-devel
        - libudev-devel
      ubuntu:
        - cargo
        - lld
        - just
        - libegl1-mesa-dev
        - libudev-dev
      debian:
        - cargo
        - lld
        - just
        - libegl1-mesa-dev
        - libudev-dev
  runtime:
    targets:
      el10:
        - qalculate
        - fd-find
      ubuntu: []
      debian: []
files:
  common:
    - usr/bin/pop-launcher
    - usr/libexec/pop-launcher
install:
  commands:
    - just rootdir={destdir} lib-path=libexec install
verify:
  smoke: test -x /usr/bin/pop-launcher
targets:
  - el10
  - ubuntu
  - debian
