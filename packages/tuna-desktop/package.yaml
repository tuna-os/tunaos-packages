schema: 1
name: tuna-desktop
# The upstream release tag minus its v, with a prerelease's `-` written `~`
# (tag v1.2.3-beta.4 -> 1.2.3~beta.4). RPM and Debian take this form as-is and
# sort it before the final release; Tideforge renders pacman's pkgver without
# the `~` (1.2.3beta.4), the value upstream's packaging/arch/PKGBUILD derives.
version: "1.0.0~beta.1"
release: 1
summary: "Tuna Desktop: GNOME-style Wayland desktop session in Rust (nested developer preview)"
description: >-
  Tuna Desktop (formerly Roost) is a Smithay-based Wayland desktop that aims
  at GNOME 51 parity: a supervised compositor with a GNOME-style GTK shell,
  optional scrollable tiling, an IBus bridge, and a greetd greeter. This
  package ships the six session binaries, the wayland-sessions entry, the
  lock-screen PAM service and the session target, plus one release of
  compatibility with the former `roost` name, mirroring upstream's own
  packaging/arch/PKGBUILD. Built for TunaOS Marlin (tuna-os/tuna-desktop#69,
  renamed in tuna-os/tuna-desktop#536).
license: GPL-3.0-or-later
# The package's former name (tuna-os/tuna-desktop#505). Upstream's PKGBUILD
# also declares replaces=('roost') and conflicts=('roost'); the recipe schema
# models only `provides`, so those two are not rendered yet (see the PR that
# added this recipe for the proposed schema change).
provides: [roost]
# Upstream release tag. Bump `version`, source, the vendor asset below,
# TUNA_VERSION and the verify smoke's want= together, and reset `release`,
# with scripts/prepare-tuna-desktop-release.py
# (docs/packaging/tuna-desktop-release.md).
source:
  url: https://github.com/tuna-os/tuna-desktop/archive/refs/tags/v1.0.0-beta.1.tar.gz
  sha256: "c346c0861da4894fd490a3681a039955a90c0a7aeb04b458a1170fa87a6e1ad2"
  directory: tuna-desktop-1.0.0-beta.1
# Vendored crates.io closure (`cargo vendor --locked --versioned-dirs` from the
# exact tag above, deterministic tar, verified with `cargo metadata
# --locked --offline`), shipped as an immutable release asset like xfwl4 so
# the build never fetches crates. Cargo.lock has no git dependencies
# (third-party/ crates are in-tree path dependencies), so the config needs
# only the crates-io replacement.
sources:
  - url: https://github.com/tuna-os/tunaos-packages/releases/download/tuna-desktop-vendor-v1.0.0-beta.1/tuna-desktop-vendor.tar.gz
    sha256: "2ab462cb46fdfd6122c2627ddc2790595690db9c87b5c83d951c2b269a9e62d4"
    filename: tuna-desktop-vendor.tar.gz
    destination: .
    strip_components: 0
# custom, not cargo: the cargo renderer builds and installs one binary, and
# the session is six binaries from four workspace crates (tuna-session ships
# in tuna-compositor, tuna-ibus-bridge in tuna-shell-host).
build_system: custom
build:
  environment:
    # Every binary reports this (minus the leading v) from --version: the
    # upstream tag, exactly as upstream's PKGBUILD stamps v${_semver}. It is
    # `version` above with `~` written as the tag's `-`.
    # Read at compile time; the old ROOST_VERSION is no longer consulted.
    TUNA_VERSION: v1.0.0-beta.1
  cargo_config: |
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "vendor"

    [net]
    offline = true
  commands:
    # makepkg builds with LTO on; the pipewire crate compiles C through cc
    # (libspa-sys), whose thin-LTO bitcode loses its symbols at the Rust link.
    # Fat LTO objects keep real code beside the bitcode -- the same flag the
    # cargo renderer applies for niri. Upstream's PKGBUILD sets !lto instead,
    # which the recipe schema cannot express.
    - export CFLAGS="${CFLAGS:-} -ffat-lto-objects"
    # The ELN builder is a bootc image: /root links to a missing
    # /var/roothome, so cargo cannot create ~/.cargo. Keep its home in the
    # build tree on every target.
    - export CARGO_HOME="$PWD/.cargo-home"
    - cargo build --release --locked --offline -p tuna-compositor -p tuna-shell-host -p tuna-shell-gtk -p tuna-greeter
dependencies:
  build:
    capabilities: [rust, c-compiler, pkg-config]
    targets:
      # Arch ships headers in the library packages; every one consumed at
      # build time is listed here, not only in depends (#118). clang is for
      # bindgen (pipewire/libspa, xkbcommon-adjacent sys crates).
      arch: [clang, dbus, glib2, gtk4, gtk4-layer-shell, libadwaita, libdrm, libinput, libsecret, libxkbcommon, libxkbcommon-x11, mesa, pipewire, seatd, systemd-libs, wayland]
      # The same Arch list as pkg-config names, which resolve identically on
      # Fedora 44, Rawhide, ELN and EL10 (mesa -> gbm + egl, seatd -> libseat,
      # systemd-libs -> libsystemd + libudev, wayland -> client + server).
      # clang-devel supplies libclang for bindgen. The floors: GTK 4.12,
      # gtk4-layer-shell 1.1 (gtk4-session-lock-sys v1_1) and Rust 1.92, the
      # rollout's build floor (no crate declares an MSRV, so cargo cannot
      # enforce it). On el10, gtk4-layer-shell-devel
      # and libseat-devel are factory products (packages/gtk4-layer-shell,
      # packages/libseat) resolved from the target's published_index.
      fedora: [clang-devel, rust >= 1.92, "pkgconfig(dbus-1)", "pkgconfig(glib-2.0)", "pkgconfig(gtk4) >= 4.12", "pkgconfig(gtk4-layer-shell-0) >= 1.1", "pkgconfig(libadwaita-1)", "pkgconfig(libdrm)", "pkgconfig(libinput)", "pkgconfig(libsecret-1)", "pkgconfig(xkbcommon)", "pkgconfig(xkbcommon-x11)", "pkgconfig(gbm)", "pkgconfig(egl)", "pkgconfig(libpipewire-0.3)", "pkgconfig(libseat)", "pkgconfig(libsystemd)", "pkgconfig(libudev)", "pkgconfig(wayland-client)", "pkgconfig(wayland-server)"]
      rawhide: [clang-devel, rust >= 1.92, "pkgconfig(dbus-1)", "pkgconfig(glib-2.0)", "pkgconfig(gtk4) >= 4.12", "pkgconfig(gtk4-layer-shell-0) >= 1.1", "pkgconfig(libadwaita-1)", "pkgconfig(libdrm)", "pkgconfig(libinput)", "pkgconfig(libsecret-1)", "pkgconfig(xkbcommon)", "pkgconfig(xkbcommon-x11)", "pkgconfig(gbm)", "pkgconfig(egl)", "pkgconfig(libpipewire-0.3)", "pkgconfig(libseat)", "pkgconfig(libsystemd)", "pkgconfig(libudev)", "pkgconfig(wayland-client)", "pkgconfig(wayland-server)"]
      eln: [clang-devel, rust >= 1.92, "pkgconfig(dbus-1)", "pkgconfig(glib-2.0)", "pkgconfig(gtk4) >= 4.12", "pkgconfig(gtk4-layer-shell-0) >= 1.1", "pkgconfig(libadwaita-1)", "pkgconfig(libdrm)", "pkgconfig(libinput)", "pkgconfig(libsecret-1)", "pkgconfig(xkbcommon)", "pkgconfig(xkbcommon-x11)", "pkgconfig(gbm)", "pkgconfig(egl)", "pkgconfig(libpipewire-0.3)", "pkgconfig(libseat)", "pkgconfig(libsystemd)", "pkgconfig(libudev)", "pkgconfig(wayland-client)", "pkgconfig(wayland-server)"]
      el10: [clang-devel, rust >= 1.92, "pkgconfig(dbus-1)", "pkgconfig(glib-2.0)", "pkgconfig(gtk4) >= 4.12", "pkgconfig(gtk4-layer-shell-0) >= 1.1", "pkgconfig(libadwaita-1)", "pkgconfig(libdrm)", "pkgconfig(libinput)", "pkgconfig(libsecret-1)", "pkgconfig(xkbcommon)", "pkgconfig(xkbcommon-x11)", "pkgconfig(gbm)", "pkgconfig(egl)", "pkgconfig(libpipewire-0.3)", "pkgconfig(libseat)", "pkgconfig(libsystemd)", "pkgconfig(libudev)", "pkgconfig(wayland-client)", "pkgconfig(wayland-server)"]
      # The same list in Debian/Ubuntu -dev names (identical on resolute and
      # sid; libwayland-dev carries client and server, libegl-dev and
      # libgbm-dev the Mesa half). libclang-dev is bindgen's libclang. The
      # same floors as Fedora; the rust capability renders bare rustc and
      # cargo, these entries add the 1.92 floor (resolute ships 1.93, sid 1.97).
      ubuntu: [clang, libclang-dev, "rustc (>= 1.92)", "cargo (>= 1.92)", libdbus-1-dev, libglib2.0-dev, "libgtk-4-dev (>= 4.12)", "libgtk4-layer-shell-dev (>= 1.1)", libadwaita-1-dev, libdrm-dev, libinput-dev, libsecret-1-dev, libxkbcommon-dev, libxkbcommon-x11-dev, libgbm-dev, libegl-dev, libpipewire-0.3-dev, libseat-dev, libsystemd-dev, libudev-dev, libwayland-dev]
      debian: [clang, libclang-dev, "rustc (>= 1.92)", "cargo (>= 1.92)", libdbus-1-dev, libglib2.0-dev, "libgtk-4-dev (>= 4.12)", "libgtk4-layer-shell-dev (>= 1.1)", libadwaita-1-dev, libdrm-dev, libinput-dev, libsecret-1-dev, libxkbcommon-dev, libxkbcommon-x11-dev, libgbm-dev, libegl-dev, libpipewire-0.3-dev, libseat-dev, libsystemd-dev, libudev-dev, libwayland-dev]
      # Tumbleweed resolves the same pkgconfig() names as Fedora (zypper
      # installs by capability). clang-devel is bindgen's libclang; `rust` is
      # the toolchain metapackage (1.99 when this was added), so the 1.92
      # floor reads as on Fedora. gtk4-layer-shell 1.3 and libseat are in
      # Tumbleweed's own repositories, not the factory overlay.
      opensuse-tumbleweed: [clang-devel, rust >= 1.92, cargo >= 1.92, "pkgconfig(dbus-1)", "pkgconfig(glib-2.0)", "pkgconfig(gtk4) >= 4.12", "pkgconfig(gtk4-layer-shell-0) >= 1.1", "pkgconfig(libadwaita-1)", "pkgconfig(libdrm)", "pkgconfig(libinput)", "pkgconfig(libsecret-1)", "pkgconfig(xkbcommon)", "pkgconfig(xkbcommon-x11)", "pkgconfig(gbm)", "pkgconfig(egl)", "pkgconfig(libpipewire-0.3)", "pkgconfig(libseat)", "pkgconfig(libsystemd)", "pkgconfig(libudev)", "pkgconfig(wayland-client)", "pkgconfig(wayland-server)"]
  runtime:
    targets:
      # Upstream packaging/arch/PKGBUILD depends=(). Optional integrations
      # (xorg-xwayland, ibus, greetd, xdg-desktop-portal-gnome, orca, ...) are
      # optdepends upstream; the recipe schema has no optdepends, so the
      # Marlin image installs them itself.
      arch: [dbus, glib2, gtk4, gtk4-layer-shell, libadwaita, libdrm, libinput, libsecret, libxkbcommon, libxkbcommon-x11, mesa, pipewire, seatd, systemd-libs, wayland]
      # The same depends in Fedora/EL package names. RPM derives the ELF
      # library requirements itself; listing them keeps the version floors
      # and the packages it cannot see: libpam is dlopen()ed by the lock
      # screen (crates/compositor/src/pam.rs), libsecret is reached over
      # D-Bus, and the dbus and pipewire daemons are services, not links.
      fedora: [dbus, glib2, gtk4 >= 4.12, gtk4-layer-shell >= 1.1, libadwaita, libdrm, libinput, libsecret, libxkbcommon, libxkbcommon-x11, mesa-libEGL, mesa-libgbm, pipewire, libseat, systemd-libs, libwayland-client, libwayland-server, pam]
      rawhide: [dbus, glib2, gtk4 >= 4.12, gtk4-layer-shell >= 1.1, libadwaita, libdrm, libinput, libsecret, libxkbcommon, libxkbcommon-x11, mesa-libEGL, mesa-libgbm, pipewire, libseat, systemd-libs, libwayland-client, libwayland-server, pam]
      eln: [dbus, glib2, gtk4 >= 4.12, gtk4-layer-shell >= 1.1, libadwaita, libdrm, libinput, libsecret, libxkbcommon, libxkbcommon-x11, mesa-libEGL, mesa-libgbm, pipewire, libseat, systemd-libs, libwayland-client, libwayland-server, pam]
      el10: [dbus, glib2, gtk4 >= 4.12, gtk4-layer-shell >= 1.1, libadwaita, libdrm, libinput, libsecret, libxkbcommon, libxkbcommon-x11, mesa-libEGL, mesa-libgbm, pipewire, libseat, systemd-libs, libwayland-client, libwayland-server, pam]
      # Upstream's own .deb Depends (scripts/tuna-release at the tag), beside
      # the ${shlibs:Depends} ELF closure debhelper computes: the GTK 4.12 and
      # gtk4-layer-shell 1.1 floors, the dlopen()ed libpam, the event-sound
      # stack, gsettings schemas and secret-tool. dbus-bin is
      # dbus-update-activation-environment, which v1.0.0-beta.1's session
      # import still runs (tuna-os/tuna-desktop#691 drops it after the tag).
      ubuntu: [gnome-session-canberra, libcanberra-pulse, sound-theme-freedesktop, "libgtk4-layer-shell0 (>= 1.1)", "libgtk-4-1 (>= 4.12)", "libadwaita-1-0 (>= 1.0)", libpam0g, gsettings-desktop-schemas, libsecret-tools, libxkbcommon0, libxkbcommon-x11-0, libegl1, libgl1, libgbm1, libseat1, libinput10, libudev1, libdrm2, libpipewire-0.3-0t64, libglib2.0-0t64, dbus-bin]
      debian: [gnome-session-canberra, libcanberra-pulse, sound-theme-freedesktop, "libgtk4-layer-shell0 (>= 1.1)", "libgtk-4-1 (>= 4.12)", "libadwaita-1-0 (>= 1.0)", libpam0g, gsettings-desktop-schemas, libsecret-tools, libxkbcommon0, libxkbcommon-x11-0, libegl1, libgl1, libgbm1, libseat1, libinput10, libudev1, libdrm2, libpipewire-0.3-0t64, libglib2.0-0t64, dbus-bin]
      # The Fedora list in openSUSE's shared-library package names (glib2 ->
      # libglib-2_0-0, mesa-libEGL -> Mesa-libEGL1, systemd-libs ->
      # libsystemd0 + libudev1), for the same reasons: the floors, the
      # dlopen()ed pam, and the dbus and pipewire services.
      opensuse-tumbleweed: [dbus-1, libglib-2_0-0, libgtk-4-1 >= 4.12, libgtk4-layer-shell0 >= 1.1, libadwaita-1-0, libdrm2, libinput10, libsecret-1-0, libxkbcommon0, libxkbcommon-x11-0, Mesa-libEGL1, libgbm1, pipewire, libseat1, libsystemd0, libudev1, libwayland-client0, libwayland-server0, pam]
install:
  commands:
    - install -Dm0755 target/release/tuna-compositor {destdir}/usr/bin/tuna-compositor
    - install -Dm0755 target/release/tuna-session {destdir}/usr/bin/tuna-session
    - install -Dm0755 target/release/tuna-shell-host {destdir}/usr/bin/tuna-shell-host
    - install -Dm0755 target/release/tuna-shell-gtk {destdir}/usr/bin/tuna-shell-gtk
    - install -Dm0755 target/release/tuna-ibus-bridge {destdir}/usr/bin/tuna-ibus-bridge
    - install -Dm0755 target/release/tuna-greeter {destdir}/usr/bin/tuna-greeter
    # One release of compatibility with the former name (#505), as upstream's
    # PKGBUILD does: the old binary names, as relative symlinks.
    - ln -s tuna-compositor {destdir}/usr/bin/roost-compositor
    - ln -s tuna-session {destdir}/usr/bin/roost-session
    - ln -s tuna-shell-host {destdir}/usr/bin/roost-shell-host
    - ln -s tuna-shell-gtk {destdir}/usr/bin/roost-shell-gtk
    - ln -s tuna-ibus-bridge {destdir}/usr/bin/roost-ibus-bridge
    - ln -s tuna-greeter {destdir}/usr/bin/roost-greeter
  files:
    - {source: share/wayland-sessions/tuna.desktop, destination: usr/share/wayland-sessions/tuna.desktop}
    - {source: share/systemd/user/tuna-session.target, destination: usr/lib/systemd/user/tuna-session.target}
    # Lock-screen PAM service (tuna-desktop#62): unlock under GDM, where no
    # greetd runs.
    - {source: share/pam.d/tuna-lock, destination: etc/pam.d/tuna-lock}
    # Compat (#505): the hidden roost.desktop keeps a session GDM remembers
    # as "roost" starting Tuna Desktop, and roost-lock serves a session
    # started before the upgrade, whose old lock screen still asks PAM for
    # that service (without it PAM falls back to `other` and never unlocks).
    - {source: share/compat/wayland-sessions/roost.desktop, destination: usr/share/wayland-sessions/roost.desktop}
    - {source: share/compat/pam.d/roost-lock, destination: etc/pam.d/roost-lock}
    - {source: LICENSE, destination: usr/share/licenses/tuna-desktop/LICENSE}
    - {source: docs/nested-session.md, destination: usr/share/doc/tuna-desktop/nested-session.md}
files:
  common:
    - usr/bin/tuna-compositor
    - usr/bin/tuna-session
    - usr/bin/tuna-shell-host
    - usr/bin/tuna-shell-gtk
    - usr/bin/tuna-ibus-bridge
    - usr/bin/tuna-greeter
    - usr/bin/roost-compositor
    - usr/bin/roost-session
    - usr/bin/roost-shell-host
    - usr/bin/roost-shell-gtk
    - usr/bin/roost-ibus-bridge
    - usr/bin/roost-greeter
    - usr/share/wayland-sessions/tuna.desktop
    - usr/share/wayland-sessions/roost.desktop
    - usr/lib/systemd/user/tuna-session.target
    - etc/pam.d/tuna-lock
    - etc/pam.d/roost-lock
    - usr/share/licenses/tuna-desktop/LICENSE
    - usr/share/doc/tuna-desktop/nested-session.md
verify:
  # The real session contract, not just "a binary exists": every one of the
  # six binaries runs and reports the upstream tag minus its v (want=, kept
  # equal to TUNA_VERSION), under both its name
  # and its roost-* compat link; the visible session entry launches the
  # session supervisor (not the compositor directly) as desktop Tuna; the
  # hidden compat entry launches the same supervisor; both lock-screen PAM
  # services and the session target are installed. The version is the last
  # word of --version, cut with shell expansion: the Tumbleweed image has no
  # awk.
  smoke: >-
    want=1.0.0-beta.1;
    for b in compositor session shell-host shell-gtk ibus-bridge greeter;
    do v="$(tuna-$b --version)"; v="${v##* }";
    if [ "$v" != "$want" ]; then echo "tuna-$b --version reports '$v', expected $want" >&2; exit 1; fi;
    if [ "$(readlink /usr/bin/roost-$b)" != "tuna-$b" ]; then echo "/usr/bin/roost-$b is not a link to tuna-$b" >&2; exit 1; fi;
    v="$(roost-$b --version)"; v="${v##* }";
    if [ "$v" != "$want" ]; then echo "roost-$b --version reports '$v', expected $want" >&2; exit 1; fi;
    done
    && grep -qx 'Exec=tuna-session' /usr/share/wayland-sessions/tuna.desktop
    && grep -qx 'DesktopNames=Tuna;GNOME;' /usr/share/wayland-sessions/tuna.desktop
    && grep -qx 'Exec=tuna-session' /usr/share/wayland-sessions/roost.desktop
    && grep -qx 'NoDisplay=true' /usr/share/wayland-sessions/roost.desktop
    && test -f /etc/pam.d/tuna-lock
    && test -f /etc/pam.d/roost-lock
    && test -f /usr/lib/systemd/user/tuna-session.target
targets: [arch, fedora, rawhide, eln, el10, ubuntu, debian, opensuse-tumbleweed]
