schema: 1
name: tunaos-rust192
version: "1.92.0"
release: 1
summary: Isolated Noble-native Rust compiler for Tuna Desktop
description: >-
  Official Rust source rebuilt with Ubuntu Noble's signed native Rust 1.91
  compiler, Cargo and standard libraries. Installs an isolated compiler and
  native standard libraries without replacing the system toolchain.
license: Apache-2.0 AND MIT
source:
  url: https://static.rust-lang.org/dist/rustc-1.92.0-src.tar.xz
  sha256: ebee170bfe4c4dfc59521a101de651e5534f4dae889756a5c97ca9ea40d0c307
  directory: rustc-1.92.0-src
build_system: custom
build:
  environment:
    CARGO_NET_OFFLINE: "true"
  commands:
    - |
      python3 - <<'PY'
      import json, os, pathlib, shlex, subprocess
      release = dict(line.split('=', 1) for line in pathlib.Path('/etc/os-release').read_text().splitlines() if '=' in line)
      if release.get('ID', '').strip('"') != 'ubuntu' or release.get('VERSION_ID', '').strip('"') != '24.04':
          raise SystemExit('Ubuntu Noble native buildroot required')
      native = subprocess.check_output(['/usr/bin/rustc-1.91', '-vV'], text=True)
      cargo = subprocess.check_output(['/usr/bin/cargo-1.91', '--version'], text=True)
      if not native.startswith('rustc 1.91.') or not cargo.startswith('cargo 1.91.'):
          raise SystemExit('signed Noble-native Rust/Cargo 1.91 bootstrap required')
      for package, binary in [('rustc-1.91', '/usr/bin/rustc-1.91'), ('cargo-1.91', '/usr/bin/cargo-1.91')]:
          owner = subprocess.check_output(['dpkg-query', '-S', binary], text=True).split(': ', 1)[0]
          if owner.split(':', 1)[0] != package:
              raise SystemExit('bootstrap executable is not owned by its native package')
      host = next(line.split(': ', 1)[1] for line in native.splitlines() if line.startswith('host: '))
      expected = {'x86_64': 'x86_64-unknown-linux-gnu', 'aarch64': 'aarch64-unknown-linux-gnu'}
      if host != expected.get(os.uname().machine):
          raise SystemExit('native bootstrap host mismatch')
      stage0 = pathlib.Path('src/stage0').read_text().splitlines()
      if 'compiler_version=1.91.0' not in stage0:
          raise SystemExit('official source bootstrap predecessor changed')
      if not pathlib.Path('vendor').is_dir() or not pathlib.Path('.cargo/config.toml').is_file():
          raise SystemExit('official source vendoring missing')
      q = json.dumps
      configuration = '\n'.join([
          'profile = "dist"', 'change-id = "ignore"', '[build]',
          'build = ' + q(host), 'host = [' + q(host) + ']', 'target = [' + q(host) + ']',
          'rustc = "/usr/bin/rustc-1.91"', 'cargo = "/usr/bin/cargo-1.91"',
          'vendor = true', 'locked-deps = true', 'submodules = false',
          'docs = false', 'compiler-docs = false', 'extended = true', 'tools = ["cargo"]',
          '[install]', 'prefix = "/opt/tunaos/rust-1.92"', 'libdir = "lib"',
          '[rust]', 'channel = "stable"', 'download-rustc = false',
          'rustflags = ' + q(shlex.split(os.environ.get('RUSTFLAGS', ''))),
          '[llvm]', 'download-ci-llvm = false', 'ninja = true',
          'targets = ' + q('X86' if os.uname().machine == 'x86_64' else 'AArch64'),
          'cflags = ' + q(os.environ.get('CFLAGS', '')),
          'cxxflags = ' + q(os.environ.get('CXXFLAGS', '')),
          '[gcc]', 'download-ci-gcc = false', ''])
      pathlib.Path('bootstrap.toml').write_text(configuration)
      PY
    - python3 x.py build --stage 2 compiler/rustc library/std src/tools/cargo
    - python3 x.py test --stage 2 library/std
    - mkdir -p native-bootstrap-evidence
    - dpkg-query -W rustc-1.91 cargo-1.91 > native-bootstrap-evidence/packages.txt
    - /usr/bin/rustc-1.91 -vV > native-bootstrap-evidence/bootstrap-rustc.txt
    - cp bootstrap.toml src/stage0 native-bootstrap-evidence/
dependencies:
  build:
    common:
      - "rustc-1.91 (>= 1.91)"
      - "cargo-1.91 (>= 1.91)"
      - build-essential
      - cmake
      - ninja-build
      - python3
      - git
      - libssl-dev
      - libcurl4-openssl-dev
      - zlib1g-dev
      - pkg-config
  runtime:
    common: [gcc, binutils, libc6-dev]
install:
  commands:
    - DESTDIR={destdir} python3 x.py install --stage 2
    - install -d {destdir}/usr/share/doc/tunaos-rust192
    - cp native-bootstrap-evidence/* {destdir}/usr/share/doc/tunaos-rust192/
files:
  common: [opt/tunaos/rust-1.92, usr/share/doc/tunaos-rust192]
verify:
  smoke: >-
    /opt/tunaos/rust-1.92/bin/rustc --version | grep '^rustc 1.92.0' &&
    /opt/tunaos/rust-1.92/bin/cargo --version | grep '^cargo 1.92.0' &&
    probe_dir=$(mktemp -d) &&
    printf 'fn main() { println!("native std link passed"); }\n' > "$probe_dir/probe.rs" &&
    /opt/tunaos/rust-1.92/bin/rustc "$probe_dir/probe.rs" -o "$probe_dir/probe" &&
    "$probe_dir/probe" && rm -rf -- "$probe_dir"
targets: [ubuntu-noble]
