schema: 1
name: xdg-desktop-portal-cosmic
version: "1.9.0"
release: 1
summary: XDG desktop portals for the COSMIC desktop environment
description: COSMIC portal backend for screenshots, screen sharing, and desktop integration.
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/epoch-1.9.0.tar.gz
  sha256: 4fcd4631348e98decfd991489a5e9a941792741f5cf127f8ca9e874056c144d6
  directory: xdg-desktop-portal-cosmic-epoch-1.9.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/xdg-desktop-portal-cosmic/vendor-1.9.0.tar.gz/sha512/35a2430a19959411e311dfb4f1139498636ed2ff0339b1197fe54d4bde05aa6ea8c5bc343fa4d8adb31ceb5c96eaff53b07775af45b4e862b7ad91aa7555a45a/vendor-1.9.0.tar.gz
    sha256: d322d16dafaf7d7ed25d9a63d81d8853fd770cc89588a499843c833e9fd32f44
    filename: xdg-desktop-portal-cosmic-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/xdg-desktop-portal-cosmic/raw/8b6622e9807769a25e7cf7053a70488a5d4a9571/f/vendor-config-1.9.0.toml
    sha256: e30bc5d73b1c989867b8691b94abd0e69e54b0e09432ea84a6ab31235a909093
    filename: xdg-desktop-portal-cosmic-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: 2f41161176368840c67e2de9b8a24786accb100c
    VERGEN_GIT_COMMIT_DATE: "2026-09-15 21:52:46 +0200"
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    capabilities: [rust]
    targets:
      # util-linux is for `rev`: upstream's justfile installs icons through a
      # `find | rev | cut | rev` pipeline, and the minimal buildroot only
      # carries util-linux-core, which does not ship rev. The pipeline
      # swallowed the failure (no pipefail; xargs on empty input exits 0), so
      # `just install` reported success while installing zero icons and the
      # build died later at %files with 'File not found' (#169's blind-spot
      # fix surfaced this on the recipe's first-ever CI run, job 91337045768).
      el10: [cargo, lld, just, util-linux, libxkbcommon-devel, wayland-devel, pipewire-devel, clang-devel, mesa-libEGL-devel, mesa-libgbm-devel, gstreamer1-devel, glib2-devel]
      alma10: [cargo, lld, just, util-linux, libxkbcommon-devel, wayland-devel, pipewire-devel, clang-devel, mesa-libEGL-devel, mesa-libgbm-devel, gstreamer1-devel, glib2-devel]
      alma10-kitten: [cargo, lld, just, util-linux, libxkbcommon-devel, wayland-devel, pipewire-devel, clang-devel, mesa-libEGL-devel, mesa-libgbm-devel, gstreamer1-devel, glib2-devel]
      ubuntu: [cargo, lld, just, util-linux, libxkbcommon-dev, libwayland-dev, libpipewire-0.3-dev, clang, libegl1-mesa-dev, libgbm-dev, libgstreamer1.0-dev, libglib2.0-dev]
      debian: [cargo, lld, just, util-linux, libxkbcommon-dev, libwayland-dev, libpipewire-0.3-dev, clang, libegl1-mesa-dev, libgbm-dev, libgstreamer1.0-dev, libglib2.0-dev]
  runtime:
    targets:
      # cosmic-icon-theme is TunaOS-built and ships in neither deb archive;
      # the gate's clean-install repo only holds the cell's own artifact
      # (same call as cosmic-settings, #225).
      el10: [cosmic-icon-theme >= 1.9.0]
      alma10: [cosmic-icon-theme >= 1.9.0]
      alma10-kitten: [cosmic-icon-theme >= 1.9.0]
      ubuntu: []
      debian: []
files:
  common:
    - usr/libexec/xdg-desktop-portal-cosmic
    - usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.cosmic.service
    - usr/lib/systemd/user/org.freedesktop.impl.portal.desktop.cosmic.service
    - usr/share/xdg-desktop-portal/portals/cosmic.portal
    - usr/share/xdg-desktop-portal/cosmic-portals.conf
    - usr/share/icons/hicolor/scalable/actions/screenshot-screen-symbolic.svg
    - usr/share/icons/hicolor/scalable/actions/screenshot-selection-symbolic.svg
    - usr/share/icons/hicolor/scalable/actions/screenshot-window-symbolic.svg
install:
  commands: ["just rootdir={destdir} prefix=/usr install"]
verify:
  smoke: "test -x /usr/libexec/xdg-desktop-portal-cosmic && test -f /usr/share/xdg-desktop-portal/portals/cosmic.portal"
targets: [el10, ubuntu, debian, alma10, alma10-kitten]
